<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>workout_recorder</title>
<style>
/* ============================================================
   Blender-dark theme · mono labels & numbers · sans body
   ============================================================ */
:root{
  --bg:#1e1e1e;
  --panel:#272727;
  --panel2:#303030;
  --panel3:#383838;
  --line:#3d3d3d;
  --line2:#4b4b4b;
  --text:#e6e3de;
  --muted:#9c9892;
  --faint:#6f6c66;
  --orange:#f5871f;
  --orange-hi:#ff9d3c;
  --orange-ink:#1b1206;
  --blue:#5b8dc9;
  --green:#8db862;
  --amber:#e0b13c;
  --red:#d15750;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","Fira Code",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
::placeholder{color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(30,30,30,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:14px;letter-spacing:.04em;color:var(--text)}
.brand .dot{color:var(--orange)}
.topbar .spacer{flex:1}
.iconbtn{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:6px 10px;background:var(--panel)}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}

main{max-width:680px;margin:0 auto;padding:16px 14px 24px}

/* type helpers */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono)}
h1.page{font-family:var(--mono);font-size:20px;font-weight:600;margin:6px 0 2px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--mono);font-size:13px;letter-spacing:.02em;
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:10px 14px;color:var(--text);min-height:40px}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);font-weight:700}
.btn.primary:hover{background:var(--orange-hi);border-color:var(--orange-hi)}
.btn.danger{color:var(--red);border-color:#5a3230}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel)}
.btn.small{padding:6px 10px;min-height:32px;font-size:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* home list */
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.witem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.witem:hover{border-color:var(--line2);background:#2b2b2b}
.witem .wdate{font-family:var(--mono);font-size:12px;color:var(--orange);min-width:86px}
.witem .wname{font-weight:600}
.witem .wsum{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.witem .flex{flex:1;min-width:0}
.witem .tag-live{font-family:var(--mono);font-size:10px;color:var(--green);border:1px solid #3c4f2e;
  border-radius:3px;padding:2px 6px;letter-spacing:.1em}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px 18px;color:var(--muted);
  text-align:center;margin-top:16px;font-size:14px}
.empty a{color:var(--blue);cursor:pointer;text-decoration:underline}

/* home tabs */
.hometabs{display:flex;gap:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;width:fit-content;margin:14px 0 4px}
.hometabs button{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;padding:8px 16px;color:var(--muted);background:var(--panel)}
.hometabs button + button{border-left:1px solid var(--line2)}
.hometabs button.on{background:var(--orange);color:var(--orange-ink);font-weight:700}

/* calendar */
.cal{margin-top:14px}
.cal-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-h .mo{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.02em;min-width:150px;text-align:center}
.cal-h .nav{font-family:var(--mono);font-size:16px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;width:38px;height:38px;background:var(--panel)}
.cal-h .nav:hover{color:var(--text);border-color:var(--line2)}
.cal-h .stat{flex:1;text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);text-align:center;
  padding:2px 0 4px;text-transform:uppercase}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:5px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;
  font-family:var(--mono);font-size:14px;color:var(--muted)}
.cal-cell.blank{border-color:transparent;background:none}
.cal-cell.today{border-color:var(--line2);color:var(--text)}
.cal-cell.today::after{content:"today";position:absolute;bottom:3px;font-size:7px;letter-spacing:.06em;color:var(--faint)}
.cal-cell.has{color:var(--text);cursor:pointer;border-color:#4a3a24;background:#2a2419}
.cal-cell.has:hover{border-color:var(--orange)}
.cal-cell.sel{border-color:var(--orange);background:#33291a;color:var(--orange-hi)}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--orange)}
.cal-cell .cnt{position:absolute;top:3px;right:5px;font-size:8px;color:var(--faint)}
.cal-day-panel{margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px 14px}
.cal-day-panel .pd{font-family:var(--mono);font-size:12px;color:var(--orange);letter-spacing:.04em;margin-bottom:8px}
.cal-day-panel .rest{color:var(--faint)}

/* workout header */
.whead{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.whead input.wname{background:none;border:none;border-bottom:1px dashed var(--line2);border-radius:0;
  font-family:var(--mono);font-size:18px;font-weight:600;padding:2px 2px;flex:1;min-width:150px}
.whead input.wname:focus{border-bottom-color:var(--orange)}
.whead input.wdate-input{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 8px;color-scheme:dark}
.whead input.wdate-input:focus{border-color:var(--orange);color:var(--text)}
.whead .wdate{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* exercise card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card.stopped{opacity:.75}
.card-h{display:flex;align-items:flex-start;gap:8px;padding:12px 12px 0}
.card-h .exname{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.01em;flex:1;line-height:1.3}
.card-h .exname .modechip{font-size:10px;font-weight:400;color:var(--faint);letter-spacing:.12em;
  text-transform:uppercase;margin-left:8px}
.setupline{font-family:var(--mono);font-size:12px;color:var(--muted);padding:3px 12px 0;white-space:pre-wrap;word-break:break-word}
.restline{font-family:var(--mono);font-size:11px;color:var(--faint);padding:2px 12px 0;letter-spacing:.05em}
.nextline{font-family:var(--mono);font-size:11.5px;padding:6px 12px 0}
.nextline .k{color:var(--faint)}
.nextline .v{color:var(--blue)}
.nextline .warn{color:var(--red)}
.ringline{font-family:var(--mono);font-size:12px;color:var(--orange);padding:3px 12px 0;letter-spacing:.03em}
.ringline.bad{color:var(--red)}
.ringline.faint{color:var(--faint)}
.ring-readout{font-family:var(--mono);font-size:13px;color:var(--orange);background:#2a2419;border:1px solid #4a3a24;
  border-radius:4px;padding:8px 10px;margin-top:8px;letter-spacing:.02em}
.ring-readout.bad{color:var(--red);background:#2c2020;border-color:#5a3230}
.ringsec{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.calib{border:1px solid var(--line);border-radius:6px;background:#242424;padding:12px;margin-top:6px}
.calib-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.calib .btn{margin-top:8px}
.import-sec{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.import-msg{margin-top:8px;padding:8px 10px;border-radius:4px;font-family:var(--mono);font-size:12px}
.import-msg.ok{color:var(--green);background:#232a1d;border:1px solid #40532f}
.import-msg.bad{color:var(--red);background:#2c2020;border:1px solid #5a3230}
.card-body{padding:8px 8px 4px}
.card-f{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px 10px}
.painbar{margin:8px;border:1px solid #5a3230;background:#2c2020;border-radius:4px;padding:9px 10px;font-size:13px}
.painbar .btnrow{margin-top:8px}
.stoppedline{font-family:var(--mono);font-size:11px;color:var(--red);padding:6px 12px;letter-spacing:.08em}

/* ladder blocks */
.ladder{border:1px solid var(--line);border-radius:4px;margin:6px 4px;background:#242424}
.ladder-h{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint);
  letter-spacing:.12em;text-transform:uppercase;padding:7px 10px 2px}
.ladder-h .fill{flex:1}
.ladder .addrung{margin:2px 8px 8px}

/* set rows */
.set{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:4px;flex-wrap:wrap}
.set .actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.set + .set{border-top:1px solid #2e2e2e}
.set .idx{font-family:var(--mono);font-size:11px;color:var(--faint);width:26px;text-align:right;flex:none}
.set .val{font-family:var(--mono);font-size:16px;font-weight:700;background:var(--panel2);
  border:1px solid var(--line2);border-radius:4px;padding:8px 10px;min-width:64px;text-align:center}
.set .val .u{font-size:11px;font-weight:400;color:var(--muted)}
.set .val:hover{border-color:var(--orange)}
.set.planned .val{color:var(--muted);font-weight:600;border-style:dashed}
.set .stp{font-family:var(--mono);font-size:16px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;width:34px;height:38px;flex:none;background:var(--panel)}
.set .stp:hover{color:var(--text);border-color:var(--line2)}
.set .grow{flex:1}
.set .done-btn{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.05em;
  background:var(--orange);color:var(--orange-ink);border-radius:5px;padding:10px 16px;min-height:40px}
.set .done-btn:hover{background:var(--orange-hi)}
.set .minor{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);
  border-radius:3px;padding:5px 7px;letter-spacing:.06em}
.set .minor:hover{color:var(--muted);border-color:var(--line2)}
.chips{display:flex;gap:4px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--line);
  border-radius:3px;padding:6px 8px;color:var(--faint);min-height:32px}
.chip.on-clean{color:var(--green);border-color:#40532f;background:#232a1d}
.chip.on-ugly{color:var(--amber);border-color:#5d4a1e;background:#2b2519}
.chip.on-pain{color:var(--red);border-color:#5a3230;background:#2c2020}
.set .note-ind{font-size:11px;color:var(--blue)}
.status-word{font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.status-word.failed{color:var(--red)}
.status-word.skipped{color:var(--faint)}

/* set editor */
.setedit{background:#242424;border:1px solid var(--line);border-radius:4px;margin:2px 6px 8px;padding:10px}
.setedit .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.setedit label{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.setedit input[type=text],.setedit input[type=number]{width:86px;text-align:center;font-family:var(--mono)}
.setedit input.notein{width:100%;text-align:left;font-family:var(--sans)}
.setedit select{font-family:var(--mono)}
.setedit .timing{font-family:var(--mono);font-size:11.5px;color:var(--blue);margin:-2px 0 9px;line-height:1.5}
.setedit .timing.off{color:var(--faint)}
.setedit .timing .k{color:var(--faint)}
.setedit .timing b{color:#8fb4de}

/* card menu */
.menu{background:#242424;border:1px solid var(--line);border-radius:4px;margin:6px 8px;padding:6px;
  display:flex;flex-wrap:wrap;gap:6px}

/* notes */
.exnotes{margin:6px 8px}
.exnotes textarea{width:100%;min-height:60px;font-family:var(--sans);font-size:13.5px}

/* add exercise / overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(12,12,12,.66);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel);border:1px solid var(--line2);border-bottom:none;
  border-radius:10px 10px 0 0;width:100%;max-width:680px;max-height:88vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--mono);font-size:15px;margin:0 0 12px;letter-spacing:.03em}
.sheet .frow{margin-bottom:12px}
.sheet label.lab{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.sheet label.lab sub{text-transform:lowercase;font-size:.78em;letter-spacing:0}
.exname-wrap{position:relative}
.exlist{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;
  max-height:210px;overflow:auto;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.exlist.open{display:block}
.exitem{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13px;
  padding:9px 11px;color:var(--text);border-bottom:1px solid var(--line)}
.exitem:last-child{border-bottom:none}
.exitem:hover{background:var(--orange);color:var(--orange-ink)}
.exitem .mt{color:var(--orange)}
.exitem:hover .mt{color:var(--orange-ink);font-weight:700}
.sheet input[type=text],.sheet textarea{width:100%}
.sheet textarea{min-height:64px}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:5px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:12.5px;padding:9px 13px;color:var(--muted);background:var(--panel2)}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--orange);color:var(--orange-ink);font-weight:700}
.hint{font-size:12px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
/* amber notice: a constraint the user needs to see, distinct from the red of
   pain/failure and the orange of computed readouts */
.notice{display:flex;gap:9px;align-items:flex-start;margin-top:8px;padding:9px 11px;
  font-family:var(--mono);font-size:12px;line-height:1.5;
  color:var(--amber);background:#2b2519;border:1px solid #5d4a1e;border-left:3px solid var(--amber);
  border-radius:4px}
.notice .ico{flex:none;line-height:1.5}
.notice b{color:#f2cf6b}
.inline2{display:flex;gap:10px;flex-wrap:wrap}
.inline2 .frow{flex:1;min-width:130px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}

/* export */
.exp-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.exp-out{width:100%;min-height:240px;font-family:var(--mono);font-size:12.5px;line-height:1.5;
  background:#1a1a1a;border-color:var(--line);white-space:pre;overflow:auto}

/* clone preview */
.clone-prev{border:1px solid var(--line);border-radius:4px;background:#242424;padding:10px 12px;margin-bottom:12px}
.clone-prev .pl{display:flex;gap:10px;font-family:var(--mono);font-size:12.5px;padding:3px 0;flex-wrap:wrap}
.clone-prev .pn{color:var(--text);min-width:150px}
.clone-prev .pt{color:var(--blue)}
.clone-prev .pr{color:var(--faint);font-size:11px}
.clone-prev .pw{color:var(--red);font-size:11px}
.togglerow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.togglerow input{width:auto}

/* timer bar — signature element */
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:#232323;border-top:1px solid var(--line2);
  padding:0 0 env(safe-area-inset-bottom,0px)}
.timerbar .fillwrap{position:relative;height:64px;max-width:680px;margin:0 auto;overflow:hidden}
.timerbar .fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#7a4410,#a95c12);
  transition:width .25s linear}
.timerbar.over .fill{background:linear-gradient(90deg,#8a6a1d,#b98a22);width:100%!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:.55}}
.timerbar .content{position:relative;display:flex;align-items:center;gap:12px;height:64px;padding:0 14px}
.timerbar .tlab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#cbb59a;max-width:38%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timerbar .tmain{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em}
.timerbar.over .tmain{color:#ffd88a}
.timerbar .ttarget{font-family:var(--mono);font-size:12px;color:#cbb59a}
.timerbar .fillsp{flex:1}
.timerbar .tstop{font-family:var(--mono);font-size:12px;border:1px solid #6a5030;border-radius:4px;
  padding:8px 12px;color:#e8d5b8;background:rgba(0,0,0,.25)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot">●</span> workout_recorder</div>
  <div class="spacer"></div>
  <button class="iconbtn" data-a="settings-open" title="rigging & profile" aria-label="rigging and profile settings">⚙ setup</button>
  <button class="iconbtn" id="soundbtn" data-a="sound-toggle" title="timer sound">♪ on</button>
</header>

<main id="app"></main>

<div id="timerbar" class="timerbar hidden" role="timer" aria-live="off">
  <div class="fillwrap">
    <div class="fill" id="tfill"></div>
    <div class="content">
      <div class="tlab" id="tlab">rest</div>
      <div class="tmain" id="tmain">0:00</div>
      <div class="ttarget" id="ttarget">/ 2:30</div>
      <div class="fillsp"></div>
      <button class="tstop" data-a="timer-stop">stop</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden"></div>

<script>
'use strict';
/* ======== pure helpers ======== */
/* Procedural helpers: explicit loops, direct data flow, no hidden pipelines.
   Style target: snake_case variables, camelCase functions, old-school syntax.
*/
let month_names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

function uid()
{
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function esc(value)
{
  let text = String(value == null ? '' : value);
  let out = '';
  let i;
  let ch;

  for (i = 0; i < text.length; ++i)
  {
    ch = text.charAt(i);

    switch (ch)
    {
      case '&':
        out += '&amp;';
        break;

      case '<':
        out += '&lt;';
        break;

      case '>':
        out += '&gt;';
        break;

      case '"':
        out += '&quot;';
        break;

      case "'":
        out += '&#39;';
        break;

      default:
        out += ch;
        break;
    }
  }

  return out;
}

function fmtRest(sec)
{
  let whole = Math.max(0, Math.round(sec || 0));
  let mins = Math.floor(whole/60);
  let secs = whole % 60;

  return mins + ':' + String(secs).padStart(2, '0');
}

function parseRest(value)
{
  let text;
  let parts;
  let mins;
  let secs;
  let num;

  if (value == null)
  {
    return null;
  }

  text = String(value).trim();
  if (!text)
  {
    return null;
  }

  if (text.indexOf(':') >= 0)
  {
    parts = text.split(':');
    mins = parseInt(parts[0], 10) || 0;
    secs = parseInt(parts[1], 10) || 0;
    return mins*60 + secs;
  }

  num = parseFloat(text);
  if (isNaN(num))
  {
    return null;
  }

  return Math.round(num);
}

/* "8/8/8", "8, 8, 8", "15x8, 10x12" -> [{ reps, load? }] */
function parseTargets(value)
{
  let items;
  let out = [];
  let i;
  let text;
  let match;
  let reps;

  if (!value)
  {
    return out;
  }

  items = String(value).split(/[\/,]+/);

  for (i = 0; i < items.length; ++i)
  {
    text = items[i].trim();
    if (!text)
    {
      continue;
    }

    match = text.match(/^(\d+(?:\.\d+)?)\s*[x×]\s*(\d+)$/i);
    if (match)
    {
      out.push({
        reps: parseInt(match[2], 10),
        load: parseFloat(match[1])
      });
      continue;
    }

    reps = parseInt(text, 10);
    if (!isNaN(reps))
    {
      out.push({ reps: reps });
    }
  }

  return out;
}

/* "3 3 2" or "3/3/2" -> [3, 3, 2] */
function parseTops(value)
{
  let items;
  let out = [];
  let i;
  let num;

  if (!value)
  {
    return out;
  }

  items = String(value).split(/[\s\/,]+/);

  for (i = 0; i < items.length; ++i)
  {
    num = parseInt(items[i], 10);
    if (num > 0)
    {
      out.push(num);
    }
  }

  return out;
}

/* ladders as explicit rung lists — the rungs ARE the rep targets, so they can be
   arbitrary (1,2,4,5) rather than forced to 1..top.
     "3 3 2"                  -> [[1,2,3],[1,2,3],[1,2]]   tops shorthand
     "1,2,4,5 / 1,2,3"        -> [[1,2,4,5],[1,2,3]]       explicit
   a string containing ',' or '/' is explicit; anything else is the shorthand. */
function parseLadders(value)
{
  let out = [];
  let text;
  let groups;
  let parts;
  let rungs;
  let tops;
  let i;
  let j;
  let num;

  if (!value)
  {
    return out;
  }

  text = String(value);

  if (text.indexOf(',') < 0 && text.indexOf('/') < 0)
  {
    tops = parseTops(text);
    for (i = 0; i < tops.length; ++i)
    {
      rungs = [];
      for (j = 1; j <= tops[i]; ++j)
      {
        rungs.push(j);
      }
      out.push(rungs);
    }
    return out;
  }

  groups = text.split('/');
  for (i = 0; i < groups.length; ++i)
  {
    parts = groups[i].split(/[\s,]+/);
    rungs = [];

    for (j = 0; j < parts.length; ++j)
    {
      num = parseInt(parts[j], 10);
      if (num > 0)
      {
        rungs.push(num);
      }
    }

    if (rungs.length)
    {
      out.push(rungs);
    }
  }

  return out;
}

/* a ladder is "regular" when its rungs are exactly 1..top */
function laddersRegular(ladder_rungs)
{
  let i;
  let j;
  let rungs;

  for (i = 0; i < ladder_rungs.length; ++i)
  {
    rungs = ladder_rungs[i];
    for (j = 0; j < rungs.length; ++j)
    {
      if (rungs[j] != j + 1)
      {
        return false;
      }
    }
  }

  return true;
}

/* serialize for the edit field. regular ladders keep the familiar "3 3 2"
   shorthand (which always round-trips); custom rung lists round-trip
   explicitly so nothing gets silently regenerated. */
function laddersLabel(ladder_rungs)
{
  let parts = [];
  let text;
  let i;

  if (!ladder_rungs.length)
  {
    return '';
  }

  if (laddersRegular(ladder_rungs))
  {
    for (i = 0; i < ladder_rungs.length; ++i)
    {
      parts.push(ladder_rungs[i].length);
    }
    return parts.join(' ');
  }

  for (i = 0; i < ladder_rungs.length; ++i)
  {
    parts.push(ladder_rungs[i].join(','));
  }
  text = parts.join(' / ');

  /* a lone custom rung ("5") would read back as a top; force explicit parsing */
  if (text.indexOf(',') < 0 && text.indexOf('/') < 0)
  {
    text = text + ' /';
  }

  return text;
}

/* human-facing form: "3 / 3 / 2" when regular, "1·2·4·5 / 1·2·3" when custom */
function laddersDisplay(ladder_rungs)
{
  let parts = [];
  let i;

  if (laddersRegular(ladder_rungs))
  {
    for (i = 0; i < ladder_rungs.length; ++i)
    {
      parts.push(ladder_rungs[i].length);
    }
    return parts.join(' / ');
  }

  for (i = 0; i < ladder_rungs.length; ++i)
  {
    parts.push(ladder_rungs[i].join('·'));
  }

  return parts.join(' / ');
}

function dateHeading(iso)
{
  return iso;
}

function todayISO()
{
  let d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function isoOf(year, month, day)
{
  return year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
}

function monthName(month)
{
  return month_names[month];
}

function monthCells(year, month)
{
  let start_offset = new Date(year, month, 1).getDay();
  let days_in_month = new Date(year, month + 1, 0).getDate();
  let cells = [];
  let i;
  let day;

  for (i = 0; i < start_offset; ++i)
  {
    cells.push(null);
  }

  for (day = 1; day <= days_in_month; ++day)
  {
    cells.push(day);
  }

  while (cells.length % 7)
  {
    cells.push(null);
  }

  return cells;
}

function workoutsByDate(workouts)
{
  let map = {};
  let i;
  let workout;

  for (i = 0; i < workouts.length; ++i)
  {
    workout = workouts[i];
    if (!map[workout.date])
    {
      map[workout.date] = [];
    }
    map[workout.date].push(workout);
  }

  return map;
}

function workoutSummary(workout)
{
  let set_count = 0;
  let i;
  let j;

  for (i = 0; i < workout.exercises.length; ++i)
  {
    for (j = 0; j < workout.exercises[i].sets.length; ++j)
    {
      if (isDone(workout.exercises[i].sets[j]))
      {
        ++set_count;
      }
    }
  }

  return workout.exercises.length + (workout.exercises.length == 1 ? ' exercise' : ' exercises') +
    ' · ' + set_count + (set_count == 1 ? ' set' : ' sets');
}

function isDone(set)
{
  return set.status == 'done_clean' || set.status == 'done_ugly' || set.status == 'pain';
}

function isPerformed(set)
{
  return isDone(set) || set.status == 'failed' || set.status == 'skipped';
}

function laddersOf(ex)
{
  let map = {};
  let keys;
  let ladders = [];
  let i;
  let ladderIndex;
  let key;

  for (i = 0; i < ex.sets.length; ++i)
  {
    ladderIndex = ex.sets[i].ladderIndex || 1;
    if (!map[ladderIndex])
    {
      map[ladderIndex] = [];
    }
    map[ladderIndex].push(ex.sets[i]);
  }

  keys = Object.keys(map);
  keys.sort(function(a, b)
  {
    return Number(a) - Number(b);
  });

  for (i = 0; i < keys.length; ++i)
  {
    key = keys[i];
    map[key].sort(function(a, b)
    {
      return (a.rungIndex || 0) - (b.rungIndex || 0);
    });
    ladders.push({
      idx: Number(key),
      sets: map[key]
    });
  }

  return ladders;
}

/* the rep targets of each ladder, in rung order: [[1,2,4,5],[1,2,3]] */
function rungsOf(ex)
{
  let ladders = laddersOf(ex);
  let out = [];
  let rungs;
  let value;
  let i;
  let j;

  for (i = 0; i < ladders.length; ++i)
  {
    rungs = [];
    for (j = 0; j < ladders[i].sets.length; ++j)
    {
      value = ladders[i].sets[j].target;
      if (value == null)
      {
        value = ladders[i].sets[j].reps;
      }
      rungs.push(value || 0);
    }
    out.push(rungs);
  }

  return out;
}

function topsOf(ex)
{
  let rung_lists = rungsOf(ex);
  let tops = [];
  let top;
  let i;
  let j;

  for (i = 0; i < rung_lists.length; ++i)
  {
    top = 0;
    for (j = 0; j < rung_lists[i].length; ++j)
    {
      if (rung_lists[i][j] > top)
      {
        top = rung_lists[i][j];
      }
    }
    tops.push(top);
  }

  return tops;
}

/* ladderIndex and rungIndex are ordering keys only — the rep count lives in
   target. deletes and the old max+1 add-rung could leave gaps (1,2,3,5,6),
   which is what made rung_index look wrong in the CSV. renumber by sorted
   position; order is preserved, so this is safe to run on load. */
function normalizeLadders(ex)
{
  let ladders;
  let i;
  let j;

  if (ex.mode != 'ladder')
  {
    return;
  }

  ladders = laddersOf(ex);

  for (i = 0; i < ladders.length; ++i)
  {
    for (j = 0; j < ladders[i].sets.length; ++j)
    {
      ladders[i].sets[j].ladderIndex = i + 1;
      ladders[i].sets[j].rungIndex = j + 1;
    }
  }
}

/* sets in the order they are actually performed — ladders in order, rungs in
   rung order — each tagged with its 1-based position. exports walk this instead
   of the raw insertion-ordered array. */
function orderedSetsOf(ex)
{
  let out = [];
  let ladders;
  let i;
  let j;

  if (ex.mode != 'ladder')
  {
    for (i = 0; i < ex.sets.length; ++i)
    {
      out.push({ set: ex.sets[i], ladder_index: null, rung_pos: null });
    }
    return out;
  }

  ladders = laddersOf(ex);

  for (i = 0; i < ladders.length; ++i)
  {
    for (j = 0; j < ladders[i].sets.length; ++j)
    {
      out.push({ set: ladders[i].sets[j], ladder_index: ladders[i].idx, rung_pos: j + 1 });
    }
  }

  return out;
}

function performedSetsOf(ex)
{
  let out = [];
  let i;

  for (i = 0; i < ex.sets.length; ++i)
  {
    if (isPerformed(ex.sets[i]))
    {
      out.push(ex.sets[i]);
    }
  }

  return out;
}

/* progression suggestions — transparent rules from the design doc */
function suggestForExercise(ex)
{
  let performed = performedSetsOf(ex);
  let any_pain = !!ex.stopped;
  let any_ugly = false;
  let any_fail = false;
  let i;
  let tops;
  let rung_lists;
  let next_ladders;
  let rungs;
  let complete;
  let next;
  let bumped;
  let base_sets;
  let targets = [];
  let all_clean;

  for (i = 0; i < performed.length; ++i)
  {
    if (performed[i].status == 'pain')
    {
      any_pain = true;
    }
    else if (performed[i].status == 'done_ugly')
    {
      any_ugly = true;
    }
    else if (performed[i].status == 'failed' || performed[i].status == 'skipped')
    {
      any_fail = true;
    }
  }

  if (ex.mode == 'ladder')
  {
    rung_lists = rungsOf(ex);
    if (!rung_lists.length)
    {
      rung_lists = [[1]];
    }
    tops = topsOf(ex);
    if (!tops.length)
    {
      tops = [1];
    }

    if (any_pain)
    {
      return { kind: 'ladder', ladders: rung_lists, reason: 'pain — do not progress; consider an easier variation', warn: true };
    }

    complete = performed.length > 0;
    for (i = 0; i < ex.sets.length && complete; ++i)
    {
      if (ex.sets[i].status != 'done_clean')
      {
        complete = false;
      }
    }

    if (!complete)
    {
      return {
        kind: 'ladder',
        ladders: rung_lists,
        reason: performed.length
          ? 'repeat — ' + (any_fail ? 'failed/skipped rung' : any_ugly ? 'ugly reps' : 'partial ladder')
          : 'no data yet — same target'
      };
    }

    next = tops.slice();
    bumped = false;

    for (i = 1; i < next.length; ++i)
    {
      if (next[i] < next[0])
      {
        ++next[i];
        bumped = true;
        break;
      }
    }

    if (!bumped)
    {
      ++next[0];
    }

    /* apply the bump by APPENDING one rung at the new top. for a regular ladder
       this reproduces the old 1..top rebuild exactly; for a custom one it keeps
       the existing rungs untouched instead of regenerating them. */
    next_ladders = [];
    for (i = 0; i < rung_lists.length; ++i)
    {
      rungs = rung_lists[i].slice();
      if (next[i] > tops[i])
      {
        rungs.push(next[i]);
      }
      next_ladders.push(rungs);
    }

    return { kind: 'ladder', ladders: next_ladders, reason: 'all rungs clean — +1 rung' };
  }

  base_sets = performed.length ? performed : ex.sets;
  for (i = 0; i < base_sets.length; ++i)
  {
    targets.push({
      reps: (base_sets[i].target != null ? base_sets[i].target : base_sets[i].reps) || 0,
      load: base_sets[i].load
    });
  }

  if (!targets.length)
  {
    targets.push({ reps: 0 });
  }

  if (any_pain)
  {
    return { kind: 'sets', targets: targets, reason: 'pain — do not progress; consider an easier variation or less volume', warn: true };
  }

  if (any_ugly || any_fail)
  {
    return {
      kind: 'sets',
      targets: targets,
      reason: 'repeat same target — ' + (any_ugly ? 'ugly reps last time' : 'failed/skipped set')
    };
  }

  all_clean = performed.length > 0;
  for (i = 0; i < performed.length && all_clean; ++i)
  {
    if (performed[i].status != 'done_clean' || (performed[i].reps || 0) < (performed[i].target || 0))
    {
      all_clean = false;
    }
  }

  if (all_clean)
  {
    targets = targets.slice();
    targets[0] = { reps: targets[0].reps + 1, load: targets[0].load };
    return { kind: 'sets', targets: targets, reason: 'all sets clean — +1 rep on first set' };
  }

  return { kind: 'sets', targets: targets, reason: performed.length ? 'repeat same target' : 'no data yet — same target' };
}

function targetsLabel(suggestion)
{
  let parts = [];
  let i;

  if (suggestion.kind == 'ladder')
  {
    return 'ladders ' + laddersDisplay(suggestion.ladders);
  }

  for (i = 0; i < suggestion.targets.length; ++i)
  {
    parts.push((suggestion.targets[i].load != null ? suggestion.targets[i].load + 'x' : '') + suggestion.targets[i].reps);
  }

  return parts.join(' / ');
}

/* ---------- derived timings ----------

   doneAt is the only raw fact we record: the moment DONE was tapped. everything
   else follows by subtraction, so nothing is cached and a corrected timestamp
   re-derives cleanly.

     cycle(N)  = doneAt(N+1) - doneAt(N)      the whole gap between two taps
     work(N+1) = cycle(N) - restTarget(N)     what is left after the intended rest

   note WHICH set each belongs to: the rest that follows set N is restTarget(N),
   so subtracting it from that gap leaves the work of set N+1, not of set N. the
   first performed set has no predecessor and therefore no derived work.

   this leans on rest_actual ~= rest_target — i.e. that you start moving at the
   beep. two ways that breaks, each reported distinctly rather than as a number:
   'early' (you went before the beep, so work comes out <= 0) and 'lingered' (you
   rested well past it, so the surplus inflates work past any real set). a TIMED
   set needs none of this — its duration is the logged value, so work is exact
   and rest becomes the exact remainder. */
/* a single set that ran longer than this is not a set — it means the rest-target
   assumption broke, not that you held a five-minute rep */
const MAX_SET_SECONDS = 180;

function setTimings(ex)
{
  let ordered = orderedSetsOf(ex);
  let out = {};
  let prev = null;
  let set;
  let cycle;
  let work;
  let exact;
  let status;
  let i;

  for (i = 0; i < ordered.length; ++i)
  {
    set = ordered[i].set;

    if (!isPerformed(set) || set.doneAt == null)
    {
      continue;
    }

    if (prev != null)
    {
      cycle = Math.round((set.doneAt - prev.doneAt)/1000);

      /* a timed set already RECORDS its duration — no need to infer one, and no
         assumption to break. rest is then the exact remainder. */
      exact = ex.mode == 'timed' && set.reps != null;
      work = exact ? set.reps : cycle - (prev.restTarget || 0);

      if (exact)
      {
        status = 'exact';
      }
      else if (work <= 0)
      {
        status = 'early';        /* started before the beep — rested less than target */
      }
      else if (work > MAX_SET_SECONDS)
      {
        status = 'lingered';     /* rested well past the beep; the surplus is not work */
      }
      else
      {
        status = 'estimate';
      }

      out[set.id] = {
        cycle: cycle,
        work: work,
        rest: exact ? cycle - work : (prev.restTarget || 0),
        rest_target: prev.restTarget || 0,
        status: status
      };
    }

    prev = set;
  }

  return out;
}

/* short durations read better as seconds than as 0:14 */
function fmtDur(sec)
{
  if (sec == null)
  {
    return '';
  }
  if (sec < 60)
  {
    return sec + 's';
  }

  return fmtRest(sec);
}
/* ---------- exports ---------- */
function setLineText(ex, set)
{
  let tag = '';
  let reps = set.reps != null ? set.reps : set.target || 0;

  switch (set.status)
  {
    case 'done_ugly':
      tag = ' ugly';
      break;

    case 'pain':
      tag = ' pain';
      break;

    case 'failed':
      tag = ' failed';
      break;

    case 'skipped':
      tag = ' skipped';
      break;
  }

  if (ex.mode == 'timed')
  {
    return reps + ' sec' + tag;
  }
  if (set.load != null)
  {
    return set.load + ' ' + (set.unit || 'kg') + ' x ' + reps + ' reps' + tag;
  }

  return reps + ' reps' + tag;
}

function buildPlain(workout, rig, profile)
{
  let out = ['Workout - ' + workout.date, ''];
  let i;
  let j;
  let ex;
  let performed;
  let ri;
  let ladders;
  let ladder;
  let rung_texts;
  let set;
  let rung_text;

  for (i = 0; i < workout.exercises.length; ++i)
  {
    ex = workout.exercises[i];
    performed = performedSetsOf(ex);
    if (!performed.length)
    {
      continue;
    }

    out.push(ex.name);

    if (ex.setup)
    {
      out.push('Setup: ' + ex.setup.replace(/\n+/g, '; '));
    }

    ri = ringInfo(ex, rig, profile);
    if (ri && ri.deg != null)
    {
      out.push('Rings: ' + ri.label + ' ' + ri.deg.toFixed(1) + '° (Rr ' + ri.Rr + ', H ' + (ri.H >= 0 ? '+' : '') + ri.H + ' cm)');
    }

    if (ex.mode == 'ladder')
    {
      ladders = laddersOf(ex);
      for (j = 0; j < ladders.length; ++j)
      {
        ladder = ladders[j];
        rung_texts = [];

        for (let k = 0; k < ladder.sets.length; ++k)
        {
          set = ladder.sets[k];
          if (!isPerformed(set))
          {
            continue;
          }

          rung_text = String(set.reps != null ? set.reps : set.target);
          if (set.status == 'done_ugly')
          {
            rung_text += ' ugly';
          }
          else if (set.status == 'pain')
          {
            rung_text += ' pain';
          }
          else if (set.status == 'failed')
          {
            rung_text += ' failed';
          }
          else if (set.status == 'skipped')
          {
            rung_text += ' skip';
          }

          rung_texts.push(rung_text);
        }

        if (rung_texts.length)
        {
          out.push('Ladder ' + ladder.idx + ': ' + rung_texts.join(' / '));
        }
      }
    }
    else 
    {
      for (j = 0; j < performed.length; ++j)
      {
        out.push(setLineText(ex, performed[j]));
      }
    }

    if (ex.notes)
    {
      out.push('Note: ' + ex.notes.replace(/\n+/g, '; '));
    }

    out.push('');
  }

  if (workout.notes)
  {
    out.push('Notes: ' + workout.notes);
  }

  return out.join('\n').replace(/\n+$/, '') + '\n';
}

function buildCompact(workout, rig, profile)
{
  let out = [];
  let i;
  let j;
  let ex;
  let performed;
  let body_parts;
  let ladder_parts;
  let ladders;
  let set;
  let tag;
  let reps;
  let uses_load;

  for (i = 0; i < workout.exercises.length; ++i)
  {
    ex = workout.exercises[i];
    performed = performedSetsOf(ex);
    if (!performed.length)
    {
      continue;
    }

    body_parts = [];

    if (ex.mode == 'ladder')
    {
      ladders = laddersOf(ex);
      for (j = 0; j < ladders.length; ++j)
      {
        ladder_parts = [];

        for (let k = 0; k < ladders[j].sets.length; ++k)
        {
          set = ladders[j].sets[k];
          if (!isPerformed(set))
          {
            continue;
          }

          tag = '';
          if (set.status == 'done_ugly')
          {
            tag = 'u';
          }
          else if (set.status == 'pain')
          {
            tag = '!';
          }
          else if (set.status == 'failed')
          {
            tag = 'x';
          }
          else if (set.status == 'skipped')
          {
            tag = '-';
          }

          ladder_parts.push((set.reps != null ? set.reps : set.target) + tag);
        }

        if (ladder_parts.length)
        {
          body_parts.push(ladder_parts.join('.'));
        }
      }
    }
    else 
    {
      uses_load = false;
      for (j = 0; j < ex.sets.length; ++j)
      {
        if (ex.sets[j].load != null)
        {
          uses_load = true;
          break;
        }
      }

      for (j = 0; j < performed.length; ++j)
      {
        set = performed[j];
        reps = set.reps != null ? set.reps : set.target || 0;
        tag = '';

        if (set.status == 'done_ugly')
        {
          tag = ' ugly';
        }
        else if (set.status == 'pain')
        {
          tag = ' pain';
        }
        else if (set.status == 'failed')
        {
          tag = ' failed';
        }
        else if (set.status == 'skipped')
        {
          tag = ' skipped';
        }

        if (ex.mode == 'timed')
        {
          body_parts.push(reps + 's' + tag);
        }
        else if (set.load != null)
        {
          body_parts.push(set.load + ' ' + (set.unit || 'kg') + ' x ' + reps + tag);
        }
        else 
        {
          body_parts.push(reps + tag);
        }
      }

      if (uses_load)
      {
        out.push(ex.name + ': ' + body_parts.join(', '));
        continue;
      }
    }

    out.push(ex.name + ': ' + body_parts.join(' / '));
  }

  return out.join('\n') + '\n';
}

function csvCell(value)
{
  let text = value == null ? '' : String(value);

  if (/[",\n]/.test(text))
  {
    return '"' + text.replace(/"/g, '""') + '"';
  }

  return text;
}

function buildCSV(workout, rig, profile)
{
  let head = ['date', 'workout', 'exercise', 'mode', 'set_index', 'ladder_index', 'rung_index', 'reps', 'load', 'unit', 'clean_status', 'pain', 'rest_target', 'cycle_sec', 'work_sec', 'work_quality', 'setup', 'notes'];
  let rows = [head.join(',')];
  let i;
  let j;
  let ex;
  let ordered;
  let timings;
  let entry;
  let set_index;
  let first;
  let ri;
  let setup_cell;
  let set;
  let status;
  let note;
  let row;

  for (i = 0; i < workout.exercises.length; ++i)
  {
    ex = workout.exercises[i];
    /* walk logical order, not raw insertion order — otherwise set_index counts
       the array as it happens to be stored and looks scrambled next to reps */
    ordered = orderedSetsOf(ex);
    timings = setTimings(ex);
    set_index = 0;
    first = true;
    ri = ringInfo(ex, rig, profile);
    setup_cell = ex.setup || '';

    if (ri && ri.deg != null)
    {
      setup_cell = (setup_cell ? setup_cell + ' | ' : '') + ri.label + ' ' + ri.deg.toFixed(1) + '° (Rr ' + ri.Rr + ', H ' + (ri.H >= 0 ? '+' : '') + ri.H + ')';
    }

    for (j = 0; j < ordered.length; ++j)
    {
      entry = ordered[j];
      set = entry.set;
      if (!isPerformed(set))
      {
        continue;
      }

      ++set_index;

      if (set.status == 'done_clean')
      {
        status = 'clean';
      }
      else if (set.status == 'done_ugly')
      {
        status = 'ugly';
      }
      else if (set.status == 'pain')
      {
        status = '';
      }
      else 
      {
        status = set.status;
      }

      note = set.note || '';
      if (first && ex.notes)
      {
        note = (note ? note + ' | ' : '') + 'ex: ' + ex.notes;
      }
      first = false;

      row = [
        workout.date,
        workout.name || '',
        ex.name,
        ex.mode,
        set_index,
        entry.ladder_index != null ? entry.ladder_index : '',
        entry.rung_pos != null ? entry.rung_pos : '',
        set.reps != null ? set.reps : '',
        set.load != null ? set.load : '',
        set.load != null ? (set.unit || 'kg') : '',
        status,
        set.status == 'pain' ? 'yes' : '',
        set.restTarget != null ? set.restTarget : '',
        timings[set.id] ? timings[set.id].cycle : '',
        timings[set.id] && (timings[set.id].status == 'exact' || timings[set.id].status == 'estimate') ? timings[set.id].work : '',
        timings[set.id] ? timings[set.id].status : '',
        setup_cell,
        note
      ];

      for (let k = 0; k < row.length; ++k)
      {
        row[k] = csvCell(row[k]);
      }

      rows.push(row.join(','));
    }
  }

  return rows.join('\n') + '\n';
}

/* ---------- chunked backup: complete, lossless, tab-delimited ----------

   the file is a header line, then typed sections. one section per record type,
   each with its own header row so columns are read by name (adding a field later
   does not break old backups). the file is FLAT and relational — exercises point
   at a workout id, sets at an exercise id — and import re-nests by joining on
   those ids. this is the round-trip pair: buildBackup and parseBackup must stay
   exact inverses, which the fuzz test asserts.

   tab-delimited so notes/setup can hold commas without quoting. a literal tab or
   newline inside a field would break a row, so bkCell strips them on the way out
   and we assert column counts on the way in — a malformed line crashes loudly at
   its line number rather than importing partial data. */

const BACKUP_VERSION = 'workout_recorder_backup 1';

function bkCell(value)
{
  if (value == null)
  {
    return '-';
  }

  let text = String(value);
  if (text == '')
  {
    return '-';
  }

  /* tabs and newlines are the delimiters; a field cannot contain them */
  return text.replace(/\t/g, ' ').replace(/\r?\n/g, ' ');
}

function bkBool(value)
{
  return value ? 'yes' : 'no';
}

function buildBackup(state)
{
  let lines = [];
  let w;
  let ex;
  let ordered;
  let entry;
  let s;
  let i;
  let j;
  let k;

  lines.push(BACKUP_VERSION);
  lines.push('');

  lines.push('[globals]');
  lines.push(['sound', 'countdown', 'active', 'anchor', 'cal_x', 'cal_y', 'cal_rr', 'toe_shoulder', 'heel_shoulder', 'arm'].join('\t'));
  lines.push([
    bkBool(state.settings.sound),
    bkBool(state.settings.countdown),
    bkCell(state.activeId),
    bkCell(state.rig.anchorHeight),
    bkCell(state.rig.calX),
    bkCell(state.rig.calY),
    bkCell(state.rig.calRr),
    bkCell(state.profile.shoulderPushup),
    bkCell(state.profile.shoulderRow),
    bkCell(state.profile.arm)
  ].join('\t'));
  lines.push('');

  lines.push('[workouts]');
  lines.push(['id', 'date', 'name', 'finished', 'notes'].join('\t'));
  for (i = 0; i < state.workouts.length; ++i)
  {
    w = state.workouts[i];
    lines.push([bkCell(w.id), bkCell(w.date), bkCell(w.name), bkBool(w.finished), bkCell(w.notes)].join('\t'));
  }
  lines.push('');

  lines.push('[exercises]');
  lines.push(['id', 'workout', 'name', 'mode', 'rest_set', 'rest_rung', 'stop_reason', 'setup', 'notes', 'ring_type', 'ring_rr', 'foot_dist'].join('\t'));
  for (i = 0; i < state.workouts.length; ++i)
  {
    w = state.workouts[i];
    for (j = 0; j < w.exercises.length; ++j)
    {
      ex = w.exercises[j];
      /* stop_reason does double duty: '-' means not stopped. a stopped exercise
         always carries a reason (stopExercise writes one), so the flag is
         redundant with the reason and would only be a chance to disagree. */
      lines.push([
        bkCell(ex.id),
        bkCell(w.id),
        bkCell(ex.name),
        bkCell(ex.mode),
        bkCell(ex.restSet),
        bkCell(ex.restRung),
        bkCell(ex.stopped ? (ex.stopReason || 'stopped') : null),
        bkCell(ex.setup),
        bkCell(ex.notes),
        bkCell(ex.ring.type),
        bkCell(ex.ring.Rr),
        bkCell(ex.ring.H)
      ].join('\t'));
    }
  }
  lines.push('');

  lines.push('[sets]');
  lines.push(['exercise', 'ladder', 'rung', 'target', 'reps', 'load', 'unit', 'status', 'rest_target', 'done_at', 'note'].join('\t'));
  for (i = 0; i < state.workouts.length; ++i)
  {
    w = state.workouts[i];
    for (j = 0; j < w.exercises.length; ++j)
    {
      ex = w.exercises[j];
      /* emit in logical order so a hand-read file makes sense; import does not
         depend on order (rungIndex/ladderIndex carry position) */
      ordered = orderedSetsOf(ex);
      for (k = 0; k < ordered.length; ++k)
      {
        entry = ordered[k];
        s = entry.set;
        lines.push([
          bkCell(ex.id),
          bkCell(s.ladderIndex),
          bkCell(s.rungIndex),
          bkCell(s.target),
          bkCell(s.reps),
          bkCell(s.load),
          bkCell(s.unit),
          bkCell(s.status),
          bkCell(s.restTarget),
          bkCell(s.doneAt),
          bkCell(s.note)
        ].join('\t'));
      }
    }
  }
  lines.push('');

  return lines.join('\n');
}

/* '-' means null/empty on the way back in */
function bkNum(text)
{
  if (text == '-' || text == '')
  {
    return null;
  }

  let n = parseFloat(text);
  if (isNaN(n))
  {
    throw new Error('expected a number, got "' + text + '"');
  }

  return n;
}

function bkInt(text)
{
  if (text == '-' || text == '')
  {
    return null;
  }

  let n = parseInt(text, 10);
  if (isNaN(n))
  {
    throw new Error('expected an integer, got "' + text + '"');
  }

  return n;
}

function bkStr(text)
{
  return text == '-' ? '' : text;
}

function bkStrOrNull(text)
{
  return text == '-' ? null : text;
}

/* header row -> { column_name: index }, so rows are read by name not position */
function bkColumns(header_line)
{
  let names = header_line.split('\t');
  let cols = {};
  let i;

  for (i = 0; i < names.length; ++i)
  {
    cols[names[i]] = i;
  }

  return cols;
}

/* parse the whole file into flat section arrays, asserting shape as we go.
   returns { globals, workouts, exercises, sets } as plain records. */
function parseBackup(text)
{
  let raw_lines = text.split(/\r?\n/);
  let lines = [];
  let section = null;
  let cols = null;
  let out = { globals: null, workouts: [], exercises: [], sets: [] };
  let line;
  let fields;
  let i;

  /* drop blank lines but keep the version check on line 0 of the real content */
  for (i = 0; i < raw_lines.length; ++i)
  {
    if (raw_lines[i].trim() != '')
    {
      lines.push(raw_lines[i]);
    }
  }

  if (!lines.length || lines[0] != BACKUP_VERSION)
  {
    throw new Error('not a workout_recorder backup (first line is "' + (lines[0] || '') + '", expected "' + BACKUP_VERSION + '")');
  }

  for (i = 1; i < lines.length; ++i)
  {
    line = lines[i];

    if (line.charAt(0) == '[')
    {
      section = line;
      cols = null;   /* next line in this section is its header */
      continue;
    }

    if (!section)
    {
      throw new Error('line ' + (i + 1) + ': data outside any [section]');
    }

    if (!cols)
    {
      cols = bkColumns(line);
      continue;
    }

    fields = line.split('\t');

    switch (section)
    {
      case '[globals]':
        out.globals = {
          sound: fields[cols.sound] == 'yes',
          countdown: fields[cols.countdown] == 'yes',
          activeId: bkStrOrNull(fields[cols.active]),
          anchorHeight: bkNum(fields[cols.anchor]),
          calX: bkNum(fields[cols.cal_x]),
          calY: bkNum(fields[cols.cal_y]),
          calRr: bkNum(fields[cols.cal_rr]),
          shoulderPushup: bkNum(fields[cols.toe_shoulder]),
          shoulderRow: bkNum(fields[cols.heel_shoulder]),
          arm: bkNum(fields[cols.arm])
        };
        break;

      case '[workouts]':
        out.workouts.push({
          id: fields[cols.id],
          date: fields[cols.date],
          name: bkStr(fields[cols.name]),
          finished: fields[cols.finished] == 'yes',
          notes: bkStr(fields[cols.notes])
        });
        break;

      case '[exercises]':
        out.exercises.push({
          id: fields[cols.id],
          workout: fields[cols.workout],
          name: bkStr(fields[cols.name]),
          mode: fields[cols.mode],
          restSet: bkInt(fields[cols.rest_set]),
          restRung: bkInt(fields[cols.rest_rung]),
          /* '-' reason means not stopped; any reason implies stopped */
          stopped: fields[cols.stop_reason] != '-',
          stopReason: bkStrOrNull(fields[cols.stop_reason]),
          setup: bkStr(fields[cols.setup]),
          notes: bkStr(fields[cols.notes]),
          ringType: fields[cols.ring_type],
          ringRr: bkNum(fields[cols.ring_rr]),
          ringH: bkNum(fields[cols.foot_dist])
        });
        break;

      case '[sets]':
        out.sets.push({
          exercise: fields[cols.exercise],
          ladderIndex: bkInt(fields[cols.ladder]),
          rungIndex: bkInt(fields[cols.rung]),
          target: bkInt(fields[cols.target]),
          reps: bkInt(fields[cols.reps]),
          load: bkNum(fields[cols.load]),
          unit: bkStrOrNull(fields[cols.unit]),
          status: fields[cols.status],
          restTarget: bkInt(fields[cols.rest_target]),
          doneAt: bkNum(fields[cols.done_at]),
          note: bkStr(fields[cols.note])
        });
        break;

      default:
        throw new Error('line ' + (i + 1) + ': unknown section ' + section);
    }
  }

  return out;
}

/* re-nest the flat sections into workout objects by joining on id.
   returns an array of fully-formed workouts (ready to merge into state). */
function rebuildWorkouts(parsed)
{
  let workouts = [];
  let by_id = {};
  let ex_by_id = {};
  let rec;
  let w;
  let ex;
  let s;
  let i;

  for (i = 0; i < parsed.workouts.length; ++i)
  {
    rec = parsed.workouts[i];
    w = { id: rec.id, date: rec.date, name: rec.name, notes: rec.notes, exercises: [], finished: rec.finished };
    workouts.push(w);
    by_id[w.id] = w;
  }

  for (i = 0; i < parsed.exercises.length; ++i)
  {
    rec = parsed.exercises[i];
    w = by_id[rec.workout];
    if (!w)
    {
      throw new Error('exercise "' + rec.name + '" points at missing workout ' + rec.workout);
    }

    ex = makeExercise({
      id: rec.id,
      name: rec.name,
      mode: rec.mode,
      setup: rec.setup,
      notes: rec.notes,
      restSet: rec.restSet,
      restRung: rec.restRung,
      stopped: rec.stopped,
      ring: { type: rec.ringType, Rr: rec.ringRr, H: rec.ringH }
    });
    ex.stopReason = rec.stopReason;
    w.exercises.push(ex);
    if (ex_by_id[ex.id])
    {
      throw new Error('duplicate exercise id ' + ex.id + ' — every exercise id must be unique');
    }
    ex_by_id[ex.id] = ex;
  }

  for (i = 0; i < parsed.sets.length; ++i)
  {
    rec = parsed.sets[i];
    ex = ex_by_id[rec.exercise];
    if (!ex)
    {
      throw new Error('a set points at missing exercise ' + rec.exercise);
    }

    s = makeSet({
      ladderIndex: rec.ladderIndex,
      rungIndex: rec.rungIndex,
      target: rec.target,
      reps: rec.reps,
      load: rec.load,
      unit: rec.unit,
      status: rec.status,
      restTarget: rec.restTarget,
      doneAt: rec.doneAt,
      note: rec.note
    });
    ex.sets.push(s);
  }

  return workouts;
}

/* ---------- ring geometry: ONE solver for pushup and row ----------
   pushup: shoulder ≈ ring, so arm_len is 0.
   row:    strap and straight arm are collinear, so they collapse into a single
           tether one arm longer — a virtual ring hanging arm_len below the real
           one. arm_len enters once, in resting_shoulder, and nowhere else.
   status: 'ok' | 'unreachable' | 'slack' | 'incomplete'
*/
/* θ == 0 exactly (the horizontal row, Rr == Arm at H == -S) lands on -1e-16 in
   floating point; without this tolerance it would misreport as slack. */
const SLACK_EPSILON = 1e-9;

function bodyAngle(anchor_height, body_len, pivot_dist, ring_height, arm_len)
{
  let resting_shoulder;
  let tether;
  let k;
  let denom;
  let cos_arg;
  let theta;

  if (anchor_height == null || body_len == null || pivot_dist == null || ring_height == null || arm_len == null)
  {
    return { status: 'incomplete', deg: 0 };
  }
  if (!(anchor_height > 0) || !(body_len > 0))
  {
    return { status: 'incomplete', deg: 0 };
  }

  resting_shoulder = ring_height - arm_len;        /* Rr' — virtual resting shoulder height */
  tether = anchor_height - resting_shoulder;       /* ρ = strap + arm; derived, never cached */

  k = (tether*tether - anchor_height*anchor_height - pivot_dist*pivot_dist - body_len*body_len)/2;
  denom = body_len*Math.hypot(pivot_dist, anchor_height);

  if (denom == 0)
  {
    return { status: 'unreachable', deg: 0 };
  }

  cos_arg = k/denom;
  if (cos_arg < -1 || cos_arg > 1)
  {
    return { status: 'unreachable', deg: 0 };
  }

  /* always the +acos root: signed pivot_dist selects the regime.
     a sin θ >= 0 test does NOT discriminate — both roots clear the floor. */
  theta = Math.atan2(-anchor_height, pivot_dist) + Math.acos(cos_arg);

  if (theta < -SLACK_EPSILON)
  {
    /* shoulder below the floor: rings hang closer than one arm — slack straps.
       a distinct failure from 'unreachable': lower the rings vs move the anchor. */
    return { status: 'slack', deg: theta*180/Math.PI };
  }

  return { status: 'ok', deg: theta*180/Math.PI };
}

function calibrateAnchor(x1, y1, ringRestHeight)
{
  let denom;

  if (x1 == null || y1 == null || ringRestHeight == null)
  {
    return null;
  }
  if (isNaN(x1) || isNaN(y1) || isNaN(ringRestHeight))
  {
    return null;
  }

  denom = 2*(y1 - ringRestHeight);
  if (denom == 0)
  {
    return null;
  }

  return (x1*x1 + y1*y1 - ringRestHeight*ringRestHeight)/denom;
}

/* resolve a geometry-enabled exercise to a display line, given global rig + profile. */
function ringType(ex)
{
  return ex.ring && ex.ring.type ? ex.ring.type : 'none';
}

function ringModeLabel(type)
{
  switch (type)
  {
    case 'pushup':
      return 'ring pushup';

    case 'row':
      return 'ring row';
  }

  return 'rings';
}

/* the pivot is the toe in a pushup, the heel in a row */
function ringPivotWord(type)
{
  switch (type)
  {
    case 'row':
      return 'heel';
  }

  return 'toe';
}

/* which profile numbers a mode needs; arm_len is 0 for a pushup, never missing */
function ringBodyLen(type, profile)
{
  if (!profile)
  {
    return null;
  }

  switch (type)
  {
    case 'pushup':
      return profile.shoulderPushup;

    case 'row':
      return profile.shoulderRow;
  }

  return null;
}

function ringArmLen(type, profile)
{
  switch (type)
  {
    case 'pushup':
      return 0;

    case 'row':
      return profile ? profile.arm : null;
  }

  return null;
}

function ringInfo(ex, rig, profile)
{
  let type = ringType(ex);
  let label;
  let ring_height;
  let pivot_dist;
  let anchor_height;
  let body_len;
  let arm_len;
  let missing;
  let result;
  let signed_pivot;

  switch (type)
  {
    case 'pushup':
    case 'row':
      break;

    default:
      return null;
  }

  label = ringModeLabel(type);
  ring_height = ex.ring.Rr;
  pivot_dist = ex.ring.H;

  if (ring_height == null || pivot_dist == null)
  {
    return { incomplete: true, text: label + ' — enter ring height + ' + ringPivotWord(type) + ' distance' };
  }

  anchor_height = rig ? rig.anchorHeight : null;
  body_len = ringBodyLen(type, profile);
  arm_len = ringArmLen(type, profile);

  missing = [];
  if (anchor_height == null)
  {
    missing.push('anchor height');
  }
  if (body_len == null)
  {
    missing.push(ringPivotWord(type) + '-to-shoulder');
  }
  if (arm_len == null)
  {
    missing.push('arm length');
  }
  if (missing.length)
  {
    return { incomplete: true, text: label + ' — set ' + missing.join(' + ') + ' in ⚙ setup' };
  }

  result = bodyAngle(anchor_height, body_len, pivot_dist, ring_height, arm_len);
  signed_pivot = (pivot_dist >= 0 ? '+' : '') + pivot_dist;

  switch (result.status)
  {
    case 'incomplete':
      return { incomplete: true, text: label + ' — incomplete' };

    case 'unreachable':
      return {
        impossible: true,
        label: label,
        Rr: ring_height,
        H: pivot_dist,
        text: label + ' — impossible configuration (can\'t reach) · Rr ' + ring_height + ' · H ' + signed_pivot
      };

    case 'slack':
      return {
        slack: true,
        label: label,
        Rr: ring_height,
        H: pivot_dist,
        text: label + ' — rings too low (slack straps) · Rr ' + ring_height + ' · H ' + signed_pivot
      };
  }

  return {
    deg: result.deg,
    label: label,
    Rr: ring_height,
    H: pivot_dist,
    text: label + ' ∠ ' + result.deg.toFixed(1) + '° · Rr ' + ring_height + ' · H ' + signed_pivot + ' cm'
  };
}

/* colour class for the card line: failures red, missing inputs grey */
function ringLineClass(ri)
{
  if (ri.impossible || ri.slack)
  {
    return ' bad';
  }
  if (ri.incomplete)
  {
    return ' faint';
  }

  return '';
}

/* ======== storage (artifact window.storage → localStorage fallback) ======== */
let storage_key = 'wr:data:v1';
let store = {
  load: function()
  {
    function readLocal()
    {
      try 
      {
        let stored_value = localStorage.getItem(storage_key);
        return stored_value ? JSON.parse(stored_value) : null;
      }
      catch (e)
      {
        return null;
      }
    }

    if (window.storage && window.storage.get)
    {
      return window.storage.get(storage_key).then(function(result)
      {
        if (result && result.value)
        {
          return JSON.parse(result.value);
        }

        return null;
      }, function()
      {
        return readLocal();
      });
    }

    return Promise.resolve(readLocal());
  },
  _t:null,
  save: function(data)
  {
    clearTimeout(this._t);
    let self_ref = this;
    this._t = setTimeout(function()
    {
      self_ref.flush(data); 
    }, 400);
    this._pending = data;
  },
  flush: function(data)
  {
    function writeLocal(json_text)
    {
      try 
      {
        localStorage.setItem(storage_key, json_text);
      }
      catch (e)
      {}
      return Promise.resolve();
    }

    data = data || this._pending;
    if (!data) return Promise.resolve();

    let json_text;
    try 
    {
      json_text = JSON.stringify(data); 
    }
    catch(e)
    {
      return Promise.resolve(); 
    }

    if (window.storage && window.storage.set)
    {
      return window.storage.set(storage_key, json_text).then(function()
      {
        return null;
      }, function()
      {
        return writeLocal(json_text);
      });
    }

    return writeLocal(json_text);
  }
};
document.addEventListener('visibilitychange', function()
{
  if (document.visibilityState=='hidden') store.flush(); 
});
window.addEventListener('pagehide', function()
{
  store.flush(); 
});

/* rebuild a ladder's sets from an edited rung list.

   performed rungs are history: they keep their recorded reps, keep their order,
   and are never deleted. they pack to the front of the ladder — in normal use
   they already ARE a prefix (skip and fail both count as performed), so packing
   changes nothing; a planned rung stranded between performed ones is anomalous,
   and packing heals it.

   the list supplies targets for the PLANNED tail only. the previous approach
   matched the list against each set's existing rungIndex, which broke the moment
   the list length changed: a position left by a removed rung simply got refilled
   from the list, so the ladder could never shrink. */
function rebuildLadderSets(ex, ladder_rungs)
{
  let ladders = laddersOf(ex);
  let out = [];
  let count = Math.max(ladder_rungs.length, ladders.length);
  let ladder_no = 0;
  let done;
  let rungs;
  let i;
  let j;

  for (i = 0; i < count; ++i)
  {
    done = [];
    if (i < ladders.length)
    {
      for (j = 0; j < ladders[i].sets.length; ++j)
      {
        if (isPerformed(ladders[i].sets[j]))
        {
          done.push(ladders[i].sets[j]);
        }
      }
    }

    rungs = i < ladder_rungs.length ? ladder_rungs[i] : [];

    /* a ladder with neither logged nor planned rungs disappears */
    if (!done.length && !rungs.length)
    {
      continue;
    }

    ++ladder_no;

    for (j = 0; j < done.length; ++j)
    {
      done[j].ladderIndex = ladder_no;
      done[j].rungIndex = j + 1;
      out.push(done[j]);
    }

    for (j = done.length; j < rungs.length; ++j)
    {
      out.push(makeSet({ ladderIndex: ladder_no, rungIndex: j + 1, target: rungs[j] }));
    }
  }

  return out;
}
/* rungIndex is the POSITION in the ladder (contiguous); target is the rep count.
   keeping them separate is what allows arbitrary rungs like 1,2,4,5. */
function buildLadderSets(ladder_rungs)
{
  let sets = [];
  let i;
  let j;

  for (i = 0; i < ladder_rungs.length; ++i)
  {
    for (j = 0; j < ladder_rungs[i].length; ++j)
    {
      sets.push(makeSet({ ladderIndex: i + 1, rungIndex: j + 1, target: ladder_rungs[i][j] }));
    }
  }

  return sets;
}
function newWorkout(name)
{
  let w = { id: uid(), date: todayISO(), name: name || 'Workout', notes:'', exercises: [], finished:false };
  state.workouts.unshift(w);
  state.activeId = w.id;
  return w;
}

/* import a backup, MERGING into current data (not replacing). a workout whose id
   already exists is overwritten by the imported copy; new ids are added. globals
   (rig, profile, sound) are only filled where the current value is unset, so an
   import never clobbers settings you already tuned on this device.

   returns a summary { added, replaced } for the confirmation message. throws on a
   malformed file — the caller shows the message and nothing is changed, because
   the parse happens before any mutation. */
function applyBackup(text)
{
  let parsed = parseBackup(text);
  let incoming = rebuildWorkouts(parsed);
  let g = parsed.globals;
  let existing_ids = {};
  let added = 0;
  let replaced = 0;
  let w;
  let i;

  for (i = 0; i < state.workouts.length; ++i)
  {
    existing_ids[state.workouts[i].id] = i;
  }

  for (i = 0; i < incoming.length; ++i)
  {
    w = incoming[i];
    if (existing_ids[w.id] != null)
    {
      state.workouts[existing_ids[w.id]] = w;
      ++replaced;
    }
    else
    {
      state.workouts.push(w);
      ++added;
    }
  }

  /* keep newest first, matching how newWorkout unshifts */
  state.workouts.sort(function(a, b)
  {
    if (a.date < b.date) return 1;
    if (a.date > b.date) return -1;
    return 0;
  });

  if (g)
  {
    if (state.rig.anchorHeight == null) state.rig.anchorHeight = g.anchorHeight;
    if (state.rig.calX == null) state.rig.calX = g.calX;
    if (state.rig.calY == null) state.rig.calY = g.calY;
    if (state.rig.calRr == null) state.rig.calRr = g.calRr;
    if (state.profile.shoulderPushup == null) state.profile.shoulderPushup = g.shoulderPushup;
    if (state.profile.shoulderRow == null) state.profile.shoulderRow = g.shoulderRow;
    if (state.profile.arm == null) state.profile.arm = g.arm;
  }

  /* presets are derived — rebuild them from the merged set of workouts */
  for (i = 0; i < state.workouts.length; ++i)
  {
    state.workouts[i].exercises.forEach(touchPreset);
  }

  return { added: added, replaced: replaced };
}

/* ======== rest timer ======== */
let timer = null; /* { since, target, label, setId } */
let tick_handle = null, beeped = false, audio_ctx = null;
function beep()
{
  if (!state.settings.sound) return;
  try
  {
    audio_ctx = audio_ctx || new (window.AudioContext || window.webkitAudioContext)();
    let oscillator = audio_ctx.createOscillator();
    let gain = audio_ctx.createGain();
    oscillator.type = 'square'; oscillator.frequency.value = 880;
    gain.gain.setValueAtTime(0.08, audio_ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, audio_ctx.currentTime + 0.35);
    oscillator.connect(gain); gain.connect(audio_ctx.destination);
    oscillator.start(); oscillator.stop(audio_ctx.currentTime + 0.36);
  }
  catch(e)
  {}
  if (navigator.vibrate) 
  {
    try
    {
      navigator.vibrate(200); 
    }
    catch(e)
    {} 
  }
}
function startTimer(target, label, setId)
{
  timer = { since: Date.now(), target: target, label: label, setId: setId };
  beeped = false;
  document.getElementById('timerbar').classList.remove('hidden');
  if (!tick_handle) tick_handle = setInterval(tick, 250);
  tick();
}
function stopTimer()
{
  timer = null;
  document.getElementById('timerbar').classList.add('hidden');
  if (tick_handle)
  {
    clearInterval(tick_handle); tick_handle = null; 
  }
  save();
}
function tick()
{
  if (!timer) return;
  let el = Math.floor((Date.now() - timer.since)/1000);
  let remaining = timer.target - el;
  let bar = document.getElementById('timerbar');
  let over = el >= timer.target;
  let frac = Math.min(100, (el/Math.max(1, timer.target))*100);
  bar.classList.toggle('over', over);
  document.getElementById('tlab').textContent = timer.label;

  if (state.settings.countdown)
  {
    /* remaining time, then overtime once it passes zero */
    document.getElementById('tmain').textContent = over ? '+' + fmtRest(-remaining) : fmtRest(remaining);
    document.getElementById('ttarget').textContent = over ? 'over ' + fmtRest(timer.target) : 'of ' + fmtRest(timer.target);
    /* the bar drains toward empty, matching the countdown */
    document.getElementById('tfill').style.width = (100 - frac) + '%';
  }
  else
  {
    document.getElementById('tmain').textContent = over ? '+' + fmtRest(el - timer.target) : fmtRest(el);
    document.getElementById('ttarget').textContent = over ? 'rested ' + fmtRest(timer.target) : '/ ' + fmtRest(timer.target);
    document.getElementById('tfill').style.width = frac + '%';
  }

  if (over && !beeped)
  {
    beeped = true; beep(); 
  }
}

/* ======== actions on sets ======== */
function completeSet(setId)
{
  let w = activeWorkout(); let hit = findSet(w, setId); if (!hit) return;
  let ex = hit.ex, s = hit.set;
  if (s.reps == null) s.reps = s.target != null ? s.target : 0;
  s.status = 'done_clean';
  s.doneAt = Date.now();   /* the raw fact; cycle and work are derived from it */
  let isRung = ex.mode=='ladder';
  let target = ex.restSet, label = ex.name + ' · set rest';
  if (isRung)
  {
    let more = ex.sets.some(function(x)
    {
      return x.ladderIndex==s.ladderIndex && (x.rungIndex||0) > (s.rungIndex||0) && x.status=='planned'; 
    });
    if (more)
    {
      target = ex.restRung; label = ex.name + ' · rung rest'; s.restTarget = ex.restRung; 
    }
    else 
    {
      target = ex.restSet; label = ex.name + ' · ladder rest'; s.restTarget = ex.restSet; 
    }
  }
  else 
  {
    s.restTarget = ex.restSet;
  }
  startTimer(target, label, s.id);
  touchPreset(ex);
  save(); render();
}
function setStatus(setId, status)
{
  let w = activeWorkout(); let hit = findSet(w, setId); if (!hit) return;
  let s = hit.set;
  if (!isDone(s) && (status=='done_ugly' || status=='pain'))
  {
    if (s.reps==null) s.reps = s.target||0; 
  }
  s.status = status;
  /* stamp the first transition into a performed state; re-tagging clean->ugly
     later must not move the timestamp, or the derived cycle would shift */
  if (isPerformed(s) && s.doneAt == null)
  {
    s.doneAt = Date.now();
  }
  if (status=='pain')
  {
    ui.painExId = hit.ex.id; 
  }
  if (status=='failed' || status=='skipped')
  {
    if (s.reps==null) s.reps = 0; 
  }
  save(); render();
}

function renderOverlay()
{
  let el = document.getElementById('overlay');
  if (!ui.overlay)
  {
    el.classList.add('hidden');
    el.innerHTML = '';
    return;
  }

  el.classList.remove('hidden');
  let o = ui.overlay;
  let h = '<div class="sheet">';

  switch (o.type)
  {
    case 'addex':
      h += sheetAddEx(o);
      break;

    case 'settings':
      h += sheetSettings();
      break;

    case 'export':
      h += sheetExport(o);
      break;

    case 'clone':
      h += sheetClone(o);
      break;
  }

  h += '</div>';
  el.innerHTML = h;
  if (o.type == 'export')
  {
    let w = activeWorkout() || findWorkout(o.wid);
    let out = document.getElementById('expout');

    if (out && ui.expFmt == 'backup')
    {
      out.value = buildBackup(state);
    }
    else if (out && w)
    {
      switch (ui.expFmt)
      {
        case 'backup':
          out.value = buildBackup(state);
          break;

        case 'csv':
          out.value = buildCSV(w, state.rig, state.profile);
          break;

        case 'compact':
          out.value = buildCompact(w, state.rig, state.profile);
          break;

        default:
          out.value = buildPlain(w, state.rig, state.profile);
          break;
      }
    }
  }
}

function updateExList(q)
{
  let l = document.getElementById('exList'); if (!l) return;
  q = (q||'').trim().toLowerCase();
  let items = Array.prototype.slice.call(l.querySelectorAll('.exitem'));
  items.forEach(function(el,i)
  {
    if (el.dataset.orig==null) el.dataset.orig = String(i); 
  });
  function score(el)
  {
    let n = el.dataset.name.toLowerCase();
    if (!q) return 0;
    if (n.indexOf(q)==0) return 0;   // prefix match first
    if (n.indexOf(q)>=0) return 1;    // substring match next
    return 2;                          // everything else still shown, below
  }
  items.sort(function(a,b)
  {
    let sa=score(a), sb=score(b);
    if (sa!=sb) return sa-sb;
    return (+a.dataset.orig)-(+b.dataset.orig);
  });
  items.forEach(function(el)
  {
    let name = el.dataset.name, idx = q ? name.toLowerCase().indexOf(q) : -1;
    if (idx>=0) el.innerHTML = esc(name.slice(0,idx))+'<span class="mt">'+esc(name.slice(idx,idx+q.length))+'</span>'+esc(name.slice(idx+q.length));
    else el.textContent = name;
    l.appendChild(el);
  });
}
/* the draft's ring fields resolved against the saved rig + profile */
function draftAngle(d)
{
  let anchor_height = state.rig.anchorHeight;
  let body_len = ringBodyLen(d.ringType, state.profile);
  let arm_len = ringArmLen(d.ringType, state.profile);
  let ring_height = parseFloat(d.ringRr);
  let pivot_dist = parseFloat(d.ringH);

  if (isNaN(ring_height) || isNaN(pivot_dist))
  {
    return { status: 'incomplete', deg: 0 };
  }

  return bodyAngle(anchor_height, body_len, pivot_dist, ring_height, arm_len);
}

function ringReadoutText(d)
{
  let missing = [];
  let result;

  if (state.rig.anchorHeight == null)
  {
    missing.push('anchor height');
  }
  if (ringBodyLen(d.ringType, state.profile) == null)
  {
    missing.push(ringPivotWord(d.ringType) + '-to-shoulder');
  }
  if (ringArmLen(d.ringType, state.profile) == null)
  {
    missing.push('arm length');
  }
  if (missing.length)
  {
    return 'set ' + missing.join(' & ') + ' in ⚙ setup first';
  }

  result = draftAngle(d);

  switch (result.status)
  {
    case 'incomplete':
      return 'enter R' + '\u1d63' + ' and H to see the angle';

    case 'unreachable':
      return 'impossible configuration — ring can\'t reach';

    case 'slack':
      return 'rings too low — shoulder would hang below the floor (slack straps)';
  }

  return 'body angle ≈ ' + result.deg.toFixed(1) + '°';
}

function ringReadoutBad(d)
{
  let result;

  if (state.rig.anchorHeight == null)
  {
    return true;
  }
  if (ringBodyLen(d.ringType, state.profile) == null)
  {
    return true;
  }
  if (ringArmLen(d.ringType, state.profile) == null)
  {
    return true;
  }

  result = draftAngle(d);

  switch (result.status)
  {
    case 'unreachable':
    case 'slack':
      return true;
  }

  return false;
}
function calReadoutText()
{
  let rg = state.rig;
  let A = calibrateAnchor(rg.calX, rg.calY, rg.calRr);
  if (A==null || isNaN(A)) return 'enter x₁, y₁, Rr';
  if (A<=0) return 'check inputs — non-physical result';
  return 'computed A ≈ ' + A.toFixed(1) + ' cm';
}

  h += '<div class="togglerow"><input type="checkbox" id="progchk" data-field="clone-prog"'+(o.prog?' checked':'')+'>'
     + '<label for="progchk">Apply suggested progressions</label></div>';
  h += '<div class="clone-prev">';
  src.exercises.forEach(function(ex)
  {
    let sug = suggestForExercise(ex);
    let shown = o.prog ? targetsLabel(sug)
      : (ex.mode=='ladder' ? 'ladders '+laddersDisplay(rungsOf(ex))
        : ex.sets.map(function(s)
        {
          return (s.load!=null?s.load+'x':'')+(s.target!=null?s.target:s.reps); 
        }).join(' / '));
    h += '<div class="pl"><span class="pn">'+esc(ex.name)+'</span><span class="pt">'+esc(shown)+'</span>'
       + (o.prog ? '<span class="'+(sug.warn?'pw':'pr')+'">'+esc(sug.reason)+'</span>' : '')+'</div>';
  });
  h += '</div>';
  h += '<div class="foot"><button class="btn ghost" data-a="overlay-close">cancel</button>'
     + '<button class="btn primary" data-a="clone-start" data-src="'+src.id+'">Start workout</button></div>';
  return h;
}

/* ======== clone / sample ======== */
function cloneWorkout(srcId, applyProg)
{
  let src = findWorkout(srcId); if (!src) return;
  let w = newWorkout(src.name);
  src.exercises.forEach(function(sx)
  {
    let ex = makeExercise({ name:sx.name, mode:sx.mode, setup:sx.setup, restSet:sx.restSet, restRung:sx.restRung,
      ring: sx.ring ? { type:(sx.ring.type||(sx.ring.enabled?'pushup':'none')), Rr:sx.ring.Rr, H:sx.ring.H } : { type:'none', Rr:null, H:null } });
    let sug = suggestForExercise(sx);
    if (sx.mode=='ladder')
    {
      ex.sets = buildLadderSets(applyProg ? sug.ladders : (rungsOf(sx).length ? rungsOf(sx) : [[1]]));
    }
    else 
    {
      let unit = (sx.sets.find(function(s)
      {
        return s.unit;
      })||{}).unit || 'kg';
      let targets = applyProg ? sug.targets
        : sx.sets.map(function(s)
        {
          return { reps: s.target!=null?s.target:(s.reps||0), load: s.load }; 
        });
      if (!targets.length) targets = [{reps:0}];
      ex.sets = buildSetsFromTargets(targets, unit);
    }
    if (applyProg && sug.warn) ex.notes = '⚠ ' + sug.reason;
    w.exercises.push(ex);
  });
  ui.view = 'workout'; ui.overlay = null;
  save(); render(); window.scrollTo(0,0);
}

{

  w.exercises = [e1,e2,e3,e4,e5];
