<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>workout_recorder</title>
<style>
/* ============================================================
   Blender-dark theme · mono labels & numbers · sans body
   ============================================================ */
:root{
  --bg:#1e1e1e;
  --panel:#272727;
  --panel2:#303030;
  --panel3:#383838;
  --line:#3d3d3d;
  --line2:#4b4b4b;
  --text:#e6e3de;
  --muted:#9c9892;
  --faint:#6f6c66;
  --orange:#f5871f;
  --orange-hi:#ff9d3c;
  --orange-ink:#1b1206;
  --blue:#5b8dc9;
  --green:#8db862;
  --amber:#e0b13c;
  --red:#d15750;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono","Fira Code",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:4px;padding:7px 9px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--orange)}
:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
::placeholder{color:var(--faint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* topbar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(30,30,30,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line)}
.brand{font-family:var(--mono);font-size:14px;letter-spacing:.04em;color:var(--text)}
.brand .dot{color:var(--orange)}
.topbar .spacer{flex:1}
.iconbtn{font-family:var(--mono);font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;padding:6px 10px;background:var(--panel)}
.iconbtn:hover{color:var(--text);border-color:var(--line2)}

main{max-width:680px;margin:0 auto;padding:16px 14px 24px}

/* type helpers */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.mono{font-family:var(--mono)}
h1.page{font-family:var(--mono);font-size:20px;font-weight:600;margin:6px 0 2px;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  font-family:var(--mono);font-size:13px;letter-spacing:.02em;
  background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);
  padding:10px 14px;color:var(--text);min-height:40px}
.btn:hover{background:var(--panel3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--orange-ink);font-weight:700}
.btn.primary:hover{background:var(--orange-hi);border-color:var(--orange-hi)}
.btn.danger{color:var(--red);border-color:#5a3230}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--panel)}
.btn.small{padding:6px 10px;min-height:32px;font-size:12px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* home list */
.wlist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.witem{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.witem:hover{border-color:var(--line2);background:#2b2b2b}
.witem .wdate{font-family:var(--mono);font-size:12px;color:var(--orange);min-width:86px}
.witem .wname{font-weight:600}
.witem .wsum{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
.witem .flex{flex:1;min-width:0}
.witem .tag-live{font-family:var(--mono);font-size:10px;color:var(--green);border:1px solid #3c4f2e;
  border-radius:3px;padding:2px 6px;letter-spacing:.1em}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:26px 18px;color:var(--muted);
  text-align:center;margin-top:16px;font-size:14px}
.empty a{color:var(--blue);cursor:pointer;text-decoration:underline}

/* home tabs */
.hometabs{display:flex;gap:0;border:1px solid var(--line2);border-radius:6px;overflow:hidden;width:fit-content;margin:14px 0 4px}
.hometabs button{font-family:var(--mono);font-size:12.5px;letter-spacing:.03em;padding:8px 16px;color:var(--muted);background:var(--panel)}
.hometabs button + button{border-left:1px solid var(--line2)}
.hometabs button.on{background:var(--orange);color:var(--orange-ink);font-weight:700}

/* calendar */
.cal{margin-top:14px}
.cal-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.cal-h .mo{font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:.02em;min-width:150px;text-align:center}
.cal-h .nav{font-family:var(--mono);font-size:16px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;width:38px;height:38px;background:var(--panel)}
.cal-h .nav:hover{color:var(--text);border-color:var(--line2)}
.cal-h .stat{flex:1;text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.05em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--faint);text-align:center;
  padding:2px 0 4px;text-transform:uppercase}
.cal-cell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:5px;background:var(--panel);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;position:relative;
  font-family:var(--mono);font-size:14px;color:var(--muted)}
.cal-cell.blank{border-color:transparent;background:none}
.cal-cell.today{border-color:var(--line2);color:var(--text)}
.cal-cell.today::after{content:"today";position:absolute;bottom:3px;font-size:7px;letter-spacing:.06em;color:var(--faint)}
.cal-cell.has{color:var(--text);cursor:pointer;border-color:#4a3a24;background:#2a2419}
.cal-cell.has:hover{border-color:var(--orange)}
.cal-cell.sel{border-color:var(--orange);background:#33291a;color:var(--orange-hi)}
.cal-cell .dot{width:5px;height:5px;border-radius:50%;background:var(--orange)}
.cal-cell .cnt{position:absolute;top:3px;right:5px;font-size:8px;color:var(--faint)}
.cal-day-panel{margin-top:14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);padding:12px 14px}
.cal-day-panel .pd{font-family:var(--mono);font-size:12px;color:var(--orange);letter-spacing:.04em;margin-bottom:8px}
.cal-day-panel .rest{color:var(--faint)}

/* workout header */
.whead{display:flex;align-items:center;gap:10px;margin:2px 0 14px;flex-wrap:wrap}
.whead input.wname{background:none;border:none;border-bottom:1px dashed var(--line2);border-radius:0;
  font-family:var(--mono);font-size:18px;font-weight:600;padding:2px 2px;flex:1;min-width:150px}
.whead input.wname:focus{border-bottom-color:var(--orange)}
.whead input.wdate-input{background:var(--panel);border:1px solid var(--line);border-radius:4px;
  font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 8px;color-scheme:dark}
.whead input.wdate-input:focus{border-color:var(--orange);color:var(--text)}
.whead .wdate{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* exercise card */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.card.stopped{opacity:.75}
.card-h{display:flex;align-items:flex-start;gap:8px;padding:12px 12px 0}
.card-h .exname{font-family:var(--mono);font-size:15px;font-weight:700;letter-spacing:.01em;flex:1;line-height:1.3}
.card-h .exname .modechip{font-size:10px;font-weight:400;color:var(--faint);letter-spacing:.12em;
  text-transform:uppercase;margin-left:8px}
.setupline{font-family:var(--mono);font-size:12px;color:var(--muted);padding:3px 12px 0;white-space:pre-wrap;word-break:break-word}
.restline{font-family:var(--mono);font-size:11px;color:var(--faint);padding:2px 12px 0;letter-spacing:.05em}
.nextline{font-family:var(--mono);font-size:11.5px;padding:6px 12px 0}
.nextline .k{color:var(--faint)}
.nextline .v{color:var(--blue)}
.nextline .warn{color:var(--red)}
.ringline{font-family:var(--mono);font-size:12px;color:var(--orange);padding:3px 12px 0;letter-spacing:.03em}
.ringline.bad{color:var(--red)}
.ringline.faint{color:var(--faint)}
.ring-readout{font-family:var(--mono);font-size:13px;color:var(--orange);background:#2a2419;border:1px solid #4a3a24;
  border-radius:4px;padding:8px 10px;margin-top:8px;letter-spacing:.02em}
.ring-readout.bad{color:var(--red);background:#2c2020;border-color:#5a3230}
.ringsec{border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.calib{border:1px solid var(--line);border-radius:6px;background:#242424;padding:12px;margin-top:6px}
.calib-h{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.calib .btn{margin-top:8px}
.card-body{padding:8px 8px 4px}
.card-f{display:flex;gap:6px;flex-wrap:wrap;padding:6px 8px 10px}
.painbar{margin:8px;border:1px solid #5a3230;background:#2c2020;border-radius:4px;padding:9px 10px;font-size:13px}
.painbar .btnrow{margin-top:8px}
.stoppedline{font-family:var(--mono);font-size:11px;color:var(--red);padding:6px 12px;letter-spacing:.08em}

/* ladder blocks */
.ladder{border:1px solid var(--line);border-radius:4px;margin:6px 4px;background:#242424}
.ladder-h{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--faint);
  letter-spacing:.12em;text-transform:uppercase;padding:7px 10px 2px}
.ladder-h .fill{flex:1}
.ladder .addrung{margin:2px 8px 8px}

/* set rows */
.set{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:4px;flex-wrap:wrap}
.set .actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.set + .set{border-top:1px solid #2e2e2e}
.set .idx{font-family:var(--mono);font-size:11px;color:var(--faint);width:26px;text-align:right;flex:none}
.set .val{font-family:var(--mono);font-size:16px;font-weight:700;background:var(--panel2);
  border:1px solid var(--line2);border-radius:4px;padding:8px 10px;min-width:64px;text-align:center}
.set .val .u{font-size:11px;font-weight:400;color:var(--muted)}
.set .val:hover{border-color:var(--orange)}
.set.planned .val{color:var(--muted);font-weight:600;border-style:dashed}
.set .stp{font-family:var(--mono);font-size:16px;color:var(--muted);border:1px solid var(--line);
  border-radius:4px;width:34px;height:38px;flex:none;background:var(--panel)}
.set .stp:hover{color:var(--text);border-color:var(--line2)}
.set .grow{flex:1}
.set .done-btn{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.05em;
  background:var(--orange);color:var(--orange-ink);border-radius:5px;padding:10px 16px;min-height:40px}
.set .done-btn:hover{background:var(--orange-hi)}
.set .minor{font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--line);
  border-radius:3px;padding:5px 7px;letter-spacing:.06em}
.set .minor:hover{color:var(--muted);border-color:var(--line2)}
.chips{display:flex;gap:4px}
.chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--line);
  border-radius:3px;padding:6px 8px;color:var(--faint);min-height:32px}
.chip.on-clean{color:var(--green);border-color:#40532f;background:#232a1d}
.chip.on-ugly{color:var(--amber);border-color:#5d4a1e;background:#2b2519}
.chip.on-pain{color:var(--red);border-color:#5a3230;background:#2c2020}
.set .note-ind{font-size:11px;color:var(--blue)}
.status-word{font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.status-word.failed{color:var(--red)}
.status-word.skipped{color:var(--faint)}

/* set editor */
.setedit{background:#242424;border:1px solid var(--line);border-radius:4px;margin:2px 6px 8px;padding:10px}
.setedit .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.setedit label{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
.setedit input[type=text],.setedit input[type=number]{width:86px;text-align:center;font-family:var(--mono)}
.setedit input.notein{width:100%;text-align:left;font-family:var(--sans)}
.setedit select{font-family:var(--mono)}

/* card menu */
.menu{background:#242424;border:1px solid var(--line);border-radius:4px;margin:6px 8px;padding:6px;
  display:flex;flex-wrap:wrap;gap:6px}

/* notes */
.exnotes{margin:6px 8px}
.exnotes textarea{width:100%;min-height:60px;font-family:var(--sans);font-size:13.5px}

/* add exercise / overlays */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(12,12,12,.66);display:flex;
  align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--panel);border:1px solid var(--line2);border-bottom:none;
  border-radius:10px 10px 0 0;width:100%;max-width:680px;max-height:88vh;overflow:auto;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-family:var(--mono);font-size:15px;margin:0 0 12px;letter-spacing:.03em}
.sheet .frow{margin-bottom:12px}
.sheet label.lab{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.sheet label.lab sub{text-transform:lowercase;font-size:.78em;letter-spacing:0}
.exname-wrap{position:relative}
.exlist{display:none;position:absolute;left:0;right:0;top:100%;z-index:5;margin-top:4px;
  max-height:210px;overflow:auto;background:var(--panel3);border:1px solid var(--line2);border-radius:6px;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.exlist.open{display:block}
.exitem{display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13px;
  padding:9px 11px;color:var(--text);border-bottom:1px solid var(--line)}
.exitem:last-child{border-bottom:none}
.exitem:hover{background:var(--orange);color:var(--orange-ink)}
.exitem .mt{color:var(--orange)}
.exitem:hover .mt{color:var(--orange-ink);font-weight:700}
.sheet input[type=text],.sheet textarea{width:100%}
.sheet textarea{min-height:64px}
.seg{display:flex;gap:0;border:1px solid var(--line2);border-radius:5px;overflow:hidden;width:fit-content;max-width:100%;flex-wrap:wrap}
.seg button{font-family:var(--mono);font-size:12.5px;padding:9px 13px;color:var(--muted);background:var(--panel2)}
.seg button + button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--orange);color:var(--orange-ink);font-weight:700}
.hint{font-size:12px;color:var(--faint);margin-top:4px;font-family:var(--mono)}
.inline2{display:flex;gap:10px;flex-wrap:wrap}
.inline2 .frow{flex:1;min-width:130px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}

/* export */
.exp-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.exp-out{width:100%;min-height:240px;font-family:var(--mono);font-size:12.5px;line-height:1.5;
  background:#1a1a1a;border-color:var(--line);white-space:pre;overflow:auto}

/* clone preview */
.clone-prev{border:1px solid var(--line);border-radius:4px;background:#242424;padding:10px 12px;margin-bottom:12px}
.clone-prev .pl{display:flex;gap:10px;font-family:var(--mono);font-size:12.5px;padding:3px 0;flex-wrap:wrap}
.clone-prev .pn{color:var(--text);min-width:150px}
.clone-prev .pt{color:var(--blue)}
.clone-prev .pr{color:var(--faint);font-size:11px}
.clone-prev .pw{color:var(--red);font-size:11px}
.togglerow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.togglerow input{width:auto}

/* timer bar — signature element */
.timerbar{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:#232323;border-top:1px solid var(--line2);
  padding:0 0 env(safe-area-inset-bottom,0px)}
.timerbar .fillwrap{position:relative;height:64px;max-width:680px;margin:0 auto;overflow:hidden}
.timerbar .fill{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#7a4410,#a95c12);
  transition:width .25s linear}
.timerbar.over .fill{background:linear-gradient(90deg,#8a6a1d,#b98a22);width:100%!important;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:.55}}
.timerbar .content{position:relative;display:flex;align-items:center;gap:12px;height:64px;padding:0 14px}
.timerbar .tlab{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#cbb59a;max-width:38%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timerbar .tmain{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:.02em}
.timerbar.over .tmain{color:#ffd88a}
.timerbar .ttarget{font-family:var(--mono);font-size:12px;color:#cbb59a}
.timerbar .fillsp{flex:1}
.timerbar .tstop{font-family:var(--mono);font-size:12px;border:1px solid #6a5030;border-radius:4px;
  padding:8px 12px;color:#e8d5b8;background:rgba(0,0,0,.25)}
.hidden{display:none!important}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="dot">●</span> workout_recorder</div>
  <div class="spacer"></div>
  <button class="iconbtn" data-a="settings-open" title="rigging & profile" aria-label="rigging and profile settings">⚙ setup</button>
  <button class="iconbtn" id="soundbtn" data-a="sound-toggle" title="timer sound">♪ on</button>
</header>

<main id="app"></main>

<div id="timerbar" class="timerbar hidden" role="timer" aria-live="off">
  <div class="fillwrap">
    <div class="fill" id="tfill"></div>
    <div class="content">
      <div class="tlab" id="tlab">rest</div>
      <div class="tmain" id="tmain">0:00</div>
      <div class="ttarget" id="ttarget">/ 2:30</div>
      <div class="fillsp"></div>
      <button class="tstop" data-a="timer-stop">stop</button>
    </div>
  </div>
</div>

<div id="overlay" class="overlay hidden"></div>

<script>
"use strict";
/* ================= pure helpers ================= */
/*__PURE_START__*/
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtRest(sec){ sec = Math.max(0, Math.round(sec||0)); var m = Math.floor(sec/60), s = sec%60; return m + ":" + String(s).padStart(2,"0"); }
function parseRest(str){
  if (str==null) return null;
  str = String(str).trim(); if (!str) return null;
  if (str.indexOf(":") >= 0){ var p = str.split(":"); var m = parseInt(p[0],10)||0, s = parseInt(p[1],10)||0; return m*60+s; }
  var n = parseFloat(str); return isNaN(n) ? null : Math.round(n);
}
/* "8/8/8", "8, 8, 8", "15x8, 10x12" -> [{reps, load?}] */
function parseTargets(str){
  if (!str) return [];
  return String(str).split(/[\/,]+/).map(function(t){ return t.trim(); }).filter(Boolean).map(function(t){
    var m = t.match(/^(\d+(?:\.\d+)?)\s*[x×]\s*(\d+)$/i);
    if (m) return { reps:parseInt(m[2],10), load:parseFloat(m[1]) };
    var n = parseInt(t,10);
    return isNaN(n) ? null : { reps:n };
  }).filter(Boolean);
}
/* "3 3 2" or "3/3/2" -> [3,3,2] ladder tops */
function parseTops(str){
  if (!str) return [];
  return String(str).split(/[\s\/,]+/).map(function(t){ return parseInt(t,10); }).filter(function(n){ return n>0; });
}
function dateHeading(iso){ return iso; } /* dates are ISO-8601 site-wide */
function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function isoOf(y,m,d){ return y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0"); }

    if (!tops.length) tops = [1];

    var complete = performed.length && ex.sets.every(function(s){ return s.status==="done_clean"; });

    var next = tops.slice();
    var bumped = false;
    for (var i=1;i<next.length;i++){ if (next[i] < next[0]) { next[i]++; bumped = true; break; } }
    if (!bumped) next[0]++;

  }

  /* straight / weighted / timed */
  var base = performed.length ? performed : ex.sets;
  var targets = base.map(function(s){ return { reps: (s.target != null ? s.target : s.reps) || 0, load: s.load }; });
  if (!targets.length) targets = [{reps:0}];
  if (anyPain) return { kind:"sets", targets:targets, reason:"pain — do not progress; consider an easier variation or less volume", warn:true };
  if (anyUgly || anyFail) return { kind:"sets", targets:targets, reason:"repeat same target — " + (anyUgly ? "ugly reps last time" : "failed/skipped set") };

    var t2 = targets.map(function(t){ return { reps:t.reps, load:t.load }; });

/* ---------- ring pushup geometry (approximation: shoulder ≈ ring) ---------- */
function ringAngle(A, S, Rr, H){
  if (A==null || S==null || Rr==null || H==null) return null;      // missing input
  if (!(A>0) || !(S>0)) return null;
  var R = A - Rr;                                                   // strap length — derived, never cached
  var K = (R*R - A*A - H*H - S*S) / 2;
  var denom = S * Math.sqrt(H*H + A*A);
  if (denom === 0) return { impossible:true };
  var c = K / denom;
  if (c < -1 || c > 1) return { impossible:true };                 // ring can't reach that spot
  var deg = (Math.atan2(-A, H) + Math.acos(c)) * 180 / Math.PI;    // +acos root; signed H selects regime
  return { deg: deg };
}
function calibrateAnchor(x1, y1, Rr){
  if (x1==null || y1==null || Rr==null) return null;
  if (isNaN(x1) || isNaN(y1) || isNaN(Rr)) return null;
  var denom = 2 * (y1 - Rr);
  if (denom === 0) return null;
  return (x1*x1 + y1*y1 - Rr*Rr) / denom;
}
/* resolve a geometry-enabled exercise to a display line, given global rig + profile.

function ringType(ex){ return ex.ring && ex.ring.type ? ex.ring.type : "none"; }
function ringInfo(ex, rig, profile){
  var type = ringType(ex);
  if (type === "none") return null;
  if (type === "pushup"){
    var Rr = ex.ring.Rr, H = ex.ring.H;
    if (Rr==null || H==null) return { incomplete:true, text:"ring pushup — enter ring height + toe distance" };
    var A = rig ? rig.anchorHeight : null, S = profile ? profile.shoulder : null;
    if (A==null || S==null) return { incomplete:true, text:"ring pushup — set anchor height + shoulder in setup" };
    var r = ringAngle(A, S, Rr, H);
    if (!r) return { incomplete:true, text:"ring pushup — incomplete" };
    var hs = (H>=0?"+":"") + H;
    if (r.impossible) return { impossible:true, Rr:Rr, H:H, text:"ring pushup — impossible configuration (can't reach) · Rr "+Rr+" · H "+hs };
    return { deg:r.deg, Rr:Rr, H:H, text:"∠ "+r.deg.toFixed(1)+"° · Rr "+Rr+" · H "+hs+" cm" };
  }
  return null;
}

/* ================= storage (artifact window.storage → localStorage fallback) ================= */
var KEY = "wr:data:v1";
var store = {
  async load(){
    if (window.storage && window.storage.get){
      try { var r = await window.storage.get(KEY); if (r && r.value) return JSON.parse(r.value); return null; }
      catch(e){ /* key not found or storage error */ }
    }
    try { var v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch(e){ return null; }
  },
  _t:null,
  save(data){
    clearTimeout(this._t);
    var self = this;
    this._t = setTimeout(function(){ self.flush(data); }, 400);
    this._pending = data;
  },
  async flush(data){
    data = data || this._pending; if (!data) return;
    var s;
    try { s = JSON.stringify(data); } catch(e){ return; }
    var ok = false;
    if (window.storage && window.storage.set){
      try { await window.storage.set(KEY, s); ok = true; } catch(e){ ok = false; }
    }
    if (!ok){ try { localStorage.setItem(KEY, s); } catch(e){} }
  }
};
document.addEventListener("visibilitychange", function(){ if (document.visibilityState==="hidden") store.flush(); });
window.addEventListener("pagehide", function(){ store.flush(); });

/* ================= rest timer ================= */
var timer = null; /* { since, target, label, setId } */
var tickHandle = null, beeped = false, audioCtx = null;
function beep(){
  if (!state.settings.sound) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = "square"; o.frequency.value = 880;
    g.gain.setValueAtTime(0.08, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.35);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.36);
  }catch(e){}
  if (navigator.vibrate) { try{ navigator.vibrate(200); }catch(e){} }
}
function recordRestActual(){
  if (!timer) return;
  var w = activeWorkout(); if (!w) return;
  var hit = findSet(w, timer.setId);
  if (hit) hit.set.restActual = Math.round((Date.now() - timer.since)/1000);
}

  recordRestActual();
  timer = { since: Date.now(), target: target, label: label, setId: setId };
  beeped = false;
  document.getElementById("timerbar").classList.remove("hidden");
  if (!tickHandle) tickHandle = setInterval(tick, 250);
  tick();
}
function stopTimer(){

  if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }

}
function tick(){
  if (!timer) return;
  var el = Math.floor((Date.now() - timer.since)/1000);
  var bar = document.getElementById("timerbar");
  var over = el >= timer.target;
  bar.classList.toggle("over", over);
  document.getElementById("tlab").textContent = timer.label;
  document.getElementById("tmain").textContent = over ? "+" + fmtRest(el - timer.target) : fmtRest(el);
  document.getElementById("ttarget").textContent = over ? "rested " + fmtRest(timer.target) : "/ " + fmtRest(timer.target);
  document.getElementById("tfill").style.width = Math.min(100, (el/Math.max(1,timer.target))*100) + "%";
  if (over && !beeped){ beeped = true; beep(); }
}

function completeSet(setId){

  var ex = hit.ex, s = hit.set;

  s.status = "done_clean";
  var isRung = ex.mode==="ladder";
  var target = ex.restSet, label = ex.name + " · set rest";

    var more = ex.sets.some(function(x){ return x.ladderIndex===s.ladderIndex && (x.rungIndex||0) > (s.rungIndex||0) && x.status==="planned"; });
    if (more){ target = ex.restRung; label = ex.name + " · rung rest"; s.restTarget = ex.restRung; }
    else { target = ex.restSet; label = ex.name + " · ladder rest"; s.restTarget = ex.restSet; }

function renderCard(w, ex){
  var h = '<section class="card'+(ex.stopped?' stopped':'')+'">';
  h += '<div class="card-h"><div class="exname">'+esc(ex.name)
     + '<span class="modechip">'+esc(ex.mode)+'</span></div>'
     + '<button class="iconbtn" data-a="ex-menu" data-ex="'+ex.id+'" aria-label="exercise menu">⋯</button></div>';

  var ri = ringInfo(ex, state.rig, state.profile);
  if (ri) h += '<div class="ringline'+(ri.impossible?' bad':ri.incomplete?' faint':'')+'">'+esc(ri.text)+'</div>';
  h += '<div class="restline">rest '+fmtRest(ex.restSet)+(ex.mode==="ladder" ? ' · rung '+fmtRest(ex.restRung) : '')+'</div>';

  var perf = ex.sets.filter(isPerformed);
  if (perf.length){
    var sug = suggestForExercise(ex);
    h += '<div class="nextline"><span class="k">next time → </span><span class="'+(sug.warn?'warn':'v')+'">'
       + esc(targetsLabel(sug)) + '</span> <span class="k">· '+esc(sug.reason)+'</span></div>';
  }
  if (ex.stopped) h += '<div class="stoppedline">■ stopped'+(ex.stopReason ? ' — '+esc(ex.stopReason) : '')+'</div>';

  if (ui.menuExId === ex.id) h += renderMenu(w, ex);

    h += '<div class="painbar">Pain marked on this exercise.'
      + '<div class="btnrow"><button class="btn small danger" data-a="stop-ex" data-ex="'+ex.id+'">Stop exercise</button>'
      + '<button class="btn small" data-a="backoff" data-ex="'+ex.id+'">Add backoff exercise</button>'
      + '<button class="btn small ghost" data-a="pain-dismiss">Continue</button></div></div>';
  }

  h += '<div class="card-body">';
  if (ex.mode === "ladder"){
    laddersOf(ex).forEach(function(L){
      h += '<div class="ladder"><div class="ladder-h">Ladder '+L.idx+'<span class="fill"></span></div>';
      L.sets.forEach(function(s){ h += renderSetRow(ex, s); if (ui.editSetId===s.id) h += renderSetEdit(ex, s); });

    ex.sets.forEach(function(s){ h += renderSetRow(ex, s); if (ui.editSetId===s.id) h += renderSetEdit(ex, s); });

    h += '<div class="exnotes"><textarea data-field="exnotes" data-ex="'+ex.id+'" placeholder="exercise notes…">'+esc(ex.notes)+'</textarea></div>';
  }

    if (ex.mode === "ladder"){
      h += '<button class="btn small" data-a="add-ladder" data-ex="'+ex.id+'">+ ladder</button>';
    } else {

      var lastDone = ex.sets.filter(isDone).slice(-1)[0];
      if (lastDone) h += '<button class="btn small" data-a="repeat" data-ex="'+ex.id+'">↻ repeat '+ (ex.mode==="timed" ? lastDone.reps+'s' : (lastDone.load!=null? lastDone.load+'×':'')+lastDone.reps) +'</button>';
    }

  h += '</div></section>';

function renderSetRow(ex, s){

function updateExList(q){
  var l = document.getElementById("exList"); if (!l) return;
  q = (q||"").trim().toLowerCase();
  var items = Array.prototype.slice.call(l.querySelectorAll(".exitem"));
  items.forEach(function(el,i){ if (el.dataset.orig==null) el.dataset.orig = String(i); });
  function score(el){
    var n = el.dataset.name.toLowerCase();
    if (!q) return 0;
    if (n.indexOf(q)===0) return 0;   // prefix match first
    if (n.indexOf(q)>=0) return 1;    // substring match next
    return 2;                          // everything else still shown, below
  }
  items.sort(function(a,b){
    var sa=score(a), sb=score(b);
    if (sa!==sb) return sa-sb;
    return (+a.dataset.orig)-(+b.dataset.orig);
  });
  items.forEach(function(el){
    var name = el.dataset.name, idx = q ? name.toLowerCase().indexOf(q) : -1;
    if (idx>=0) el.innerHTML = esc(name.slice(0,idx))+'<span class="mt">'+esc(name.slice(idx,idx+q.length))+'</span>'+esc(name.slice(idx+q.length));
    else el.textContent = name;
    l.appendChild(el);
  });
}
function ringReadoutText(d){
  var A = state.rig.anchorHeight, S = state.profile.shoulder;
  var Rr = parseFloat(d.ringRr), H = parseFloat(d.ringH);
  if (isNaN(Rr) || isNaN(H)) return "enter Rr and H to see the angle";
  var r = ringAngle(A, S, Rr, H);
  if (!r) return "set anchor height & shoulder in setup";
  if (r.impossible) return "impossible configuration — ring can't reach";
  return "body angle ≈ " + r.deg.toFixed(1) + "°";
}
function calReadoutText(){
  var rg = state.rig;
  var A = calibrateAnchor(rg.calX, rg.calY, rg.calRr);
  if (A==null || isNaN(A)) return "enter x₁, y₁, Rr";
  if (A<=0) return "check inputs — non-physical result";
  return "computed A ≈ " + A.toFixed(1) + " cm";
}

function cloneWorkout(srcId, applyProg){
  var src = findWorkout(srcId); if (!src) return;
  var w = newWorkout(src.name);
  src.exercises.forEach(function(sx){
    var ex = makeExercise({ name:sx.name, mode:sx.mode, setup:sx.setup, restSet:sx.restSet, restRung:sx.restRung,
      ring: sx.ring ? { type:(sx.ring.type||(sx.ring.enabled?"pushup":"none")), Rr:sx.ring.Rr, H:sx.ring.H } : { type:"none", Rr:null, H:null } });
    var sug = suggestForExercise(sx);
    if (sx.mode==="ladder"){
      ex.sets = buildLadderSets(applyProg ? sug.tops : (topsOf(sx).length ? topsOf(sx) : [1]));
    } else {
      var unit = (sx.sets.find(function(s){return s.unit;})||{}).unit || "kg";
      var targets = applyProg ? sug.targets
        : sx.sets.map(function(s){ return { reps: s.target!=null?s.target:(s.reps||0), load: s.load }; });
      if (!targets.length) targets = [{reps:0}];
      ex.sets = buildSetsFromTargets(targets, unit);
    }
    if (applyProg && sug.warn) ex.notes = "⚠ " + sug.reason;
    w.exercises.push(ex);
  });
  ui.view = "workout"; ui.overlay = null;
  save(); render(); window.scrollTo(0,0);
}
function loadSample(){
  var w = newWorkout("Friday Upper");
  var e1 = makeExercise({ name:"Ring Inclined Pushups", mode:"straight", setup:"rings lower shin, body ~45°, feet floor", restSet:150 });
  e1.sets = buildSetsFromTargets([{reps:12},{reps:12},{reps:12}]);
  var e2 = makeExercise({ name:"Ring Row", mode:"straight", setup:"body ~45° · grip neutral · range chest to rings", restSet:150 });
  e2.sets = buildSetsFromTargets([{reps:8},{reps:8},{reps:8}]);
  var e3 = makeExercise({ name:"Handle Full Pushups", mode:"ladder", restSet:150, restRung:20 });
  e3.sets = buildLadderSets([3,3,2]);
  var e4 = makeExercise({ name:"Hanging Knee Raise", mode:"straight", restSet:120 });
  e4.sets = buildSetsFromTargets([{reps:6},{reps:6},{reps:6}]);
  var e5 = makeExercise({ name:"Banded Hip Bridges", mode:"weighted", setup:"band at hips · anchor floor · lying", restSet:120 });
  e5.sets = buildSetsFromTargets([{reps:8,load:15},{reps:12,load:10},{reps:10,load:10}],"kg");
  w.exercises = [e1,e2,e3,e4,e5];
  w.exercises.forEach(touchPreset);
  ui.view = "workout";
  save(); render(); window.scrollTo(0,0);
}

/* ================= add-exercise helpers ================= */
function openAddEx(editExId, prefillName){
  var w = activeWorkout();
  var d = { name: prefillName||"", mode:"straight", targets:"8 / 8 / 8", tops:"3 3 2", rest:"2:30", rrest:"0:20", setup:"", ringType:"none", ringRr:"", ringH:"" };
  if (editExId && w){
    var ex = findEx(w, editExId);
    if (ex){
      d.name = ex.name; d.mode = ex.mode; d.setup = ex.setup;
      d.rest = fmtRest(ex.restSet); d.rrest = fmtRest(ex.restRung);
      d.ringType = (ex.ring && ex.ring.type) ? ex.ring.type : (ex.ring && ex.ring.enabled ? "pushup" : "none");
      d.ringRr = ex.ring && ex.ring.Rr!=null ? String(ex.ring.Rr) : "";
      d.ringH = ex.ring && ex.ring.H!=null ? String(ex.ring.H) : "";
      if (ex.mode==="ladder") d.tops = topsOf(ex).join(" ");
      else d.targets = ex.sets.map(function(s){ return (s.load!=null? s.load+"x":"")+(s.target!=null?s.target:(s.reps||0)); }).join(" / ");
    }
  }
  ui.overlay = { type:"addex", editExId: editExId||null, draft: d, afterExId: null };
  render();
}
function applyPresetToDraft(d){
  var p = state.presets[(d.name||"").trim().toLowerCase()];
  if (!p) return;
  d.mode = p.mode || d.mode;
  d.setup = p.setup || d.setup;
  if (p.restSet!=null) d.rest = fmtRest(p.restSet);
  if (p.restRung!=null) d.rrest = fmtRest(p.restRung);
  if (p.mode==="ladder" && p.lastTops && p.lastTops.length) d.tops = p.lastTops.join(" ");
  else if (p.lastTargets && p.lastTargets.length){
    d.targets = p.lastTargets.map(function(t){ return (t.load!=null? t.load+"x":"")+t.reps; }).join(" / ");
  }
  if (p.ring){ d.ringType = p.ring.type || "pushup"; d.ringRr = p.ring.Rr!=null?String(p.ring.Rr):""; d.ringH = p.ring.H!=null?String(p.ring.H):""; }
}
function draftRing(d){
  var Rr = parseFloat(d.ringRr), H = parseFloat(d.ringH);
  return { type: d.ringType || "none", Rr: isNaN(Rr) ? null : Rr, H: isNaN(H) ? null : H };
}
function saveAddEx(){
  var o = ui.overlay; if (!o || o.type!=="addex") return;
  var w = activeWorkout(); if (!w){ w = newWorkout("Workout"); ui.view="workout"; }
  var d = o.draft;
  var name = (d.name||"").trim(); if (!name) return;
  var restSet = parseRest(d.rest); if (restSet==null) restSet = 150;
  var restRung = parseRest(d.rrest); if (restRung==null) restRung = 20;

  if (o.editExId){
    var ex = findEx(w, o.editExId); if (!ex) return;
    ex.name = name; ex.setup = d.setup; ex.restSet = restSet; ex.restRung = restRung;
    ex.ring = draftRing(d);
    /* keep performed sets, rebuild the planned remainder from the edited targets */
    var performed = ex.sets.filter(isPerformed);
    {
      ex.mode = d.mode;
      var fresh;
      if (d.mode==="ladder"){
        var tops = parseTops(d.tops); if (!tops.length) tops=[1];
        fresh = buildLadderSets(tops).filter(function(ns){
          return !performed.some(function(ps){ return ps.ladderIndex===ns.ladderIndex && ps.rungIndex===ns.rungIndex; });
        });
      } else {
        var tg = parseTargets(d.targets); if (!tg.length) tg=[{reps:0}];
        fresh = buildSetsFromTargets(tg.slice(performed.length), "kg");
        if (d.mode!=="weighted") fresh.forEach(function(s){ if (!performed.length) { s.load=null; s.unit=null; } });
      }
      ex.sets = performed.concat(fresh);
    }
    touchPreset(ex);
  } else {
    var nx = makeExercise({ name:name, mode:d.mode, setup:d.setup, restSet:restSet, restRung:restRung, ring:draftRing(d) });
    if (d.mode==="ladder"){
      var tp = parseTops(d.tops); if (!tp.length) tp=[1];
      nx.sets = buildLadderSets(tp);
    } else {
      var tt = parseTargets(d.targets); if (!tt.length) tt=[{reps: d.mode==='timed'?30:8}];
      nx.sets = buildSetsFromTargets(tt, "kg");
    }
    if (o.afterExId){
      var i = w.exercises.findIndex(function(e){ return e.id===o.afterExId; });
      w.exercises.splice(i+1, 0, nx);
    } else w.exercises.push(nx);
    touchPreset(nx);
  }
  ui.overlay = null; ui.painExId = null;
  save(); render();
}

/* ================= event wiring ================= */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-a]");
  if (!t) {
    /* tap on overlay backdrop closes it */
    if (ev.target.id === "overlay"){ ui.overlay = null; render(); }
    return;
  }
  var a = t.dataset.a;
  var w = activeWorkout();

  switch(a){
    case "sound-toggle": state.settings.sound = !state.settings.sound; save(); render(); break;
    case "settings-open": ui.overlay = { type:"settings" }; render(); break;
    case "ex-pick": (function(){
        if (!ui.overlay || ui.overlay.type!=="addex") return;
        var d = ui.overlay.draft;
        d.name = t.dataset.name;
        if (!ui.overlay.editExId) applyPresetToDraft(d);
        render();
      })(); break;
    case "cal-apply": (function(){
        var rg = state.rig;
        var A = calibrateAnchor(rg.calX, rg.calY, rg.calRr);
        if (A!=null && !isNaN(A) && A>0){ rg.anchorHeight = Math.round(A*10)/10; save(); render(); }
      })(); break;
    case "nav-home": ui.view="home"; ui.menuExId=null; ui.editSetId=null; render(); break;
    case "new-workout": newWorkout("Workout"); ui.view="workout"; save(); render(); break;
    case "sample": loadSample(); break;
    case "open-workout": state.activeId = t.dataset.id; ui.view="workout"; save(); render(); window.scrollTo(0,0); break;
    case "home-tab": ui.homeTab = t.dataset.t; render(); break;
    case "cal-prev": ui.calM--; if (ui.calM<0){ ui.calM=11; ui.calY--; } ui.calSel=null; render(); break;
    case "cal-next": ui.calM++; if (ui.calM>11){ ui.calM=0; ui.calY++; } ui.calSel=null; render(); break;
    case "cal-day": ui.calSel = ui.calSel===t.dataset.d ? null : t.dataset.d; render(); break;
    case "finish-workout": if (w){ w.finished = true; stopTimer(); ui.view="home"; save(); render(); } break;
    case "reopen-workout": if (w){ w.finished = false; save(); render(); } break;

    case "clone-open": ui.overlay = { type:"clone", srcId: state.workouts[0] && state.workouts[0].id, prog:true }; render(); break;
    case "clone-start": cloneWorkout(t.dataset.src, ui.overlay && ui.overlay.prog); break;

    case "export-open": ui.overlay = { type:"export", wid: w && w.id }; render(); break;
    case "exp-fmt": ui.expFmt = t.dataset.f; render(); break;
    case "exp-copy": (function(){
        var out = document.getElementById("expout"); if (!out) return;
        var msg = document.getElementById("copymsg");
        function ok(){ if (msg) msg.textContent = "copied ✓"; }
        function fail(){ out.focus(); out.select(); try{ document.execCommand("copy"); ok(); }catch(e){ if (msg) msg.textContent = "select & copy manually"; } }
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(ok, fail);
        else fail();
      })(); break;
    case "exp-download": (function(){
        var out = document.getElementById("expout"); if (!out || !w) return;
        var ext = ui.expFmt==="csv" ? "csv" : "txt";
        var blob = new Blob([out.value], {type: ext==="csv" ? "text/csv" : "text/plain"});
        var a2 = document.createElement("a");
        a2.href = URL.createObjectURL(blob);
        a2.download = "workout-" + w.date + "." + ext;
        document.body.appendChild(a2); a2.click(); a2.remove();
        setTimeout(function(){ URL.revokeObjectURL(a2.href); }, 4000);
      })(); break;

    case "addex-open": openAddEx(null); break;
    case "ax-mode": if (ui.overlay){ ui.overlay.draft.mode = t.dataset.m; render(); } break;
    case "ax-save": saveAddEx(); break;
    case "overlay-close": ui.overlay = null; render(); break;

    case "ex-menu": ui.menuExId = ui.menuExId===t.dataset.ex ? null : t.dataset.ex; render(); break;
    case "ex-menu-close": ui.menuExId = null; render(); break;
    case "ex-edit": ui.menuExId=null; openAddEx(t.dataset.ex); break;
    case "ex-delete": if (w && confirm("Delete this exercise and its sets?")){ w.exercises = w.exercises.filter(function(e){ return e.id!==t.dataset.ex; }); ui.menuExId=null; save(); render(); } break;
    case "ex-up": case "ex-down": (function(){
        if (!w) return; var i = w.exercises.findIndex(function(e){ return e.id===t.dataset.ex; });
        var j = a==="ex-up" ? i-1 : i+1;
        if (j<0 || j>=w.exercises.length) return;
        var tmp = w.exercises[i]; w.exercises[i]=w.exercises[j]; w.exercises[j]=tmp;
        save(); render();
      })(); break;
    case "convert-ladder": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        ex.mode = "ladder";
        var li = 1, r = 1;
        ex.sets.forEach(function(s){ if (s.ladderIndex==null){ s.ladderIndex = li; s.rungIndex = r++; } });
        ui.menuExId=null; save(); render();
      })(); break;
    case "convert-straight": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        ex.mode = "straight";
        ex.sets.forEach(function(s){ s.ladderIndex=null; s.rungIndex=null; });
        ui.menuExId=null; save(); render();
      })(); break;
    case "stop-ex": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        ex.stopped = true; ex.stopReason = "pain";
        ui.painExId = ex.id; ui.menuExId=null;
        save(); render();
      })(); break;
    case "unstop-ex": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        ex.stopped = false; ex.stopReason = null; ui.painExId=null; ui.menuExId=null;
        save(); render();
      })(); break;
    case "backoff": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        ui.menuExId=null; ui.painExId=null;
        openAddEx(null, "");
        ui.overlay.afterExId = ex.id;
        ui.overlay.draft.setup = "backoff of " + ex.name;
        ui.overlay.draft.mode = ex.mode==="ladder" ? "straight" : ex.mode;
        render();
      })(); break;
    case "pain-dismiss": ui.painExId = null; render(); break;

    case "notes-toggle": ui.notesExId = ui.notesExId===t.dataset.ex ? null : t.dataset.ex; render(); break;

    case "add-set": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        var last = ex.sets[ex.sets.length-1];
        ex.sets.push(makeSet({ target: last ? (last.target!=null?last.target:last.reps) : 8,
          load: last ? last.load : null, unit: last ? last.unit : null }));
        save(); render();
      })(); break;
    case "repeat": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        var last = ex.sets.filter(isDone).slice(-1)[0]; if (!last) return;
        var s = makeSet({ target:last.reps, reps:last.reps, load:last.load, unit:last.unit, status:"done_clean" });
        ex.sets.push(s);
        s.restTarget = ex.restSet;
        startTimer(ex.restSet, ex.name + " · set rest", s.id);
        save(); render();
      })(); break;
    case "add-rung": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        var L = parseInt(t.dataset.l,10);
        var rungs = ex.sets.filter(function(s){ return s.ladderIndex===L; });
        var top = Math.max.apply(null, rungs.map(function(s){ return s.rungIndex||0; }).concat([0]));
        ex.sets.push(makeSet({ ladderIndex:L, rungIndex:top+1, target:top+1 }));
        save(); render();
      })(); break;
    case "add-ladder": (function(){
        var ex = findEx(w, t.dataset.ex); if (!ex) return;
        var Ls = laddersOf(ex);
        var nextL = (Ls.length ? Ls[Ls.length-1].idx : 0) + 1;
        var top = Ls.length ? Math.max.apply(null, Ls[Ls.length-1].sets.map(function(s){ return s.rungIndex||1; })) : 3;
        for (var r=1;r<=top;r++) ex.sets.push(makeSet({ ladderIndex:nextL, rungIndex:r, target:r }));
        save(); render();
      })(); break;

    case "set-done": completeSet(t.dataset.set); break;
    case "set-status": setStatus(t.dataset.set, t.dataset.st); break;
    case "set-fail": setStatus(t.dataset.set, "failed"); break;
    case "set-skip": setStatus(t.dataset.set, "skipped"); break;
    case "set-unmark": (function(){
        var hit = findSet(w, t.dataset.set); if (!hit) return;
        hit.set.status = "planned"; hit.set.reps = null; hit.set.restActual = null;
        ui.editSetId = null; save(); render();
      })(); break;
    case "set-edit": ui.editSetId = ui.editSetId===t.dataset.set ? null : t.dataset.set; render(); break;
    case "set-edit-close": ui.editSetId = null; save(); render(); break;
    case "set-delete": (function(){
        var hit = findSet(w, t.dataset.set); if (!hit) return;
        hit.ex.sets = hit.ex.sets.filter(function(s){ return s.id!==t.dataset.set; });
        ui.editSetId = null; save(); render();
      })(); break;
    case "tgt-inc": case "tgt-dec": case "ed-inc": case "ed-dec": (function(){
        var hit = findSet(w, t.dataset.set); if (!hit) return;
        var s = hit.set, d = (a==="tgt-inc"||a==="ed-inc") ? 1 : -1;
        if (s.status==="planned") s.target = Math.max(0,(s.target||0)+d);
        else s.reps = Math.max(0,(s.reps||0)+d);
        save(); render();
      })(); break;

    case "timer-stop": stopTimer(); render(); break;
  }
});

/* inputs (change + input events) */
document.addEventListener("input", function(ev){
  var t = ev.target, f = t.dataset && t.dataset.field;
  if (!f) return;
  var w = activeWorkout();
  if (f==="wname" && w){ w.name = t.value; save(); return; }
  if (f==="exnotes" && w){ var ex = findEx(w, t.dataset.ex); if (ex){ ex.notes = t.value; save(); } return; }
  if (ui.overlay && ui.overlay.type==="addex"){
    var d = ui.overlay.draft;
    if (f==="ax-name"){ d.name = t.value; var el=document.getElementById("exList"); if (el){ el.classList.add("open"); updateExList(t.value); } return; }
    if (f==="ax-targets"){ d.targets = t.value; return; }
    if (f==="ax-tops"){ d.tops = t.value; return; }
    if (f==="ax-rest"){ d.rest = t.value; return; }
    if (f==="ax-rrest"){ d.rrest = t.value; return; }
    if (f==="ax-setup"){ d.setup = t.value; return; }
    if (f==="ax-ring-rr"){ d.ringRr = t.value; var ro=document.getElementById("ringReadout"); if (ro) ro.textContent = ringReadoutText(d); return; }
    if (f==="ax-ring-h"){ d.ringH = t.value; var ro2=document.getElementById("ringReadout"); if (ro2) ro2.textContent = ringReadoutText(d); return; }
  }
  if (ui.overlay && ui.overlay.type==="settings"){
    var num = function(v){ var n = parseFloat(v); return isNaN(n) ? null : n; };
    if (f==="set-shoulder"){ state.profile.shoulder = num(t.value); save(); return; }
    if (f==="set-anchor"){ state.rig.anchorHeight = num(t.value); save(); return; }
    if (f==="cal-x" || f==="cal-y" || f==="cal-rr"){
      state.rig[f==="cal-x"?"calX":f==="cal-y"?"calY":"calRr"] = num(t.value);
      var cr = document.getElementById("calReadout"); if (cr) cr.textContent = calReadoutText();
      save(); return;
    }
  }
  if (f==="ed-reps" || f==="ed-load" || f==="ed-note"){
    var hit = findSet(w, t.dataset.set); if (!hit) return;
    var s = hit.set;
    if (f==="ed-note"){ s.note = t.value; }
    else if (f==="ed-load"){ var L = parseFloat(t.value); s.load = isNaN(L) ? null : L; if (s.load!=null && !s.unit) s.unit="kg"; }
    else { var n = parseInt(t.value,10);
      if (s.status==="planned") s.target = isNaN(n) ? null : n;
      else s.reps = isNaN(n) ? null : n; }
    save();
    /* update the visible value pill without full re-render (keeps focus) */
  }
});
document.addEventListener("change", function(ev){
  var t = ev.target, f = t.dataset && t.dataset.field;
  if (!f) return;
  var w = activeWorkout();
  if (f==="ed-unit"){ var hit = findSet(w, t.dataset.set); if (hit){ hit.set.unit = t.value; save(); render(); } return; }
  if (f==="wdate" && w){ if (t.value){ w.date = t.value; save(); render(); } return; }
  if (f==="clone-src" && ui.overlay){ ui.overlay.srcId = t.value; render(); return; }
  if (f==="clone-prog" && ui.overlay){ ui.overlay.prog = t.checked; render(); return; }
  if (f==="ax-ring-type" && ui.overlay && ui.overlay.type==="addex"){
    ui.overlay.draft.ringType = t.value; render(); return;
  }
  if (f==="ed-reps" || f==="ed-load" || f==="ed-note"){ render(); }
});

document.addEventListener("focusin", function(e){
  var t = e.target;
  if (t && t.dataset && t.dataset.field==="ax-name"){
    var l = document.getElementById("exList");
    if (l){ l.classList.add("open"); updateExList(t.value); }
  }
});
document.addEventListener("focusout", function(e){
  var t = e.target;
  if (t && t.dataset && t.dataset.field==="ax-name"){
    setTimeout(function(){ var l = document.getElementById("exList"); if (l) l.classList.remove("open"); }, 160);
  }
});

/* ================= boot ================= */
(async function(){
  var loaded = await store.load();
  if (loaded && loaded.workouts){ state = Object.assign(state, loaded); }
  if (!state.settings) state.settings = { sound:true };
  if (!state.rig) state.rig = { anchorHeight:null, calX:null, calY:null, calRr:null };
  if (!state.profile) state.profile = { shoulder:null };
  state.workouts.forEach(function(w){ w.exercises.forEach(function(ex){
    if (!ex.ring) ex.ring = { type:"none", Rr:null, H:null };
    if (ex.ring.type == null) ex.ring.type = ex.ring.enabled ? "pushup" : "none";
  }); });
  var act = activeWorkout();
  if (act && !act.finished) ui.view = "workout";
  render();
})();
