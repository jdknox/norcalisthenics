<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Protein input storage integration</title>
<p>Run on an isolated shared-server checkout at 127.0.0.1:8766 with temporary data. This test writes a unique regression storage key.</p>
<output id="result">Running</output>
<iframe id="app-frame" title="Isolated protein app" style="width:100%;height:800px;border:0"></iframe>
<script>
'use strict';

let app_frame = document.getElementById('app-frame');
let app_window;
let app_document;
let field;
let next_sync_check;
let polls = 0;
window.addEventListener('error', reportTestError);
let request = new XMLHttpRequest();
request.open('GET', '../protein-loadout.html');
request.onload = loadApp;
request.send();

function reportTestError(event)
{
  document.getElementById('result').textContent = 'FAIL: ' + event.message;
}

function check(condition, message)
{
  if (condition) return;
  document.getElementById('result').textContent = 'FAIL: ' + message;
  throw new Error(message);
}

function evaluate(code)
{
  return app_window.eval(code);
}

function loadApp()
{
  check(request.status == 200, 'load app source');
  let html = request.responseText;
  html = html.replace('<head>', '<head><base href="/">');
  html = html.replace('\nload();\n</' + 'script>', '\n</' + 'script>');
  html = html.replace("if ('serviceWorker' in navigator)", 'if (false)');
  app_frame.onload = runTests;
  app_frame.srcdoc = html;
}

function edit(selector, value)
{
  let input = app_document.querySelector(selector);
  input.focus();
  input.value = value;
  input.dispatchEvent(new app_window.Event('input',
  {
    bubbles:true
  }));
  return input;
}

function waitForSync(next)
{
  next_sync_check = next;
  polls = 0;
  setTimeout(pollSync, 100);
}

function pollSync()
{
  check(++polls < 100, 'sync completes without a retry loop');
  if (evaluate('g_input_save_timer == null && !g_load_in_flight && !g_sync_in_flight && !g_unsynced_changes'))
  {
    next_sync_check();
    return;
  }
  setTimeout(pollSync, 100);
}

function runTests()
{
  check(location.hostname == '127.0.0.1' && location.port == '8766', 'use the isolated local test server on port 8766');
  app_window = app_frame.contentWindow;
  app_document = app_frame.contentDocument;
  check(evaluate('!!window.storage'), 'real storage adapter loaded');
  evaluate(`g_storage_key = 'protein-input-integration:' + uid(); g_unsynced_key = g_storage_key + ':unsynced';
    g_view_date = todayISO(); g_log = {}; mergeKnownItems(); g_bodyweight_kg = 80;
    g_bodyweight_by_date = {[g_view_date]:80}; render(); save();`);
  waitForSync(testPullRace);
}

function testPullRace()
{
  evaluate('refreshBodyweightFromShared();');
  field = edit('#bodyweight-input', '81.2');
  waitForSync(checkPullRace);
}

function checkPullRace()
{
  check(field.isConnected && app_document.activeElement == field && field.value == '81.2', 'late pull preserves the editor and newer value');
  check(evaluate('bodyweightForDate(g_view_date)') == 81.2, 'late pull cannot overwrite the model');
  check(evaluate('g_target == 122 && !g_target_manual'), 'new bodyweight updates the automatic protein target');
  check(evaluate("g_bodyweight_refresh_status.indexOf('keeping local edit') >= 0"), 'pull reports that a newer edit was kept');
  field = edit('#bodyweight-input', '82.1');
  evaluate('pushBodyweightToShared();');
  edit('#bodyweight-input', '82.2');
  waitForSync(checkPushRace);
}

function checkPushRace()
{
  check(field.isConnected && app_document.activeElement == field && field.value == '82.2', 'late push preserves the editor and newer value');
  check(evaluate('bodyweightForDate(g_view_date)') == 82.2, 'push cannot overwrite newer model state');
  check(evaluate('g_target == 124 && !g_target_manual'), 'automatic target follows the latest bodyweight through sync races');
  field = edit('#target-input', '140');
  evaluate('flushPendingInputSave();');
  edit('#target-input', '145');
  waitForSync(readFinalPayload);
}

function readFinalPayload()
{
  let request = new XMLHttpRequest();
  request.open('GET', '/api/storage?key=' + encodeURIComponent(evaluate('g_storage_key')));
  request.onload = checkFinalPayload;
  request.send();
}

function checkFinalPayload(event)
{
  let request = event.target;
  check(request.status == 200, 'read final shared state');
  let response = JSON.parse(request.responseText);
  let payload = JSON.parse(response.value);
  check(payload.target == 145 && payload.bodyweight_by_date[evaluate('g_view_date')] == 82.2, 'newer values survive real GET/POST sync races');
  check(payload.target_manual, 'shared storage preserves manual target mode');
  check(field.isConnected && app_document.activeElement == field, 'network replies preserve the active target editor');
  payload.bodyweight_by_date[evaluate('g_view_date')] = 83.5;
  payload.bodyweight_kg = 83.5;
  let update = new XMLHttpRequest();
  update.open('POST', '/api/storage?key=' + encodeURIComponent(evaluate('g_storage_key')));
  update.setRequestHeader('Content-Type', 'application/json');
  update.setRequestHeader('If-Match', response.revision);
  update.onload = pullUntouchedBodyweight;
  update.send(JSON.stringify(payload));
}

function pullUntouchedBodyweight(event)
{
  check(event.target.status == 200, 'prepare a new shared bodyweight');
  field = edit('#scoop-search', 'Egg');
  evaluate('refreshBodyweightFromShared();');
  polls = 0;
  setTimeout(checkUntouchedPull, 100);
}

function checkUntouchedPull()
{
  check(++polls < 100, 'bodyweight pull completes');
  if (evaluate("g_bodyweight_refresh_status.indexOf('pulled ')") != 0)
  {
    setTimeout(checkUntouchedPull, 100);
    return;
  }
  check(app_document.getElementById('bodyweight-input').value == '83.50', 'an untouched bodyweight updates from shared storage');
  check(evaluate('g_target == 145 && g_target_manual'), 'shared bodyweight pull keeps the manual target override');
  check(field.isConnected && app_document.activeElement == field && field.value == 'Egg', 'bodyweight pull preserves an unrelated active editor');
  field.blur();
  evaluate(`g_bodyweight_kg = 80; g_bodyweight_by_date[g_view_date] = 80;
    saveLocalJson(JSON.stringify(makeSavePayload())); load();`);
  waitForSync(checkReloadedBodyweight);
}

function checkReloadedBodyweight()
{
  check(evaluate('bodyweightForDate(g_view_date)') == 83.5, 'reload uses shared bodyweight over stale synced local data');
  let request = new XMLHttpRequest();
  request.open('GET', '/api/storage?key=' + encodeURIComponent(evaluate('g_storage_key')));
  request.onload = checkReloadedSharedBodyweight;
  request.send();
}

function checkReloadedSharedBodyweight(event)
{
  check(event.target.status == 200, 'read shared state after reload');
  let payload = JSON.parse(JSON.parse(event.target.responseText).value);
  check(payload.bodyweight_by_date[evaluate('g_view_date')] == 83.5, 'reload does not overwrite shared bodyweight with stale local data');
  document.getElementById('result').textContent = 'PASS: real GET/POST, bodyweight pull/push races, editor preservation, and shared bodyweight on reload';
}
</script></html>
