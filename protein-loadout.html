'use strict';

function esc(value)
{
  let text = String(value == null ? '' : value);
  let out = '';
  let ch;

  for (let i = 0; i < text.length; ++i)
  {
    ch = text.charAt(i);

    switch (ch)
    {
      case '&':
        out += '&amp;';
        break;
      case '<':
        out += '&lt;';
        break;
      case '>':
        out += '&gt;';
        break;
      case '"':
        out += '&quot;';
        break;
      case "'":
        out += '&#39;';
        break;
      default:
        out += ch;
        break;
    }
  }

  return out;
}

function uid()
{
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayISO()
{
  let d = new Date();
  d.setHours(d.getHours() - 1);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function shiftDateISO(iso, delta)
{
  let d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

let g_legacy_key_barcode_fixups = { granola_pe:'855140002991', skyr_siggis:'898248001411' };

function cloneKnownItem(known)
{
  let item = {
    key: known.key, barcode: known.barcode, name: known.name, brand: known.brand,
    volume_ml: known.volume_ml, volume_label: known.volume_label,
    scoop_g: known.scoop_g, protein_g: known.protein_g, kcal: known.kcal,
    protein_100g: known.protein_100g != null ? known.protein_100g : null,
    kcal_100g: known.kcal_100g != null ? known.kcal_100g : null,
    tags: Array.isArray(known.tags) ? known.tags.slice() : []
  };

  item.scoop_g_raw = item.scoop_g != null ? String(item.scoop_g) : '';
  item.protein_g_raw = item.protein_g != null ? String(item.protein_g) : '';
  item.kcal_raw = item.kcal != null ? String(item.kcal) : '';

  return item;
}

function mergeKnownItems()
{
  let known;
  let existing;
  let found;

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    existing = g_scoop_items[i];
    if (existing.barcode == null && g_legacy_key_barcode_fixups[existing.key]) existing.barcode = g_legacy_key_barcode_fixups[existing.key];
    if (g_legacy_key_brand_fixups[existing.key]) existing.brand = g_legacy_key_brand_fixups[existing.key];
    if (g_legacy_key_name_fixups[existing.key]) existing.name = g_legacy_key_name_fixups[existing.key];
  }

  for (let i = 0; i < g_known_items.length; ++i)
  {
    known = g_known_items[i];
    found = null;

    for (let j = 0; j < g_scoop_items.length; ++j)
    {
      if (g_scoop_items[j].barcode == known.barcode)
      {
        found = g_scoop_items[j];
        break;
      }
    }

    if (found)
    {
      if (found.volume_ml == null && found.volume_label == null)
      {
        found.volume_ml = known.volume_ml;
        found.volume_label = known.volume_label;
      }
      if (found.protein_100g == null && known.protein_100g != null) found.protein_100g = known.protein_100g;
      if (found.kcal_100g == null && known.kcal_100g != null) found.kcal_100g = known.kcal_100g;
      continue;
    }

    g_scoop_items.push(cloneKnownItem(known));
  }
}

function sortedScoopItems()
{
  let copy = g_scoop_items.slice();

  copy.sort(function(a, b)
  {
    let an = a.name.toLowerCase();
    let bn = b.name.toLowerCase();
    if (an < bn) return -1;
    if (an > bn) return 1;
    return 0;
  });

  return copy;
}

function itemIsArchived(item)
{
  return !!item.archived;
}

function sortedActiveScoopItems()
{
  let sorted = sortedScoopItems();
  let items = [];

  for (let i = 0; i < sorted.length; ++i)
  {
    if (!itemIsArchived(sorted[i])) items.push(sorted[i]);
  }

  return items;
}

function sortedArchivedScoopItems()
{
  let sorted = sortedScoopItems();
  let items = [];

  for (let i = 0; i < sorted.length; ++i)
  {
    if (itemIsArchived(sorted[i])) items.push(sorted[i]);
  }

  return items;
}

function itemTags(item)
{
  return Array.isArray(item.tags) ? item.tags : [];
}

function parseTagsInput(text)
{
  let parts = text.split(',');
  let seen = {};
  let out = [];

  for (let i = 0; i < parts.length; ++i)
  {
    let t = parts[i].trim();
    if (!t) continue;

    let key = t.toLowerCase();
    if (seen[key]) continue;

    seen[key] = true;
    out.push(t);
  }

  return out;
}

function distinctTagNames()
{
  let seen = {};
  let out = [];

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let item = g_scoop_items[i];
    let tags;

    if (itemIsArchived(item)) continue;

    tags = itemTags(item);
    for (let j = 0; j < tags.length; ++j)
    {
      let key = tags[j].toLowerCase();
      if (seen[key]) continue;
      seen[key] = true;
      out.push(tags[j]);
    }
  }

  out.sort(function(a, b)
  {
    return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0;
  });

  return out;
}

/* returns the text after the last comma — the tag currently being typed,
   as opposed to the full comma-separated field value. */
function currentTagFragment(value)
{
  let idx = value.lastIndexOf(',');
  return idx >= 0 ? value.slice(idx + 1).trim() : value.trim();
}

function updateTagSuggestions(el)
{
  let list = document.getElementById('tag-suggest');
  let fragment;
  let names;
  let matches;

  if (!list) return;

  fragment = currentTagFragment(el.value).toLowerCase();
  if (!fragment)
  {
    list.classList.remove('open');
    list.innerHTML = '';
    return;
  }

  names = distinctTagNames();
  matches = [];
  for (let i = 0; i < names.length; ++i)
  {
    if (names[i].toLowerCase().indexOf(fragment) >= 0) matches.push(names[i]);
  }

  if (!matches.length)
  {
    list.classList.remove('open');
    list.innerHTML = '';
    return;
  }

  list.innerHTML = matches.map(function(n)
  {
    return '<button type="button" class="tagsuggestitem" data-a="tag-suggest-pick" data-tag="' + esc(n) + '">' + esc(n) + '</button>';
  }).join('');
  list.classList.add('open');
}

function pickTagSuggestion(tag)
{
  let input = document.querySelector('[data-editdraft="tags"]');
  let list = document.getElementById('tag-suggest');
  let value;
  let idx;
  let prefix;
  let new_value;

  if (!input || !g_edit_draft) return;

  value = input.value;
  idx = value.lastIndexOf(',');
  prefix = idx >= 0 ? value.slice(0, idx + 1) + ' ' : '';
  new_value = prefix + tag + ', ';

  input.value = new_value;
  g_edit_draft.tags = new_value;

  if (list)
  {
    list.classList.remove('open');
    list.innerHTML = '';
  }

  input.focus();
}

/* an item can carry multiple tags and renders as a member under EVERY tag that
   currently has 2+ members (same underlying item, same key, at each appearance —
   not a data duplicate, just rendered more than once). a tag with only one
   current member doesn't count as a group; items with no qualifying tag render
   standalone exactly once. */
function tagsMatchActive(tags)
{

  for (let i = 0; i < tags.length; ++i)
  {
    if (g_active_tags[tags[i].toLowerCase()]) return true;
  }

  return false;
}

function scoopSearchTerm()
{
  return g_scoop_search_raw.trim().toLowerCase();
}

function itemMatchesSearch(item)
{
  let term = scoopSearchTerm();

  if (!term) return false;
  if (item.name && item.name.toLowerCase().indexOf(term) >= 0) return true;
  if (item.brand && item.brand.toLowerCase().indexOf(term) >= 0) return true;
  if (item.barcode && item.barcode.toLowerCase().indexOf(term) >= 0) return true;

  return false;
}

function itemTagsMatchSearch(item)
{
  let term = scoopSearchTerm();
  let tags;

  if (!term) return false;

  tags = itemTags(item);
  for (let i = 0; i < tags.length; ++i)
  {
    if (tags[i].toLowerCase().indexOf(term) >= 0) return true;
  }

  return false;
}

function groupMatchesSearch(group)
{
  let term = scoopSearchTerm();

  if (!term) return false;
  if (group.name && group.name.toLowerCase().indexOf(term) >= 0) return true;

  for (let i = 0; i < group.members.length; ++i)
  {
    if (itemMatchesSearch(group.members[i])) return true;
    if (itemTagsMatchSearch(group.members[i])) return true;
  }

  return false;
}

function sortedGroupMembersForDisplay(group)
{
  let members = group.members.slice();
  let has_search = scoopSearchTerm() != '';

  members.sort(function(a, b)
  {
    let a_matches = has_search && itemMatchesSearch(a);
    let b_matches = has_search && itemMatchesSearch(b);
    let a_name = a.name.toLowerCase();
    let b_name = b.name.toLowerCase();

    if (a_matches && !b_matches) return -1;
    if (!a_matches && b_matches) return 1;
    return a_name < b_name ? -1 : a_name > b_name ? 1 : 0;
  });

  return members;
}

function groupedNodes()
{
  let sorted = sortedActiveScoopItems();
  let tag_counts = {};
  let tag_display = {};
  let groups = {};
  let nodes = [];

  for (let i = 0; i < sorted.length; ++i)
  {
    let tags = itemTags(sorted[i]);
    for (let j = 0; j < tags.length; ++j)
    {
      let tag_key = tags[j].toLowerCase();
      tag_counts[tag_key] = (tag_counts[tag_key] || 0) + 1;
      if (!tag_display[tag_key]) tag_display[tag_key] = tags[j];
    }
  }

  for (let i = 0; i < sorted.length; ++i)
  {
    let item = sorted[i];
    let tags = itemTags(item);
    for (let j = 0; j < tags.length; ++j)
    {
      let tag_key = tags[j].toLowerCase();
      if (tag_counts[tag_key] < 2) continue;
      if (!groups[tag_key]) groups[tag_key] = { key:tag_key, name:tag_display[tag_key], members:[] };
      groups[tag_key].members.push(item);
    }
  }

  for (let i = 0; i < sorted.length; ++i)
  {
    let item = sorted[i];
    let tags = itemTags(item);
    let has_qualifying = false;
    for (let j = 0; j < tags.length; ++j)
    {
      if (tag_counts[tags[j].toLowerCase()] >= 2)
      {
        has_qualifying = true;
        break;
      }
    }
    if (!has_qualifying) nodes.push({ type:'item', item:item, sortname:(tagsMatchActive(tags) ? '0_' : '1_') + item.name.toLowerCase() });
  }

  for (let key in groups)
  {
    nodes.push({ type:'group', group:groups[key], sortname:(g_active_tags[key] ? '0_' : '1_') + groups[key].name.toLowerCase() });
  }

  nodes.sort(function(a, b)
  {
    let a_is_group = a.type == 'group';
    let b_is_group = b.type == 'group';
    let a_matches = a_is_group ? groupMatchesSearch(a.group) : itemMatchesSearch(a.item);
    let b_matches = b_is_group ? groupMatchesSearch(b.group) : itemMatchesSearch(b.item);
    let a_active = a_is_group ? !!g_active_tags[a.group.key] : tagsMatchActive(itemTags(a.item));
    let b_active = b_is_group ? !!g_active_tags[b.group.key] : tagsMatchActive(itemTags(b.item));
    let a_name = a_is_group ? a.group.name.toLowerCase() : a.item.name.toLowerCase();
    let b_name = b_is_group ? b.group.name.toLowerCase() : b.item.name.toLowerCase();

    if (a_matches && !b_matches) return -1;
    if (!a_matches && b_matches) return 1;
    if (a_active && !b_active) return -1;
    if (!a_active && b_active) return 1;
    if (a_is_group && !b_is_group) return -1;
    if (!a_is_group && b_is_group) return 1;
    return a_name < b_name ? -1 : a_name > b_name ? 1 : 0;
  });

  return nodes;
}

function formatVolume(item)
{
  if (item.volume_ml != null) return item.volume_ml + ' mL';
  if (item.volume_label) return item.volume_label;
  return '—';
}

function parseVolumeDraft(text)
{
  let vol_text = text.trim();
  let lower_text = vol_text.toLowerCase();
  let number_text;
  let num;

  if (!vol_text) return { volume_ml:null, volume_label:null };

  if (/^[0-9]+(\.[0-9]+)?$/.test(vol_text))
  {
    num = parseFloat(vol_text);
    return { volume_ml:num, volume_label:null };
  }

  if (/^[0-9]+(\.[0-9]+)?[ ]*ml$/.test(lower_text))
  {
    number_text = lower_text.replace('ml', '').trim();
    num = parseFloat(number_text);
    return { volume_ml:num, volume_label:null };
  }

  return { volume_ml:null, volume_label:vol_text.toUpperCase() };
}

function round1(n)
{
  return Math.round(n*10)/10;
}

/* old format: g_log[date] = { item_key: count }. new format: g_log[date] = [entry, ...].
   converts in place; safe to call repeatedly (already-migrated days are arrays and skipped). */
/* old format: item.group = string|null. new format: item.tags = [string, ...].
   safe to call repeatedly — already-migrated items (tags is an array) are skipped. */
function migrateTagsFormat()
{
  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let item = g_scoop_items[i];
    if (Array.isArray(item.tags)) continue;

    item.tags = item.group ? [item.group] : [];
    delete item.group;
  }
}

function migrateLogFormat()
{
  for (let date in g_log)
  {
    let day = g_log[date];
    if (Array.isArray(day)) continue;

    let entries = [];
    for (let key in day)
    {
      let item = findScoopItem(key);
      let count = day[key];
      for (let i = 0; i < count; ++i)
      {
        entries.push({
          id: uid(), item_key: key, scale: 1,
          grams: item ? item.scoop_g : null,
          protein_g: item ? item.protein_g : null,
          kcal: item ? item.kcal : null
        });
      }
    }
    g_log[date] = entries;
  }
}

let g_adjusted_log_open = false;
let g_logged_foods_open = true;
let g_logged_food_details_open = false;
let g_mass_entry_draft = null;  /* { event_type, timestamp, body_mass_raw } while adding a checkpoint */
let g_mass_edit_id = null;
let g_mass_edit_draft = null;   /* { timestamp, event_type, body_mass_raw, water_volume_raw } while editing */
let g_sync_failed = false;
let g_sync_status = '';
let g_unsynced_changes = false;
let g_sync_in_flight = false;
let g_local_revision = 0;
let g_sync_retry_timer = null;
let custom_kcal_ratio_fallback = 23;
let custom_kcal_ratio_rho = 0.85;
let g_default_water_ml = 740;
let g_water_slider_ml = g_default_water_ml;
let g_water_slider_raw = String(g_default_water_ml);
let g_water_slider_min_ml = 100;
let g_water_slider_max_ml = 1000;
let g_water_slider_step_ml = 10;
let g_meal_pair_max_minutes = 240;

function proteinPerGram(food)
{
  if (food.kind == 'unit') return food.unit_protein/food.unit_grams;
  return food.package_protein/food.package_grams;
}

function dailyProtein(food)
{
  if (food.kind == 'unit') return food.daily*food.unit_protein;
  return food.daily*proteinPerGram(food);
}

function weeklyAmount(food)
{
  return food.daily*7;
}

function packagesPerWeek(food)
{
  if (food.kind == 'unit') return food.package_units != null ? weeklyAmount(food)/food.package_units : null;
  return weeklyAmount(food)/food.package_grams;
}

function monthlyCost(food)
{
  if (food.price == null) return null;
  if (food.kind == 'unit') return food.package_units != null ? (food.daily*30/food.package_units)*food.price : food.daily*30*food.price;
  return (food.daily*30/food.package_grams)*food.price;
}

function totalDailyProtein()
{
  let total = 0;

  for (let i = 0; i < g_foods.length; ++i)
  {
    total += dailyProtein(g_foods[i]);
  }

  return total;
}

function totalMonthlyCost()
{
  let total = 0;
  let cost;

  for (let i = 0; i < g_foods.length; ++i)
  {
    cost = monthlyCost(g_foods[i]);
    if (cost != null) total += cost;
  }

  return total;
}

function findScoopItem(key)
{

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    if (g_scoop_items[i].key == key) return g_scoop_items[i];
  }

  return null;
}

function logCount(date, key)
{
  let day = g_log[date];
  let n = 0;

  if (!day) return 0;

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].item_key == key) ++n;
  }

  return n;
}

function viewDateIsEditable()
{
  return g_admin_mode || g_view_date == todayISO();
}

function adminBannerHTML()
{
  if (!g_admin_mode) return '';
  return `<div class="admin-banner">ADMIN MODE · editing ${esc(g_view_date)}</div>`;
}

function addScoop(key)
{
  let item = findScoopItem(key);
  if (!item) return;

  pushLogEntry(key, item.scoop_g, item.protein_g, item.kcal, 1);
}

function pushLogEntry(key, grams, protein_g, kcal, scale)
{
  let day = g_log[g_view_date];

  if (!day)
  {
    day = [];
    g_log[g_view_date] = day;
  }

  day.push({ id:uid(), item_key:key, grams:grams, protein_g:protein_g, kcal:kcal, scale:scale });
}

function removeScoop(key)
{
  let day = g_log[g_view_date];

  if (!day) return;

  for (let i = day.length - 1; i >= 0; --i)
  {
    if (day[i].item_key == key)
    {
      markDeletedLogEntry(day[i]);
      day.splice(i, 1);
      return;
    }
  }
}

function logCustomEntry()
{
  let protein_num;
  let kcal_num;

  if (!viewDateIsEditable()) return;

  protein_num = parseFloat(g_custom_protein_raw);
  if (isNaN(protein_num) || protein_num < 0)
  {
    g_custom_status = 'enter a protein amount first';
    render();
    return;
  }

  kcal_num = parseFloat(g_custom_kcal_raw);
  protein_num = round1(protein_num);
  if (isNaN(kcal_num)) kcal_num = customKcalEstimate(protein_num);

  pushLogEntry('custom', null, protein_num, Math.round(kcal_num), null);
  g_custom_protein_raw = '';
  g_custom_kcal_raw = '';
  g_custom_status = '';
  render();
  save();
}

function removeLogEntry(entry_id)
{
  let day = g_log[g_view_date];

  if (!day) return;

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].id == entry_id)
    {
      markDeletedLogEntry(day[i]);
      day.splice(i, 1);
      return;
    }
  }
}

function entriesForItem(date, key)
{
  let day = g_log[date] || [];
  let out = [];

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].item_key == key) out.push(day[i]);
  }

  return out;
}

function dayTotals(date)
{
  let day = g_log[date];
  let protein = 0;
  let kcal = 0;

  if (!day) return { protein:0, kcal:0 };

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].protein_g != null) protein += day[i].protein_g;
    if (day[i].kcal != null) kcal += day[i].kcal;
  }

  return { protein:protein, kcal:kcal };
}

function pad2(n)
{
  return String(n).padStart(2, '0');
}

function currentTimeText()
{
  let d = new Date();
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

function massTimestampForView(time_text)
{
  let t = String(time_text || '').trim();
  if (!/^[0-9][0-9]:[0-9][0-9]$/.test(t)) t = currentTimeText();
  return g_view_date + 'T' + t;
}

function massEventTimeText(event)
{
  if (!event || !event.timestamp) return '';
  if (event.timestamp.length >= 16 && event.timestamp.charAt(10) == 'T') return event.timestamp.slice(11, 16);
  return String(event.timestamp).slice(0, 5);
}

function massEventTimestampValue(event)
{
  if (!event || !event.timestamp) return g_view_date + 'T00:00';
  if (event.timestamp.indexOf('T') >= 0) return event.timestamp.slice(0, 16);
  return g_view_date + 'T' + massEventTimeText(event);
}

function massEventMillis(event)
{
  let d = new Date(massEventTimestampValue(event));
  let t = d.getTime();
  return isNaN(t) ? 0 : t;
}

function massEventsForDate(date)
{
  let day = g_mass_events[date];
  return Array.isArray(day) ? day : [];
}

function sortedMassEvents(date)
{
  let source = massEventsForDate(date);
  let day = [];

  for (let i = 0; i < source.length; ++i)
  {
    day.push({ event:source[i], index:i });
  }

  day.sort(function(a, b)
  {
    let at = massEventTimestampValue(a.event);
    let bt = massEventTimestampValue(b.event);
    if (at < bt) return -1;
    if (at > bt) return 1;
    return a.index - b.index;
  });

  for (let i = 0; i < day.length; ++i)
  {
    day[i] = day[i].event;
  }

  return day;
}

function isMassCheckpoint(event)
{
  return event && (event.event_type == 'checkpoint_weight' || event.event_type == 'pre_meal_weight' || event.event_type == 'post_meal_weight' || event.event_type == 'post_restroom_weight');
}

function massEventBodyMass(event)
{
  if (!isMassCheckpoint(event)) return null;
  if (event.body_mass_kg == null) return null;
  let n = Number(event.body_mass_kg);
  return isNaN(n) ? null : n;
}

function massEventCountsAsWaterLoss(event)
{
  return event && event.event_type == 'post_restroom_weight' && event.water_loss !== false;
}

function waterEventMassKg(event)
{
  if (!event || event.event_type != 'water') return 0;
  if (event.mass_in_kg != null) return Number(event.mass_in_kg) || 0;
  return (Number(event.water_volume_ml) || 0)/1000;
}

function latestMassCheckpoint(date)
{
  let events = sortedMassEvents(date);
  let latest = null;

  for (let i = 0; i < events.length; ++i)
  {
    if (massEventBodyMass(events[i]) != null) latest = events[i];
  }

  return latest;
}

function defaultMassEntryRaw()
{
  let checkpoint = latestMassCheckpoint(g_view_date);
  let mass = checkpoint ? massEventBodyMass(checkpoint) : bodyweightForDate(g_view_date);
  return mass != null ? fmt2(mass) : '';
}

function massEventLabel(event_type)
{
  switch (event_type)
  {
    case 'water': return 'Water';
    case 'checkpoint_weight': return 'Checkpoint';
    case 'pre_meal_weight': return 'Pre mass';
    case 'post_meal_weight': return 'Post mass';
    case 'post_restroom_weight': return 'Post latrine';
  }

  return event_type || 'Event';
}

function markDeletedMassEvent(event)
{
  if (event && event.id) g_deleted_mass_event_ids[event.id] = true;
}

function addMassWater(volume_ml)
{
  let day;
  let ml = Math.round(Number(volume_ml) || 0);

  if (!viewDateIsEditable() || ml <= 0) return;

  day = g_mass_events[g_view_date];
  if (!day)
  {
    day = [];
    g_mass_events[g_view_date] = day;
  }

  day.push({
    id:uid(),
    timestamp:massTimestampForView(currentTimeText()),
    event_type:'water',
    water_volume_ml:ml,
    mass_in_kg:ml/1000
  });

  render();
  save();
}

function parseWaterSliderText()
{
  let ml = Math.round(parseFloat(g_water_slider_raw));

  if (isNaN(ml) || ml <= 0) return null;
  return ml;
}

function syncWaterSliderToValue(ml)
{
  let slider = document.getElementById('mass-water-slider');

  if (ml == null) return;
  if (ml < g_water_slider_min_ml || ml > g_water_slider_max_ml) return;
  if (slider) slider.value = ml;
  g_water_slider_ml = ml;
}

function openMassEntryDraft(event_type)
{
  if (!viewDateIsEditable()) return;

  g_mass_entry_draft = {
    event_type:event_type,
    timestamp:currentTimeText(),
    body_mass_raw:defaultMassEntryRaw(),
    water_loss:event_type == 'post_restroom_weight',
    anchor_reset:false
  };

  render();
  setTimeout(function()
  {
    let input = document.querySelector('[data-massdraft="body_mass"]');
    if (!input) return;
    input.focus();
    input.select();
  }, 0);
}

function cancelMassEntryDraft()
{
  g_mass_entry_draft = null;
  render();
}

function saveMassEntryDraft()
{
  let d = g_mass_entry_draft;
  let day;
  let mass;

  if (!d || !viewDateIsEditable()) return;

  mass = parseFloat(d.body_mass_raw);
  if (isNaN(mass) || mass <= 0) return;

  day = g_mass_events[g_view_date];
  if (!day)
  {
    day = [];
    g_mass_events[g_view_date] = day;
  }

  let event = {
    id:uid(),
    timestamp:massTimestampForView(d.timestamp),
    event_type:d.event_type,
    body_mass_kg:Math.round(mass*100)/100
  };

  if (d.event_type == 'post_restroom_weight') event.water_loss = !!d.water_loss;
  if (d.event_type == 'post_meal_weight') event.anchor_reset = !!d.anchor_reset;

  day.push(event);

  g_mass_entry_draft = null;
  render();
  save();
}

function findMassEvent(date, event_id)
{
  let day = massEventsForDate(date);

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].id == event_id) return day[i];
  }

  return null;
}

function openMassEventEdit(event_id)
{
  let event = findMassEvent(g_view_date, event_id);

  if (!event || !viewDateIsEditable()) return;

  g_mass_edit_id = event_id;
  g_mass_edit_draft = {
    timestamp:massEventTimeText(event),
    event_type:event.event_type,
    body_mass_raw:event.body_mass_kg != null ? fmt2(Number(event.body_mass_kg)) : '',
    water_volume_raw:event.water_volume_ml != null ? String(Math.round(Number(event.water_volume_ml))) : '',
    water_loss:massEventCountsAsWaterLoss(event),
    anchor_reset:!!event.anchor_reset
  };

  render();
}

function cancelMassEventEdit()
{
  g_mass_edit_id = null;
  g_mass_edit_draft = null;
  render();
}

function saveMassEventEdit()
{
  let event = findMassEvent(g_view_date, g_mass_edit_id);
  let d = g_mass_edit_draft;
  let num;

  if (!event || !d || !viewDateIsEditable()) return;

  event.timestamp = massTimestampForView(d.timestamp);

  if (event.event_type == 'water')
  {
    num = Math.round(parseFloat(d.water_volume_raw));
    if (isNaN(num) || num <= 0) return;

    event.water_volume_ml = num;
    event.mass_in_kg = num/1000;
  }
  else
  {
    num = parseFloat(d.body_mass_raw);
    if (isNaN(num) || num <= 0) return;

    event.body_mass_kg = Math.round(num*100)/100;
    if (event.event_type == 'post_restroom_weight') event.water_loss = !!d.water_loss;
    if (event.event_type == 'post_meal_weight') event.anchor_reset = !!d.anchor_reset;
  }

  g_mass_edit_id = null;
  g_mass_edit_draft = null;
  render();
  save();
}

function deleteMassEvent(event_id)
{
  let day = massEventsForDate(g_view_date);

  if (!viewDateIsEditable()) return;

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].id == event_id)
    {
      markDeletedMassEvent(day[i]);
      day.splice(i, 1);
      if (g_mass_edit_id == event_id) cancelMassEventEdit();
      render();
      save();
      return;
    }
  }
}

function loggedWaterMassBetween(events, start_event, end_event)
{
  let start_time = massEventTimestampValue(start_event);
  let end_time = massEventTimestampValue(end_event);
  let total = 0;

  for (let i = 0; i < events.length; ++i)
  {
    let event = events[i];
    let t = massEventTimestampValue(event);

    if (t <= start_time || t > end_time) continue;
    if (event.event_type == 'water') total += waterEventMassKg(event);
  }

  return total;
}

function computeMassLedger(date)
{
  let events = sortedMassEvents(date);
  let event_info = {};
  let unmatched_pres = [];
  let checkpoints = [];
  let totals = {
    water_mass_in_kg:0,
    water_in_ml:0,
    net_bracket_mass_in_kg:0,
    total_mass_in_kg:0,
    inferred_mass_out_kg:0,
    assumed_water_loss_kg:0,
    first_mass_kg:null,
    latest_mass_kg:null,
    min_mass_kg:1000,
    mass_change_kg:null,
    checkpoint_count:0
  };

  for (let i = 0; i < events.length; ++i)
  {
    let event = events[i];
    let info = { mass_in_kg:0, net_bracket_mass_kg:null, mass_out_kg:null, pair_id:null, unpaired:false, unresolved:false, anchor_reset:false };
    let body_mass = massEventBodyMass(event);

    if (event.event_type == 'water')
    {
      info.mass_in_kg = waterEventMassKg(event);
      totals.water_mass_in_kg += info.mass_in_kg;
      totals.water_in_ml += Number(event.water_volume_ml) || Math.round(info.mass_in_kg*1000);
    }
    else if (event.event_type == 'pre_meal_weight' && body_mass != null)
    {
      unmatched_pres.push(event);
    }
    else if (event.event_type == 'post_meal_weight' && body_mass != null)
    {
      let best_index = -1;

      if (event.anchor_reset)
      {
        info.anchor_reset = true;
        if (unmatched_pres.length) unmatched_pres.splice(0, unmatched_pres.length);
      }
      else
      {
        for (let j = unmatched_pres.length - 1; j >= 0; --j)
        {
          let pre = unmatched_pres[j];
          let pre_mass = massEventBodyMass(pre);
          let gap_minutes = (massEventMillis(event) - massEventMillis(pre))/60000;

          if (gap_minutes < 0) continue;
          if (gap_minutes > g_meal_pair_max_minutes) continue;

          best_index = j;
          break;
        }

        if (best_index >= 0)
        {
          let pre = unmatched_pres[best_index];
          let logged_water_mass = loggedWaterMassBetween(events, pre, event);
          let net_bracket_mass = body_mass - massEventBodyMass(pre) - logged_water_mass;

          unmatched_pres.splice(best_index, 1);
          info.pair_id = pre.id;
          info.net_bracket_mass_kg = net_bracket_mass;
          info.mass_in_kg = net_bracket_mass;
          totals.net_bracket_mass_in_kg += net_bracket_mass;
        }
        else
        {
          info.unpaired = true;
        }
      }
    }

    if (body_mass != null)
    {
      checkpoints.push({ event:event, mass_kg:body_mass });
      ++totals.checkpoint_count;
      if (totals.first_mass_kg == null) { totals.first_mass_kg = body_mass; }
      totals.latest_mass_kg = body_mass;
      if (body_mass < totals.min_mass_kg) { totals.min_mass_kg = body_mass; }
    }

    event_info[event.id] = info;
  }

  for (let i = 1; i < checkpoints.length; ++i)
  {
    let prev = checkpoints[i - 1];
    let cur = checkpoints[i];
    let mass_in = 0;
    let prev_time = massEventTimestampValue(prev.event);
    let cur_time = massEventTimestampValue(cur.event);
    let cur_info = event_info[cur.event.id];

    if (cur_info && cur.event.event_type == 'post_meal_weight' && (cur_info.unpaired || cur_info.anchor_reset))
    {
      cur_info.unresolved = true;
      continue;
    }

    for (let j = 0; j < events.length; ++j)
    {
      let event = events[j];
      let t = massEventTimestampValue(event);

      if (t <= prev_time || t > cur_time) continue;
      if (event_info[event.id]) mass_in += event_info[event.id].mass_in_kg;
    }

    cur_info.mass_out_kg = prev.mass_kg + mass_in - cur.mass_kg;
    totals.inferred_mass_out_kg += cur_info.mass_out_kg;
    if (massEventCountsAsWaterLoss(cur.event)) totals.assumed_water_loss_kg += cur_info.mass_out_kg;
  }

  totals.total_mass_in_kg = totals.water_mass_in_kg + totals.net_bracket_mass_in_kg;
  if (totals.first_mass_kg != null && totals.latest_mass_kg != null) totals.mass_change_kg = totals.latest_mass_kg - totals.first_mass_kg;

  return { events:events, event_info:event_info, totals:totals };
}

function formatMassKg(kg, signed)
{
  let sign = '';
  let abs;

  if (kg == null) return '—';
  if (signed && kg > 0.0005) sign = '+';
  if (kg < -0.0005) sign = '-';

  abs = Math.abs(kg);
  if (abs < 1) return sign + Math.round(abs*1000) + ' g';
  return sign + fmt2(abs) + ' kg';
}

function formatMassKgPlain(kg)
{
  if (kg == null) return '—';
  return fmt2(kg) + ' kg';
}

function massSummaryForDate(date)
{
  let ledger = computeMassLedger(date);
  let t = ledger.totals;

  return {
    date:date,
    water_in_ml:t.water_in_ml,
    water_in_kg:t.water_mass_in_kg,
    net_bracket_mass_in_g:Math.round(t.net_bracket_mass_in_kg*1000),
    total_mass_in_g:Math.round(t.total_mass_in_kg*1000),
    inferred_mass_out_g:Math.round(t.inferred_mass_out_kg*1000),
    assumed_water_loss_kg:t.assumed_water_loss_kg,
    first_mass_kg:t.first_mass_kg,
    last_mass_kg:t.latest_mass_kg,
    min_mass_kg:t.min_mass_kg,
    mass_change_kg:t.mass_change_kg,
    checkpoint_count:t.checkpoint_count
  };
}

function sortedLogDatesBeforeToday()
{
  let today = todayISO();
  let dates = [];

  for (let date in g_log)
  {
    if (date < today) dates.push(date);
  }

  dates.sort();
  return dates;
}

function customKcalRatio()
{
  let dates = sortedLogDatesBeforeToday();
  let ratio = custom_kcal_ratio_fallback;

  for (let i = 0; i < dates.length; ++i)
  {
    let totals = dayTotals(dates[i]);
    if (totals.protein <= 0 || totals.kcal <= 0) continue;

    let day_ratio = totals.kcal/totals.protein;
    ratio = custom_kcal_ratio_rho*ratio + (1 - custom_kcal_ratio_rho)*day_ratio;
  }

  return ratio;
}

function customKcalEstimate(protein_g)
{
  let ratio = customKcalRatio();
  return Math.round(ratio*protein_g);
}

function loggedValueDiffers(actual, expected, tolerance)
{
  if (actual == null && expected == null) return false;
  if (actual == null || expected == null) return true;
  return Math.abs(actual - expected) > tolerance;
}

function expectedEntryScale(entry, item)
{
  if (entry.grams != null && item.scoop_g > 0) return entry.grams/item.scoop_g;
  if (entry.scale != null) return entry.scale;
  return 1;
}

function adjustedLogEntries(date)
{
  let day = g_log[date] || [];
  let out = [];

  for (let i = 0; i < day.length; ++i)
  {
    let entry = day[i];
    if (entry.item_key == 'custom')
    {
      out.push({ entry:entry, item:null, custom:true, expected_protein:null, expected_kcal:null });
      continue;
    }

    let item = findScoopItem(entry.item_key);
    if (!item) continue;

    let scale = expectedEntryScale(entry, item);
    let expected_protein = item.protein_g != null ? round1(item.protein_g*scale) : null;
    let expected_kcal = item.kcal != null ? Math.round(item.kcal*scale) : null;

    if (loggedValueDiffers(entry.protein_g, expected_protein, 0.05) || loggedValueDiffers(entry.kcal, expected_kcal, 0.5))
    {
      out.push({ entry:entry, item:item, custom:false, expected_protein:expected_protein, expected_kcal:expected_kcal });
    }
  }

  return out;
}

function adjustedEntryLabel(info)
{
  if (info.custom) return 'Custom';
  return info.item.name;
}

function valueOrDash(val)
{
  return val != null ? val.toFixed(0) : '—';
}

function adjustedEntryDetail(info)
{
  let entry = info.entry;
  let detail = '';

  let template_p = '';
  let template_k = '';
  if (!info.custom)
  {
    template_p = `<s>${valueOrDash(info.expected_protein)} </s>`;
    template_k = `<s>${valueOrDash(info.expected_kcal)} </s>`;
  }

  detail += template_p + valueOrDash(entry.protein_g) + ' g protein';
  detail += ' / ';
  detail += template_k + valueOrDash(entry.kcal) + ' kcal';

  return detail;
}

function loggedEntryLabel(entry)
{
  let item;

  if (entry.item_key == 'custom') return 'Custom';

  item = findScoopItem(entry.item_key);
  if (item) return item.name;

  return entry.item_key;
}

function diaryEntryLabel(entry)
{
  let item;
  let note;

  if (entry.item_key == 'custom')
  {
    note = (entry.note || '').trim();
    return note ? '* ' + note : 'Custom';
  }

  item = findScoopItem(entry.item_key);
  if (item) return item.name;

  return entry.item_key;
}

function loggedEntryDetail(entry)
{
  let detail = '';

  if (entry.protein_g != null)
  {
    let value = fmt0(entry.protein_g).padStart(3);
    detail += `<span class="logged-food-protein">${value}</span>`;
  }

  if (entry.kcal != null)
  {
    let value = (fmt_1(entry.kcal)).padStart(6);
    detail += `<span class="logged-food-kcal">${value}</span>`;
  }
  detail = detail.padEnd(6);

  if (entry.protein_g)
  {
    let value = `(${fmt1(entry.kcal/entry.protein_g).padStart(4)}/g)`.padStart(10);
    detail += `<span class="logged-food-grams">${value}</span>`;
  }

  return detail || 'logged';
}

function draftMacroMode(d)
{
  return d && d.macro_mode == 'serving' ? 'serving' : '100g';
}

function numberOrNull(text)
{
  let num = parseFloat(text);
  return isNaN(num) ? null : num;
}

function macroFieldsFromDraft(d)
{
  let mode = draftMacroMode(d);
  let scoop_g = numberOrNull(d.scoop_g);
  let protein_value = numberOrNull(d.macro_protein);
  let kcal_value = numberOrNull(d.macro_kcal);
  let protein_100g = null;
  let kcal_100g = null;
  let protein_g = null;
  let kcal = null;
  let macros;

  if (mode == 'serving')
  {
    protein_g = protein_value;
    kcal = kcal_value;

    if (scoop_g != null && scoop_g > 0)
    {
      if (protein_g != null) protein_100g = protein_g/scoop_g*100;
      if (kcal != null) kcal_100g = kcal/scoop_g*100;
    }
  }
  else
  {
    protein_100g = protein_value;
    kcal_100g = kcal_value;
    if (scoop_g != null)
    {
      macros = computeMacrosFromDensity(scoop_g, protein_100g, kcal_100g);
      protein_g = macros.protein_g;
      kcal = macros.kcal;
    }
  }

  return {
    scoop_g:scoop_g,
    protein_100g:protein_100g,
    kcal_100g:kcal_100g,
    protein_g:protein_g,
    kcal:kcal
  };
}

function setDraftMacrosFromDensity(d, protein_100g, kcal_100g)
{
  d.macro_mode = '100g';
  d.macro_protein = protein_100g != null ? String(protein_100g) : '';
  d.macro_kcal = kcal_100g != null ? String(kcal_100g) : '';
}

function setEditDraftMacrosFromItem(d, item)
{
  if (item.protein_g != null || item.kcal != null)
  {
    d.macro_mode = 'serving';
    d.macro_protein = item.protein_g != null ? String(item.protein_g) : '';
    d.macro_kcal = item.kcal != null ? String(item.kcal) : '';
    return;
  }

  d.macro_mode = '100g';
  d.macro_protein = item.protein_100g != null ? String(item.protein_100g) : '';
  d.macro_kcal = item.kcal_100g != null ? String(item.kcal_100g) : '';
}

function switchDraftMacroMode(d, new_mode)
{
  let fields;

  if (!d) return;
  if (new_mode != 'serving') new_mode = '100g';
  if (draftMacroMode(d) == new_mode) return;

  fields = macroFieldsFromDraft(d);
  d.macro_mode = new_mode;

  if (new_mode == 'serving')
  {
    d.macro_protein = fields.protein_g != null ? String(fields.protein_g) : '';
    d.macro_kcal = fields.kcal != null ? String(fields.kcal) : '';
    return;
  }

  d.macro_protein = fields.protein_100g != null ? String(round1(fields.protein_100g)) : '';
  d.macro_kcal = fields.kcal_100g != null ? String(Math.round(fields.kcal_100g)) : '';
}

function renderMacroModeControl(kind, mode)
{
  let h = '';
  let hundred_on = mode == '100g' ? ' on' : '';
  let serving_on = mode == 'serving' ? ' on' : '';

  h += `<span class="macromode">
    <span class="macromodelabel">nutrition for</span>
    <button class="macromodebtn${hundred_on}" data-a="${kind}-macro-mode" data-mode="100g" type="button">100g</button>
    <button class="macromodebtn${serving_on}" data-a="${kind}-macro-mode" data-mode="serving" type="button">serving</button>
  </span>`;

  return h;
}

function saveAddItemDraft()
{
  let d = g_scoop_add_draft;
  let fields;

  if (!d) return;
  if (!d.name.trim()) return;

  fields = macroFieldsFromDraft(d);

  let item = {
    key: uid(),
    barcode: d.barcode.trim() ? d.barcode.trim() : null,
    name: d.name.trim(),
    brand: d.brand.trim(),
    scoop_g: fields.scoop_g,
    protein_g: fields.protein_g,
    kcal: fields.kcal,
    protein_100g: fields.protein_100g,
    kcal_100g: fields.kcal_100g,
    tags: []
  };
  item.scoop_g_raw = item.scoop_g != null ? String(item.scoop_g) : '';
  item.protein_g_raw = item.protein_g != null ? String(item.protein_g) : '';
  item.kcal_raw = item.kcal != null ? String(item.kcal) : '';

  g_scoop_items.push(item);
  g_scoop_add_draft = null;
  render();
  save();
}

function addItemMacroPreviewText(d)
{
  let fields = macroFieldsFromDraft(d);
  let mode = draftMacroMode(d);

  if (fields.protein_g == null && fields.kcal == null) return 'enter at least one nutrition value';
  if (mode == '100g' && fields.scoop_g == null) return 'enter scoop g to preview this serving';

  return 'serving: ' + (fields.protein_g != null ? fields.protein_g + ' g protein' : '— g protein')
    + ' / ' + (fields.kcal != null ? fields.kcal + ' kcal' : '— kcal');
}

function lookupOFFForAddItem()
{
  let d = g_scoop_add_draft;
  let barcode;

  if (!d) return;

  barcode = d.barcode.trim();
  if (!barcode)
  {
    g_add_item_status = 'enter a barcode first';
    render();
    return;
  }

  g_add_item_status = 'looking up… (may take longer if O.F.F. is unreachable and it falls back to a web search)';
  render();

  fetchOFFProduct(barcode, function(result)
  {
    if (!g_scoop_add_draft) return; // form was closed while the fetch was in flight

    if (!result.found)
    {
      g_add_item_status = result.reason;
      render();
      return;
    }

    if (!g_scoop_add_draft.name.trim() && result.name) g_scoop_add_draft.name = result.name;
    if (!g_scoop_add_draft.brand.trim() && result.brand) g_scoop_add_draft.brand = result.brand;
    setDraftMacrosFromDensity(g_scoop_add_draft, result.protein_100g, result.kcal_100g);

    g_add_item_status = formatOFFMatchStatus(result);
    render();
  });
}

function openScoopEdit(key, context)
{

  g_edit_item_key = key;
  g_edit_context = context || 'standalone';
  g_edit_draft = {
    name: item.name,
    brand: item.brand || '',
    barcode: item.barcode || '',

    scoop_g: item.scoop_g != null ? String(item.scoop_g) : '',

    macro_protein: '',
    macro_kcal: '',
    tags: itemTags(item).join(', '),
    archived: itemIsArchived(item)

}

function cancelScoopEdit()
{

function saveScoopEdit()
{
  let item = findScoopItem(g_edit_item_key);
  let d = g_edit_draft;
  let fields;
  let volume;

  if (!item || !d) return;
  if (!d.name.trim()) return;

  item.name = d.name.trim();
  item.brand = d.brand.trim();
  item.barcode = d.barcode.trim() ? d.barcode.trim() : null;
  item.tags = parseTagsInput(d.tags);
  item.archived = !!d.archived;

  fields = macroFieldsFromDraft(d);
  item.scoop_g = fields.scoop_g;
  item.protein_g = fields.protein_g;
  item.kcal = fields.kcal;
  item.protein_100g = fields.protein_100g;
  item.kcal_100g = fields.kcal_100g;

  volume = parseVolumeDraft(d.volume);
  item.volume_ml = volume.volume_ml;
  item.volume_label = volume.volume_label;

  g_edit_item_key = null;
  g_edit_context = null;
  g_edit_draft = null;
  render();
  save();
}

  g_scale_draft = null;

function resetScaleDraft()
{
  let item = findScoopItem(g_scale_item_key);
  if (!item) return;

  g_scale_draft = {
    scale: 1,
    grams_raw: item.scoop_g != null ? String(item.scoop_g) : '0',
    protein_g: item.protein_g,
    protein_g_raw: item.protein_g != null ? String(item.protein_g) : '',
    kcal: item.kcal,
    kcal_raw: item.kcal != null ? String(item.kcal) : ''
  };
}

/* source: 'scale' (slider moved) or 'grams' (typed directly). either way, cascades
   to protein/kcal via the item's base per-gram density. protein/kcal fields are
   still independently editable afterward — typing into them does not call this. */
/* pure DOM write, no render() — called on every 'input' tick while dragging the
   slider, so numbers update live without rebuilding the DOM (which would break
   the drag gesture on the range input). does not touch g_scale_draft; the real
   commit happens once on 'change' via recomputeScaleDraft. */
function liveScalePreview(new_scale)
{
  let item = findScoopItem(g_scale_item_key);
  let base_scoop;
  let new_grams;
  let label_el;
  let vol_el;
  let grams_el;
  let protein_el;
  let kcal_el;
  let vol_text;

  if (!item) return;

  base_scoop = item.scoop_g || 0;
  new_grams = round1(base_scoop*new_scale);

  label_el = document.getElementById('scale-label');
  if (label_el) label_el.textContent = new_scale.toFixed(2) + '× → ' + new_grams + ' g';

  vol_el = document.getElementById('scale-volume-preview');
  if (vol_el)
  {
    vol_text = item.volume_ml != null ? round1(item.volume_ml*new_scale) + ' mL' : formatVolume(item);
    vol_el.textContent = vol_text;
  }

  grams_el = document.querySelector('[data-scaledraft="grams"]');
  if (grams_el) grams_el.value = new_grams;

  if (base_scoop > 0)
  {
    protein_el = document.querySelector('[data-scaledraft="protein_g"]');
    if (protein_el && item.protein_g != null) protein_el.value = round1(item.protein_g/base_scoop*new_grams);

    kcal_el = document.querySelector('[data-scaledraft="kcal"]');
    if (kcal_el && item.kcal != null) kcal_el.value = Math.round(item.kcal/base_scoop*new_grams);
  }
}

function recomputeScaleDraft(source)
{
  let item = findScoopItem(g_scale_item_key);
  let d = g_scale_draft;
  let base_scoop;
  let new_grams;
  let new_scale;
  let num;

  if (!item || !d) return;

  base_scoop = item.scoop_g || 0;

  if (source == 'scale')
  {
    new_scale = d.scale;
    new_grams = base_scoop*new_scale;
  }
  else
  {
    num = parseFloat(d.grams_raw);
    new_grams = isNaN(num) ? base_scoop : num;
    new_scale = base_scoop > 0 ? new_grams/base_scoop : 1;
  }

  d.scale = new_scale;
  d.grams_raw = String(round1(new_grams));

  if (item.protein_g != null && base_scoop > 0)
  {
    d.protein_g = round1(item.protein_g/base_scoop*new_grams);
    d.protein_g_raw = String(d.protein_g);
  }

  if (item.kcal != null && base_scoop > 0)
  {
    d.kcal = Math.round(item.kcal/base_scoop*new_grams);
    d.kcal_raw = String(d.kcal);
  }
}

function logScaledEntry()
{
  let item = findScoopItem(g_scale_item_key);

  resetScaleDraft();
  render();
  save();
}

/* OFF pre-population — manual, per-row, never automatic (tool must work offline).
   Note: browsers treat User-Agent as a restricted fetch header and may silently
   drop it regardless of what's set here — there's no way to guarantee OFF's
   requested identification from pure client-side JS without a backend. */
function requestFetchOFF(key, context, barcode)
{
  let item = findScoopItem(key);
  let lookup_barcode = barcode != null ? String(barcode).trim() : '';
  let has_existing;

  if (!item) return;
  if (!lookup_barcode && item.barcode) lookup_barcode = item.barcode;
  if (!lookup_barcode) return;

  g_fetch_context[key] = context || 'standalone';
  g_fetch_barcode[key] = lookup_barcode;

  has_existing = item.protein_g != null || item.kcal != null;
  if (has_existing && !g_fetch_pending[key])
  {
    g_fetch_pending[key] = true;
    g_fetch_status[key] = 'already has values — "confirm overwrite" replaces them with O.F.F. data, or "cancel" to keep what\'s here.';
    render();
    return;
  }

  g_fetch_pending[key] = false;
  doFetchOFF(key);
}

function cancelFetchOFF(key)
{
  g_fetch_pending[key] = false;
  g_fetch_status[key] = null;
  g_fetch_barcode[key] = null;
  render();
}

/* shared calculator: given a scoop mass and per-100g density, compute the
   macros for that specific mass. used at add-time, at edit-time when scoop_g
   changes, and (implicitly) by the scale panel's own density-based cascade. */
function computeMacrosFromDensity(scoop_g, protein_100g, kcal_100g)
{
  let scale = (scoop_g || 0)/100;

  return {
    protein_g: protein_100g != null ? round1(protein_100g*scale) : null,
    kcal: kcal_100g != null ? Math.round(kcal_100g*scale) : null
  };
}

/* recomputes an item's protein_g/kcal (and raw mirrors) from its own stored
   density fields and current scoop_g. no-op if density isn't known. */
function recomputeItemMacrosFromDensity(item)
{
  let result;

  if (item.protein_100g == null && item.kcal_100g == null) return;

  result = computeMacrosFromDensity(item.scoop_g, item.protein_100g, item.kcal_100g);

  if (result.protein_g != null)
  {
    item.protein_g = result.protein_g;
    item.protein_g_raw = String(item.protein_g);
  }
  if (result.kcal != null)
  {
    item.kcal = result.kcal;
    item.kcal_raw = String(item.kcal);
  }
}

/* low-level OFF lookup, callback-style to match the rest of this file's .then()
   chains. calls onResult with either { found:true, name, brand, protein_100g,
   kcal_100g } or { found:false, reason }. never throws — network/parse errors
   are reported through onResult instead. */
function fetchOFFProduct(barcode, onResult)
{
  let url = 'https://world.openfoodfacts.org/api/v2/product/' + barcode + '.json';

  try
  {
    fetch(url, { headers: { 'User-Agent':'protein-loadout-tracker/1.0 (personal local tool)' } }).then(function(resp)
    {
      return resp.json();
    }).then(function(data)
    {
      let nutriments;

      if (!data || data.status == 0 || !data.product)
      {
        /* genuinely not on O.F.F. — try the broader web-search fallback rather
           than giving up, same as manually searching elsewhere would */
        fetchViaClaudeWebSearch(barcode, onResult);
        return;
      }

      nutriments = data.product.nutriments || {};
      onResult({
        found: true,
        source: 'off',
        name: data.product.product_name || null,
        brand: data.product.brands || null,
        protein_100g: nutriments.proteins_100g != null ? nutriments.proteins_100g : null,
        kcal_100g: nutriments['energy-kcal_100g'] != null ? nutriments['energy-kcal_100g'] : null
      });
    }).catch(function()
    {
      /* direct fetch blocked (e.g. artifact sandbox CSP) — fall back */
      fetchViaClaudeWebSearch(barcode, onResult);
    });
  }
  catch (e)
  {
    fetchViaClaudeWebSearch(barcode, onResult);
  }
}

/* fallback for when direct fetch() to a third-party domain is blocked (the
   artifact sandbox only allows the artifact to call api.anthropic.com itself)
   or when O.F.F. genuinely doesn't have the barcode. Asks a fresh Claude
   instance, with web search enabled, to look the barcode up and return
   structured JSON — the only network call this makes is to Anthropic's own
   API, which artifacts are permitted to call directly. */
/* the model doesn't always follow 'respond with ONLY JSON' — it sometimes reasons
   in prose first (e.g. working out a per-serving-to-per-100g conversion) and puts
   the JSON object at the end. JSON.parse requires the whole string to be valid,
   so pull just the {...} substring out rather than assuming the text is clean. */
function extractJSONObject(text)
{
  let match = text.match(/\{[\s\S]*\}/);
  return match ? match[0] : text;
}

/* compact, human-readable view of an API response for the debug box — the raw
   response can run to 100+ KB dominated by opaque encrypted_content blobs from
   search results, which aren't useful for diagnosing a parse failure. */
function summarizeAPIResponse(data)
{
  let lines = [];
  let block;
  let result;

  if (!data || !Array.isArray(data.content)) return 'no content array in response:\n' + JSON.stringify(data, null, 2).slice(0, 2000);

  for (let i = 0; i < data.content.length; ++i)
  {
    block = data.content[i];

    if (block.type == 'text')
    {
      lines.push('[text]\n' + block.text);
    }
    else if (block.type == 'server_tool_use')
    {
      lines.push('[web_search query] ' + JSON.stringify(block.input));
    }
    else if (block.type == 'web_search_tool_result')
    {
      lines.push('[web_search_tool_result] ' + (Array.isArray(block.content) ? block.content.length : 0) + ' result(s):');
      if (Array.isArray(block.content))
      {
        for (let j = 0; j < block.content.length; ++j)
        {
          result = block.content[j];
          lines.push('  - ' + (result.title || '(no title)') + ' — ' + (result.url || ''));
        }
      }
    }
    else
    {
      lines.push('[' + block.type + ']');
    }
  }

  return lines.join('\n\n');
}

function fetchViaClaudeWebSearch(barcode, onResult)
{
  let prompt = 'Search the web (Open Food Facts, manufacturer sites, and nutrition databases) for the packaged food product with barcode/UPC "' + barcode + '". '
    + 'Find its protein and calories per 100g, and its name/brand if available. Do any reasoning or unit conversion silently — '
    + 'your entire reply must be ONLY the raw JSON object below, nothing before it and nothing after it, no markdown, no code fences, no explanation. '
    + 'Shape: {"found":true,"name":"...","brand":"...","protein_100g":<number or null>,"kcal_100g":<number or null>} '
    + 'or {"found":false} if you cannot find reliable data. Do not guess or estimate — only report numbers found from an actual source.';

  try
  {
    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role:'user', content: prompt }],
        tools: [{ type:'web_search_20250305', name:'web_search' }]
      })
    }).then(function(resp)
    {
      return resp.json();
    }).then(function(data)
    {
      let text;
      let parsed;

      if (!data || !Array.isArray(data.content))
      {
        g_last_lookup_debug = 'unexpected response shape from api.anthropic.com:\n\n' + summarizeAPIResponse(data);
        onResult({ found:false, reason:'lookup unavailable — O.F.F. unreachable and the web-search fallback returned nothing usable (see debug box)' });
        return;
      }

      text = data.content.filter(function(block) { return block.type == 'text'; }).map(function(block) { return block.text; }).join('\n');
      text = text.replace(/```json|```/g, '').trim();

      try
      {
        parsed = JSON.parse(extractJSONObject(text));
      }
      catch (e)
      {
        g_last_lookup_debug = 'could not find a valid JSON object in the response:\n\n' + summarizeAPIResponse(data);
        onResult({ found:false, reason:'lookup unavailable — O.F.F. unreachable, web-search fallback returned an unparseable response (see debug box)' });
        return;
      }

      if (!parsed.found)
      {
        onResult({ found:false, reason:'not found on O.F.F. or via web search' });
        return;
      }

      onResult({
        found: true,
        source: 'ai_search',
        name: parsed.name || null,
        brand: parsed.brand || null,
        protein_100g: parsed.protein_100g != null ? parsed.protein_100g : null,
        kcal_100g: parsed.kcal_100g != null ? parsed.kcal_100g : null
      });
    }).catch(function(e)
    {
      onResult({ found:false, reason:'lookup failed — O.F.F. and the web-search fallback both failed (' + e.message + ')' });
    });
  }
  catch (e)
  {
    onResult({ found:false, reason:'lookup failed to start — ' + e.message });
  }
}

function formatOFFMatchStatus(result)
{
  let name_part = result.name ? 'matched: ' + result.name : 'matched (no product name on file)';

  if (result.source == 'ai_search')
  {
    return name_part + ' — found via web search, not O.F.F.\'s own database; verify against the label if precision matters. Values are editable.';
  }

  return name_part + ' — values are editable, O.F.F. data is label-rounded (~±10%)';
}

function doFetchOFF(key)
{
  let item = findScoopItem(key);
  let lookup_barcode;

  if (!item) return;

  lookup_barcode = g_fetch_barcode[key] || item.barcode;
  if (!lookup_barcode) return;

  g_fetch_pending[key] = false;
  g_fetch_status[key] = 'looking up… (may take longer if O.F.F. is unreachable and it falls back to a web search)';
  render();

  fetchOFFProduct(lookup_barcode, function(result)
  {
    if (!result.found)
    {
      g_fetch_status[key] = result.reason;
      render();
      return;
    }

    if (result.protein_100g != null) item.protein_100g = result.protein_100g;
    if (result.kcal_100g != null) item.kcal_100g = result.kcal_100g;
    recomputeItemMacrosFromDensity(item);
    if (g_edit_item_key == key && g_edit_draft)
    {
      setDraftMacrosFromDensity(g_edit_draft, result.protein_100g, result.kcal_100g);
      recomputeEditDraftMacros();
    }

    g_fetch_barcode[key] = null;
    g_fetch_status[key] = formatOFFMatchStatus(result);
    render();
    save();
  });
}

function buildDiaryText()
{
  let lines = [];
  let sorted = sortedScoopItems();
  let dates = Object.keys(g_log).sort();

  lines.push('PANTRY ITEMS');
  lines.push('');

  for (let i = 0; i < sorted.length; ++i)
  {
    let item = sorted[i];
    lines.push(item.name + (item.brand ? ' — ' + item.brand : '') + (item.barcode ? ' [' + item.barcode + ']' : ''));
    lines.push('  ' + formatVolume(item)
      + ' · ' + (item.scoop_g != null ? item.scoop_g + ' g' : '— g')
      + ' · ' + (item.protein_g != null ? item.protein_g + ' g protein' : '— g protein')
      + ' · ' + (item.kcal != null ? item.kcal + ' kcal' : '— kcal'));
  }

  lines.push('');
  lines.push('FOOD DIARY');
  lines.push('');

  if (!dates.length) lines.push('(no logged days yet)');

  for (let d = 0; d < dates.length; ++d)
  {
    let day = g_log[dates[d]] || [];
    let totals = dayTotals(dates[d]);
    lines.push(dates[d] + ' — ' + fmt0(totals.protein) + ' g protein / ' + fmt_1(totals.kcal) + ' kcal (target ' + g_target + ' g)');

    for (let i = 0; i < day.length; ++i)
    {
      let entry = day[i];
      lines.push('  ' + diaryEntryLabel(entry)
        + (entry.grams != null ? ' (' + entry.grams + ' g' + (entry.scale != null && entry.scale != 1 ? ', ' + entry.scale.toFixed(2) + '×' : '') + ')' : '')
        + (entry.protein_g != null ? ' — ' + fmt0(entry.protein_g) + ' g' : '')
        + (entry.kcal != null ? ' / ' + fmt_1(entry.kcal) + ' kcal' : ''));
    }

    lines.push('');
  }

  return lines.join('\n');
}

function csvCell(value)

  if (text.indexOf('"') < 0 && text.indexOf(',') < 0 && text.indexOf('\n') < 0 && text.indexOf('\r') < 0) return text;
  return '"' + text.replace(/"/g, '""') + '"';
}

function sortedBodyweightKcalExportDates()
{

  dates.sort();

  return dates;
}

function buildBodyweightKcalCSV()
{
  let dates = sortedBodyweightKcalExportDates();
  let lines = ['date,body_mass_kg,daily_kcal,water_in_kg,assumed_water_loss_kg'];

  for (let i = 0; i < dates.length; ++i)
  {
    let date = dates[i];
    let bodyweight_kg = g_bodyweight_by_date[date];
    let totals = dayTotals(date);
    let mass_summary = massSummaryForDate(date);
    let has_mass_data = mass_summary.checkpoint_count || mass_summary.water_in_ml || mass_summary.total_mass_in_g;

    if (bodyweight_kg == null) bodyweight_kg = mass_summary.last_mass_kg;
    if (bodyweight_kg == null && totals.kcal <= 0 && !has_mass_data) continue;

    let line =  csvCell(date)
      + ',' + csvCell(bodyweight_kg != null ? fmt1(bodyweight_kg) : '')
      + ',' + csvCell(fmt0(totals.kcal))
    if (mass_summary.water_in_kg && mass_summary.assumed_water_loss_kg)
    {
      line += ',' + csvCell(fmt3(mass_summary.water_in_kg))
        + ',' + csvCell(fmt3(mass_summary.assumed_water_loss_kg));
    }
    lines.push(line);
  }

  return lines.join('\n') + '\n';
}

function countObjectKeys(obj)
{
  if (!obj || typeof obj != 'object') return 0;
  return Object.keys(obj).length;
}

function keyedArraySet(items)
{
  let result = {};

  if (!Array.isArray(items)) return result;

  for (let i = 0; i < items.length; ++i)
  {
    if (items[i] && items[i].key) result[items[i].key] = true;
  }

  return result;
}

function logEntryIds(log)
{
  let result = {};

  if (!log || typeof log != 'object') return result;

  for (let date in log)
  {
    let day = log[date];
    if (!Array.isArray(day)) continue;

    for (let i = 0; i < day.length; ++i)
    {
      let entry = day[i];
      if (entry && entry.id) result[entry.id] = true;
    }
  }

  return result;
}

function massEventIds(events_by_date)
{
  let result = {};

  if (!events_by_date || typeof events_by_date != 'object') return result;

  for (let date in events_by_date)
  {
    let day = events_by_date[date];
    if (!Array.isArray(day)) continue;

    for (let i = 0; i < day.length; ++i)
    {
      let event = day[i];
      if (event && event.id) result[event.id] = true;
    }
  }

  return result;
}

function importArrayChangeStats(current_items, import_items, replace)
{
  let current_keys = keyedArraySet(current_items);
  let import_keys = keyedArraySet(import_items);
  let result = {
    total: replace ? countObjectKeys(import_keys) : countObjectKeys(current_keys),
    added: 0,
    removed: 0
  };

  for (let key in import_keys)
  {
    if (!current_keys[key])
    {
      ++result.added;
      if (!replace) ++result.total;
    }
  }

  if (replace)
  {
    for (let key in current_keys)
    {
      if (!import_keys[key]) ++result.removed;
    }
  }

  return result;
}

function importLogDayChangeStats(import_log, replace)
{
  let result = {
    total: replace ? countObjectKeys(import_log) : countObjectKeys(g_log),
    added: 0,
    removed: 0
  };

  if (import_log && typeof import_log == 'object')
  {
    for (let date in import_log)
    {
      if (!g_log[date])
      {
        ++result.added;
        if (!replace) ++result.total;
      }
    }
  }

  if (replace)
  {
    for (let date in g_log)
    {
      if (!import_log || !import_log[date]) ++result.removed;
    }
  }

  return result;
}

function importLogEntryChangeStats(import_log, replace)
{
  let current_ids = logEntryIds(g_log);
  let import_ids = logEntryIds(import_log);
  let result = {
    total: replace ? countObjectKeys(import_ids) : countObjectKeys(current_ids),
    added: 0,
    removed: 0
  };

  for (let id in import_ids)
  {
    if (!current_ids[id] && !g_deleted_log_entry_ids[id])
    {
      ++result.added;
      if (!replace) ++result.total;
    }
  }

  if (replace)
  {
    for (let id in current_ids)
    {
      if (!import_ids[id]) ++result.removed;
    }
  }

  return result;
}

function importMassEventChangeStats(import_events, replace)
{
  let current_ids = massEventIds(g_mass_events);
  let import_ids = massEventIds(import_events);
  let result = {
    total: replace ? countObjectKeys(import_ids) : countObjectKeys(current_ids),
    added: 0,
    removed: 0
  };

  for (let id in import_ids)
  {
    if (!current_ids[id] && !g_deleted_mass_event_ids[id])
    {
      ++result.added;
      if (!replace) ++result.total;
    }
  }

  if (replace)

    }
  }

}

function importChangeHtml(label, stats)
{
  let h = '';

  h += `<div class="import-change">
    <span>${esc(stats.total)} ${label}</span>`;

  if (stats.added || stats.removed)
  {
    if (stats.added) h += ` <span class="import-plus">+${esc(stats.added)}</span>`;
    if (stats.removed) h += ` <span class="import-minus">-${esc(stats.removed)}</span>`;
  }
  else
  {
    h += ` <span class="import-neutral">(no change)</span>`;
  }

  h += `</div>`;

  return h;
}

function applyMergeImport()
{
  let parsed = g_import_pending;
  let loadout_keys = keyedArraySet(g_foods);
  let pantry_keys = keyedArraySet(g_scoop_items);

  if (!parsed) return;

  if (parsed.bodyweight_by_date && typeof parsed.bodyweight_by_date == 'object')
  {
    for (let date in parsed.bodyweight_by_date)
    {
      if (g_bodyweight_by_date[date] == null) g_bodyweight_by_date[date] = parsed.bodyweight_by_date[date];
    }
  }

  if (Array.isArray(parsed.foods))
  {
    for (let i = 0; i < parsed.foods.length; ++i)
    {
      let food = parsed.foods[i];
      if (!food || !food.key || loadout_keys[food.key]) continue;

      copyLoadoutRawFields(food);
      g_foods.push(food);
      loadout_keys[food.key] = true;
    }
  }

  if (Array.isArray(parsed.scoop_items))
  {
    for (let i = 0; i < parsed.scoop_items.length; ++i)
    {
      let item = parsed.scoop_items[i];
      if (!item || !item.key || pantry_keys[item.key]) continue;

      copyScoopRawFields(item);
      g_scoop_items.push(item);
      pantry_keys[item.key] = true;
    }
  }

  mergeLogEntries(parsed.log);
  mergeDeletedMassEventIds(parsed.deleted_mass_event_ids);
  mergeMassEvents(parsed.mass_events);

  if (parsed.collapsed_groups && typeof parsed.collapsed_groups == 'object')
  {
    for (let key in parsed.collapsed_groups)
    {
      if (parsed.collapsed_groups[key]) g_collapsed_groups[key] = true;
    }
  }

  mergeKnownItems();
  migrateLogFormat();
  migrateTagsFormat();
  migrateMassEvents();
  pruneDeletedLogEntries();
  pruneDeletedMassEvents();

  g_import_pending = null;
  g_import_text = '';
  g_import_status = 'merged import ✓';
  g_import_open = false;
  render();
  save();
}

function copyText(text)
{
  function fallback()
  {
    let temp = document.createElement('textarea');
    temp.value = text;
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();

    try
    {
      document.execCommand('copy');
      g_copy_status = 'copied ✓';
    }
    catch (e)
    {
      g_copy_status = 'copy failed — select the text manually';
    }

    document.body.removeChild(temp);
    render();
  }

  if (navigator.clipboard && navigator.clipboard.writeText)
  {
    navigator.clipboard.writeText(text).then(function()
    {
      g_copy_status = 'copied ✓';
      render();
    }, fallback);
    return;
  }

  fallback();
}

function downloadText(filename, mime, text)
{
  let blob = new Blob([text], { type:mime });
  let link = document.createElement('a');

  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function()
  {
    URL.revokeObjectURL(link.href);
  }, 4000);
}

function fmt1(n)
{

}

function fmt2(n)
{

}

function fmt3(n)
{

}

function fmt_1(n)

}

function makeSavePayload()
{
  return {
    target:g_target,
    bodyweight_kg:g_bodyweight_kg,
    bodyweight_by_date:g_bodyweight_by_date,
    foods:g_foods,
    scoop_items:g_scoop_items,
    log:g_log,
