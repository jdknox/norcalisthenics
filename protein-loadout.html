function esc(value)
{
  let text = String(value == null ? '' : value);
  let out = '';
  let ch;

  for (let i = 0; i < text.length; ++i)
  {
    ch = text.charAt(i);

    switch (ch)
    {
      case '&':
        out += '&amp;';
        break;
      case '<':
        out += '&lt;';
        break;
      case '>':
        out += '&gt;';
        break;
      case '"':
        out += '&quot;';
        break;
      case "'":
        out += '&#39;';
        break;
      default:
        out += ch;
        break;
    }
  }

  return out;
}

function uid()
{
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function todayISO()
{
  let d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function shiftDateISO(iso, delta)
{
  let d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + delta);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function cloneKnownItem(known)
{
  let item = {
    key: known.key, barcode: known.barcode, name: known.name, brand: known.brand,
    volume_ml: known.volume_ml, volume_label: known.volume_label,
    scoop_g: known.scoop_g, protein_g: known.protein_g, kcal: known.kcal,
    protein_100g: known.protein_100g != null ? known.protein_100g : null,
    kcal_100g: known.kcal_100g != null ? known.kcal_100g : null,
    tags: Array.isArray(known.tags) ? known.tags.slice() : []
  };

  item.scoop_g_raw = item.scoop_g != null ? String(item.scoop_g) : '';
  item.protein_g_raw = item.protein_g != null ? String(item.protein_g) : '';
  item.kcal_raw = item.kcal != null ? String(item.kcal) : '';

  return item;
}

function mergeKnownItems()
{
  let known;
  let existing;
  let found;

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    existing = g_scoop_items[i];
    if (existing.barcode == null && g_legacy_key_barcode_fixups[existing.key]) existing.barcode = g_legacy_key_barcode_fixups[existing.key];
    if (g_legacy_key_brand_fixups[existing.key]) existing.brand = g_legacy_key_brand_fixups[existing.key];
    if (g_legacy_key_name_fixups[existing.key]) existing.name = g_legacy_key_name_fixups[existing.key];
  }

  for (let i = 0; i < g_known_items.length; ++i)
  {
    known = g_known_items[i];
    found = null;

    for (let j = 0; j < g_scoop_items.length; ++j)
    {
      if (g_scoop_items[j].barcode == known.barcode)
      {
        found = g_scoop_items[j];
        break;
      }
    }

    if (found)
    {
      if (found.volume_ml == null && found.volume_label == null)
      {
        found.volume_ml = known.volume_ml;
        found.volume_label = known.volume_label;
      }
      if (found.protein_100g == null && known.protein_100g != null) found.protein_100g = known.protein_100g;
      if (found.kcal_100g == null && known.kcal_100g != null) found.kcal_100g = known.kcal_100g;
      continue;
    }

    g_scoop_items.push(cloneKnownItem(known));
  }
}

function sortedScoopItems()
{
  let copy = g_scoop_items.slice();

  copy.sort(function(a, b)
  {
    let an = a.name.toLowerCase();
    let bn = b.name.toLowerCase();
    if (an < bn) return -1;
    if (an > bn) return 1;
    return 0;
  });

  return copy;
}

function itemTags(item)
{
  return Array.isArray(item.tags) ? item.tags : [];
}

function parseTagsInput(text)
{
  let parts = text.split(',');
  let seen = {};
  let out = [];

  for (let i = 0; i < parts.length; ++i)
  {
    let t = parts[i].trim();
    if (!t) continue;

    let key = t.toLowerCase();
    if (seen[key]) continue;

    seen[key] = true;
    out.push(t);
  }

  return out;
}

function distinctTagNames()
{
  let seen = {};
  let out = [];

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let tags = itemTags(g_scoop_items[i]);
    for (let j = 0; j < tags.length; ++j)
    {
      let key = tags[j].toLowerCase();
      if (seen[key]) continue;
      seen[key] = true;
      out.push(tags[j]);
    }
  }

  out.sort(function(a, b)
  {
    return a.toLowerCase() < b.toLowerCase() ? -1 : a.toLowerCase() > b.toLowerCase() ? 1 : 0;
  });

  return out;
}

/* returns the text after the last comma — the tag currently being typed,
   as opposed to the full comma-separated field value. */
function currentTagFragment(value)
{
  let idx = value.lastIndexOf(',');
  return idx >= 0 ? value.slice(idx + 1).trim() : value.trim();
}

function updateTagSuggestions(el)
{
  let list = document.getElementById('tag-suggest');
  let fragment;
  let names;
  let matches;

  if (!list) return;

  fragment = currentTagFragment(el.value).toLowerCase();
  if (!fragment)
  {
    list.classList.remove('open');
    list.innerHTML = '';
    return;
  }

  names = distinctTagNames();
  matches = [];
  for (let i = 0; i < names.length; ++i)
  {
    if (names[i].toLowerCase().indexOf(fragment) >= 0) matches.push(names[i]);
  }

  if (!matches.length)
  {
    list.classList.remove('open');
    list.innerHTML = '';
    return;
  }

  list.innerHTML = matches.map(function(n)
  {
    return '<button type="button" class="tagsuggestitem" data-a="tag-suggest-pick" data-tag="' + esc(n) + '">' + esc(n) + '</button>';
  }).join('');
  list.classList.add('open');
}

function pickTagSuggestion(tag)
{
  let input = document.querySelector('[data-editdraft="tags"]');
  let list = document.getElementById('tag-suggest');
  let value;
  let idx;
  let prefix;
  let new_value;

  if (!input || !g_edit_draft) return;

  value = input.value;
  idx = value.lastIndexOf(',');
  prefix = idx >= 0 ? value.slice(0, idx + 1) + ' ' : '';
  new_value = prefix + tag + ', ';

  input.value = new_value;
  g_edit_draft.tags = new_value;

  if (list)
  {
    list.classList.remove('open');
    list.innerHTML = '';
  }

  input.focus();
}

/* an item can carry multiple tags and renders as a member under EVERY tag that
   currently has 2+ members (same underlying item, same key, at each appearance —
   not a data duplicate, just rendered more than once). a tag with only one
   current member doesn't count as a group; items with no qualifying tag render
   standalone exactly once. */
function tagsMatchActive(tags)
{

  for (let i = 0; i < tags.length; ++i)
  {
    if (g_active_tags[tags[i].toLowerCase()]) return true;
  }

  return false;
}

function scoopSearchTerm()
{
  return g_scoop_search_raw.trim().toLowerCase();
}

function itemMatchesSearch(item)
{
  let term = scoopSearchTerm();

  if (!term) return false;
  if (item.name && item.name.toLowerCase().indexOf(term) >= 0) return true;
  if (item.brand && item.brand.toLowerCase().indexOf(term) >= 0) return true;
  if (item.barcode && item.barcode.toLowerCase().indexOf(term) >= 0) return true;

  return false;
}

function itemTagsMatchSearch(item)
{
  let term = scoopSearchTerm();
  let tags;

  if (!term) return false;

  tags = itemTags(item);
  for (let i = 0; i < tags.length; ++i)
  {
    if (tags[i].toLowerCase().indexOf(term) >= 0) return true;
  }

  return false;
}

function groupMatchesSearch(group)
{
  let term = scoopSearchTerm();

  if (!term) return false;
  if (group.name && group.name.toLowerCase().indexOf(term) >= 0) return true;

  for (let i = 0; i < group.members.length; ++i)
  {
    if (itemMatchesSearch(group.members[i])) return true;
    if (itemTagsMatchSearch(group.members[i])) return true;
  }

  return false;
}

function sortedGroupMembersForDisplay(group)
{
  let members = group.members.slice();
  let has_search = scoopSearchTerm() != '';

  members.sort(function(a, b)
  {
    let a_matches = has_search && itemMatchesSearch(a);
    let b_matches = has_search && itemMatchesSearch(b);
    let a_name = a.name.toLowerCase();
    let b_name = b.name.toLowerCase();

    if (a_matches && !b_matches) return -1;
    if (!a_matches && b_matches) return 1;
    return a_name < b_name ? -1 : a_name > b_name ? 1 : 0;
  });

  return members;
}

function groupedNodes()
{
  let sorted = sortedScoopItems();
  let tag_counts = {};
  let tag_display = {};
  let groups = {};
  let nodes = [];

  for (let i = 0; i < sorted.length; ++i)
  {
    let tags = itemTags(sorted[i]);
    for (let j = 0; j < tags.length; ++j)
    {
      let tag_key = tags[j].toLowerCase();
      tag_counts[tag_key] = (tag_counts[tag_key] || 0) + 1;
      if (!tag_display[tag_key]) tag_display[tag_key] = tags[j];
    }
  }

  for (let i = 0; i < sorted.length; ++i)
  {
    let item = sorted[i];
    let tags = itemTags(item);
    for (let j = 0; j < tags.length; ++j)
    {
      let tag_key = tags[j].toLowerCase();
      if (tag_counts[tag_key] < 2) continue;
      if (!groups[tag_key]) groups[tag_key] = { key:tag_key, name:tag_display[tag_key], members:[] };
      groups[tag_key].members.push(item);
    }
  }

  for (let i = 0; i < sorted.length; ++i)
  {
    let item = sorted[i];
    let tags = itemTags(item);
    let has_qualifying = false;
    for (let j = 0; j < tags.length; ++j)
    {
      if (tag_counts[tags[j].toLowerCase()] >= 2)
      {
        has_qualifying = true;
        break;
      }
    }
    if (!has_qualifying) nodes.push({ type:'item', item:item, sortname:(tagsMatchActive(tags) ? '0_' : '1_') + item.name.toLowerCase() });
  }

  for (let key in groups)
  {
    nodes.push({ type:'group', group:groups[key], sortname:(g_active_tags[key] ? '0_' : '1_') + groups[key].name.toLowerCase() });
  }

  nodes.sort(function(a, b)
  {
    let a_is_group = a.type == 'group';
    let b_is_group = b.type == 'group';
    let a_matches = a_is_group ? groupMatchesSearch(a.group) : itemMatchesSearch(a.item);
    let b_matches = b_is_group ? groupMatchesSearch(b.group) : itemMatchesSearch(b.item);
    let a_active = a_is_group ? !!g_active_tags[a.group.key] : tagsMatchActive(itemTags(a.item));
    let b_active = b_is_group ? !!g_active_tags[b.group.key] : tagsMatchActive(itemTags(b.item));
    let a_name = a_is_group ? a.group.name.toLowerCase() : a.item.name.toLowerCase();
    let b_name = b_is_group ? b.group.name.toLowerCase() : b.item.name.toLowerCase();

    if (a_matches && !b_matches) return -1;
    if (!a_matches && b_matches) return 1;
    if (a_active && !b_active) return -1;
    if (!a_active && b_active) return 1;
    if (a_is_group && !b_is_group) return -1;
    if (!a_is_group && b_is_group) return 1;
    return a_name < b_name ? -1 : a_name > b_name ? 1 : 0;
  });

  return nodes;
}

function formatVolume(item)
{
  if (item.volume_ml != null) return item.volume_ml + ' mL';
  if (item.volume_label) return item.volume_label;
  return '—';
}

function parseVolumeDraft(text)
{
  let vol_text = text.trim();
  let lower_text = vol_text.toLowerCase();
  let number_text;
  let num;

  if (!vol_text) return { volume_ml:null, volume_label:null };

  if (/^[0-9]+(\.[0-9]+)?$/.test(vol_text))
  {
    num = parseFloat(vol_text);
    return { volume_ml:num, volume_label:null };
  }

  if (/^[0-9]+(\.[0-9]+)?[ ]*ml$/.test(lower_text))
  {
    number_text = lower_text.replace('ml', '').trim();
    num = parseFloat(number_text);
    return { volume_ml:num, volume_label:null };
  }

  return { volume_ml:null, volume_label:vol_text.toUpperCase() };
}

function round1(n)
{
  return Math.round(n*10)/10;

/* old format: g_log[date] = { item_key: count }. new format: g_log[date] = [entry, ...].
   converts in place; safe to call repeatedly (already-migrated days are arrays and skipped). */
/* old format: item.group = string|null. new format: item.tags = [string, ...].
   safe to call repeatedly — already-migrated items (tags is an array) are skipped. */
function migrateTagsFormat()
{
  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let item = g_scoop_items[i];
    if (Array.isArray(item.tags)) continue;

    item.tags = item.group ? [item.group] : [];
    delete item.group;
  }
}

function migrateLogFormat()
{
  for (let date in g_log)
  {
    let day = g_log[date];
    if (Array.isArray(day)) continue;

    let entries = [];
    for (let key in day)
    {
      let item = findScoopItem(key);
      let count = day[key];
      for (let i = 0; i < count; ++i)
      {
        entries.push({
          id: uid(), item_key: key, scale: 1,
          grams: item ? item.scoop_g : null,
          protein_g: item ? item.protein_g : null,
          kcal: item ? item.kcal : null
        });
      }
    }
    g_log[date] = entries;
  }
}

function proteinPerGram(food)
{
  if (food.kind == 'unit') return food.unit_protein/food.unit_grams;
  return food.package_protein/food.package_grams;
}

function dailyProtein(food)
{
  if (food.kind == 'unit') return food.daily*food.unit_protein;
  return food.daily*proteinPerGram(food);
}

function weeklyAmount(food)
{
  return food.daily*7;
}

function packagesPerWeek(food)
{
  if (food.kind == 'unit') return food.package_units != null ? weeklyAmount(food)/food.package_units : null;
  return weeklyAmount(food)/food.package_grams;
}

function monthlyCost(food)
{
  if (food.price == null) return null;
  if (food.kind == 'unit') return food.package_units != null ? (food.daily*30/food.package_units)*food.price : food.daily*30*food.price;
  return (food.daily*30/food.package_grams)*food.price;
}

function totalDailyProtein()
{
  let total = 0;

  for (let i = 0; i < g_foods.length; ++i)
  {
    total += dailyProtein(g_foods[i]);
  }

  return total;
}

function totalMonthlyCost()
{
  let total = 0;
  let cost;

  for (let i = 0; i < g_foods.length; ++i)
  {
    cost = monthlyCost(g_foods[i]);
    if (cost != null) total += cost;
  }

  return total;
}

function findScoopItem(key)
{

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    if (g_scoop_items[i].key == key) return g_scoop_items[i];
  }

  return null;
}

function logCount(date, key)
{
  let day = g_log[date];
  let n = 0;

  if (!day) return 0;

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].item_key == key) ++n;
  }

  return n;
}

function addScoop(key)
{
  let item = findScoopItem(key);
  if (!item) return;

  pushLogEntry(key, item.scoop_g, item.protein_g, item.kcal, 1);
}

function pushLogEntry(key, grams, protein_g, kcal, scale)
{
  let day = g_log[g_view_date];

  if (!day)
  {
    day = [];
    g_log[g_view_date] = day;
  }

  day.push({ id:uid(), item_key:key, grams:grams, protein_g:protein_g, kcal:kcal, scale:scale });
}

function removeScoop(key)
{
  let day = g_log[g_view_date];

  if (!day) return;

  for (let i = day.length - 1; i >= 0; --i)
  {
    if (day[i].item_key == key)
    {
      markDeletedLogEntry(day[i]);
      day.splice(i, 1);
      return;
    }
  }
}

function logCustomEntry()
{
  let protein_num;
  let kcal_num;

  if (g_view_date != todayISO()) return;

  protein_num = parseFloat(g_custom_protein_raw);
  if (isNaN(protein_num) || protein_num < 0)
  {
    g_custom_status = 'enter a protein amount first';
    render();
    return;
  }

  kcal_num = parseFloat(g_custom_kcal_raw);
  protein_num = round1(protein_num);
  if (isNaN(kcal_num)) kcal_num = customKcalEstimate(protein_num);

  pushLogEntry('custom', null, protein_num, Math.round(kcal_num), null);
  g_custom_protein_raw = '';
  g_custom_kcal_raw = '';
  g_custom_status = '';
  render();
  save();
}

function removeLogEntry(entry_id)
{
  let day = g_log[g_view_date];

  if (!day) return;

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].id == entry_id)
    {
      markDeletedLogEntry(day[i]);
      day.splice(i, 1);
      return;
    }
  }
}

function entriesForItem(date, key)
{
  let day = g_log[date] || [];
  let out = [];

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].item_key == key) out.push(day[i]);
  }

  return out;
}

function dayTotals(date)
{
  let day = g_log[date];
  let protein = 0;
  let kcal = 0;

  if (!day) return { protein:0, kcal:0 };

  for (let i = 0; i < day.length; ++i)
  {
    if (day[i].protein_g != null) protein += day[i].protein_g;
    if (day[i].kcal != null) kcal += day[i].kcal;
  }

  return { protein:protein, kcal:kcal };
}

function sortedLogDatesBeforeToday()
{
  let today = todayISO();
  let dates = [];

  for (let date in g_log)
  {
    if (date < today) dates.push(date);
  }

  dates.sort();
  return dates;
}

function customKcalRatio()
{
  let dates = sortedLogDatesBeforeToday();
  let ratio = custom_kcal_ratio_fallback;

  for (let i = 0; i < dates.length; ++i)
  {
    let totals = dayTotals(dates[i]);
    if (totals.protein <= 0 || totals.kcal <= 0) continue;

    let day_ratio = totals.kcal/totals.protein;
    ratio = custom_kcal_ratio_rho*ratio + (1 - custom_kcal_ratio_rho)*day_ratio;
  }

  return ratio;
}

function customKcalEstimate(protein_g)
{
  let ratio = customKcalRatio();
  return Math.round(ratio*protein_g);
}

function loggedValueDiffers(actual, expected, tolerance)
{
  if (actual == null && expected == null) return false;
  if (actual == null || expected == null) return true;
  return Math.abs(actual - expected) > tolerance;
}

function expectedEntryScale(entry, item)
{
  if (entry.grams != null && item.scoop_g > 0) return entry.grams/item.scoop_g;
  if (entry.scale != null) return entry.scale;
  return 1;
}

function adjustedLogEntries(date)
{
  let day = g_log[date] || [];
  let out = [];

  for (let i = 0; i < day.length; ++i)
  {
    let entry = day[i];
    if (entry.item_key == 'custom')
    {
      out.push({ entry:entry, item:null, custom:true, expected_protein:null, expected_kcal:null });
      continue;
    }

    let item = findScoopItem(entry.item_key);
    if (!item) continue;

    let scale = expectedEntryScale(entry, item);
    let expected_protein = item.protein_g != null ? round1(item.protein_g*scale) : null;
    let expected_kcal = item.kcal != null ? Math.round(item.kcal*scale) : null;

    if (loggedValueDiffers(entry.protein_g, expected_protein, 0.05) || loggedValueDiffers(entry.kcal, expected_kcal, 0.5))
    {
      out.push({ entry:entry, item:item, custom:false, expected_protein:expected_protein, expected_kcal:expected_kcal });
    }
  }

  return out;
}

function draftMacroMode(d)
{
  return d && d.macro_mode == 'serving' ? 'serving' : '100g';
}

function numberOrNull(text)
{
  let num = parseFloat(text);
  return isNaN(num) ? null : num;
}

function macroFieldsFromDraft(d)
{
  let mode = draftMacroMode(d);
  let scoop_g = numberOrNull(d.scoop_g);
  let protein_value = numberOrNull(d.macro_protein);
  let kcal_value = numberOrNull(d.macro_kcal);
  let protein_100g = null;
  let kcal_100g = null;
  let protein_g = null;
  let kcal = null;
  let macros;

  if (mode == 'serving')
  {
    protein_g = protein_value;
    kcal = kcal_value;

    if (scoop_g != null && scoop_g > 0)
    {
      if (protein_g != null) protein_100g = protein_g/scoop_g*100;
      if (kcal != null) kcal_100g = kcal/scoop_g*100;
    }
  }
  else
  {
    protein_100g = protein_value;
    kcal_100g = kcal_value;
    if (scoop_g != null)
    {
      macros = computeMacrosFromDensity(scoop_g, protein_100g, kcal_100g);
      protein_g = macros.protein_g;
      kcal = macros.kcal;
    }
  }

  return {
    scoop_g:scoop_g,
    protein_100g:protein_100g,
    kcal_100g:kcal_100g,
    protein_g:protein_g,
    kcal:kcal
  };
}

function setDraftMacrosFromDensity(d, protein_100g, kcal_100g)
{
  d.macro_mode = '100g';
  d.macro_protein = protein_100g != null ? String(protein_100g) : '';
  d.macro_kcal = kcal_100g != null ? String(kcal_100g) : '';
}

function setEditDraftMacrosFromItem(d, item)
{
  if (item.protein_g != null || item.kcal != null)
  {
    d.macro_mode = 'serving';
    d.macro_protein = item.protein_g != null ? String(item.protein_g) : '';
    d.macro_kcal = item.kcal != null ? String(item.kcal) : '';
    return;
  }

  d.macro_mode = '100g';
  d.macro_protein = item.protein_100g != null ? String(item.protein_100g) : '';
  d.macro_kcal = item.kcal_100g != null ? String(item.kcal_100g) : '';
}

function switchDraftMacroMode(d, new_mode)

  fields = macroFieldsFromDraft(d);
  d.macro_mode = new_mode;

  if (new_mode == 'serving')
  {
    d.macro_protein = fields.protein_g != null ? String(fields.protein_g) : '';
    d.macro_kcal = fields.kcal != null ? String(fields.kcal) : '';
    return;
  }

  d.macro_protein = fields.protein_100g != null ? String(round1(fields.protein_100g)) : '';
  d.macro_kcal = fields.kcal_100g != null ? String(Math.round(fields.kcal_100g)) : '';
}

function lookupOFFForAddItem()
{
  let d = g_scoop_add_draft;
  let barcode;

  if (!d) return;

  barcode = d.barcode.trim();
  if (!barcode)
  {
    g_add_item_status = 'enter a barcode first';
    render();
    return;
  }

  g_add_item_status = 'looking up… (may take longer if O.F.F. is unreachable and it falls back to a web search)';
  render();

  fetchOFFProduct(barcode, function(result)
  {
    if (!g_scoop_add_draft) return; // form was closed while the fetch was in flight

    if (!result.found)
    {
      g_add_item_status = result.reason;
      render();
      return;
    }

    if (!g_scoop_add_draft.name.trim() && result.name) g_scoop_add_draft.name = result.name;
    if (!g_scoop_add_draft.brand.trim() && result.brand) g_scoop_add_draft.brand = result.brand;
    setDraftMacrosFromDensity(g_scoop_add_draft, result.protein_100g, result.kcal_100g);

    g_add_item_status = formatOFFMatchStatus(result);
    render();
  });
}

/* source: 'scale' (slider moved) or 'grams' (typed directly). either way, cascades
   to protein/kcal via the item's base per-gram density. protein/kcal fields are
   still independently editable afterward — typing into them does not call this. */
/* pure DOM write, no render() — called on every 'input' tick while dragging the
   slider, so numbers update live without rebuilding the DOM (which would break
   the drag gesture on the range input). does not touch g_scale_draft; the real
   commit happens once on 'change' via recomputeScaleDraft. */
function liveScalePreview(new_scale)
{
  let item = findScoopItem(g_scale_item_key);
  let base_scoop;
  let new_grams;
  let label_el;
  let vol_el;
  let grams_el;
  let protein_el;
  let kcal_el;
  let vol_text;

  if (!item) return;

  base_scoop = item.scoop_g || 0;
  new_grams = round1(base_scoop*new_scale);

  label_el = document.getElementById('scale-label');
  if (label_el) label_el.textContent = new_scale.toFixed(2) + '× → ' + new_grams + ' g';

  vol_el = document.getElementById('scale-volume-preview');
  if (vol_el)
  {
    vol_text = item.volume_ml != null ? round1(item.volume_ml*new_scale) + ' mL' : formatVolume(item);
    vol_el.textContent = vol_text;
  }

  grams_el = document.querySelector('[data-scaledraft="grams"]');
  if (grams_el) grams_el.value = new_grams;

  if (base_scoop > 0)
  {
    protein_el = document.querySelector('[data-scaledraft="protein_g"]');
    if (protein_el && item.protein_g != null) protein_el.value = round1(item.protein_g/base_scoop*new_grams);

    kcal_el = document.querySelector('[data-scaledraft="kcal"]');
    if (kcal_el && item.kcal != null) kcal_el.value = Math.round(item.kcal/base_scoop*new_grams);
  }
}

function recomputeScaleDraft(source)
{
  let item = findScoopItem(g_scale_item_key);
  let d = g_scale_draft;
  let base_scoop;
  let new_grams;
  let new_scale;
  let num;

  if (!item || !d) return;

  base_scoop = item.scoop_g || 0;

  if (source == 'scale')
  {
    new_scale = d.scale;
    new_grams = base_scoop*new_scale;
  }
  else
  {
    num = parseFloat(d.grams_raw);
    new_grams = isNaN(num) ? base_scoop : num;
    new_scale = base_scoop > 0 ? new_grams/base_scoop : 1;
  }

  d.scale = new_scale;
  d.grams_raw = String(round1(new_grams));

  if (item.protein_g != null && base_scoop > 0)
  {
    d.protein_g = round1(item.protein_g/base_scoop*new_grams);
    d.protein_g_raw = String(d.protein_g);
  }

  if (item.kcal != null && base_scoop > 0)
  {
    d.kcal = Math.round(item.kcal/base_scoop*new_grams);
    d.kcal_raw = String(d.kcal);
  }
}

  if (item.volume_ml != null)
  {
    volume_preview = round1(item.volume_ml*d.scale) + ' mL';
  }
  else
  {
    volume_preview = formatVolume(item);
  }

  h += `<div class="hint" style="margin:2px 0 8px">volume at this scale: <span id="scale-volume-preview">${esc(volume_preview)}</span></div>

      <div class="scalerow">
        <label class="scalelab">scoop g</label><input type="text" inputmode="decimal" data-scaledraft="grams" value="${esc(d.grams_raw)}">
        <label class="scalelab">protein g</label><input type="text" inputmode="decimal" data-scaledraft="protein_g" value="${esc(d.protein_g_raw)}">
        <label class="scalelab">kcal</label><input type="text" inputmode="decimal" data-scaledraft="kcal" value="${esc(d.kcal_raw)}">
      </div>

      <div class="btnrow2">
        <button class="smallbtn" data-a="scoop-scale-log"${disabled}>log this</button>
        <button class="smallbtn" data-a="scoop-scale-reset">reset to 1×</button>
        <button class="smallbtn" data-a="scoop-scale-close">close</button>
      </div>`;

  if (today_entries.length)
  {
    h += `<div class="hint" style="margin-top:8px">logged today:</div>
      <div class="scale-entry-list">`;

    for (let i = 0; i < today_entries.length; ++i)
    {
      e = today_entries[i];
      let grams = e.grams != null ? e.grams + ' g' : '—';
      let protein = e.protein_g != null ? e.protein_g + ' g protein' : '—';
      let kcal = e.kcal != null ? e.kcal + ' kcal' : '—';

      h += `<div class="scale-entry">
          <span>${grams} — ${protein} / ${kcal}</span>
          <button class="smallbtn" data-a="scoop-entry-delete" data-entry="${e.id}">remove</button>
        </div>`;
    }

    h += `</div>`;
  }

  h += `</div>
  </td></tr>`;

  return h;
}

/* OFF pre-population — manual, per-row, never automatic (tool must work offline).
   Note: browsers treat User-Agent as a restricted fetch header and may silently
   drop it regardless of what's set here — there's no way to guarantee OFF's
   requested identification from pure client-side JS without a backend. */
function requestFetchOFF(key, context, barcode)
{
  let item = findScoopItem(key);
  let lookup_barcode = barcode != null ? String(barcode).trim() : '';
  let has_existing;

  if (!item) return;
  if (!lookup_barcode && item.barcode) lookup_barcode = item.barcode;
  if (!lookup_barcode) return;

  g_fetch_context[key] = context || 'standalone';
  g_fetch_barcode[key] = lookup_barcode;

  has_existing = item.protein_g != null || item.kcal != null;
  if (has_existing && !g_fetch_pending[key])
  {
    g_fetch_pending[key] = true;
    g_fetch_status[key] = 'already has values — "confirm overwrite" replaces them with O.F.F. data, or "cancel" to keep what\'s here.';
    render();
    return;
  }

  g_fetch_pending[key] = false;
  doFetchOFF(key);
}

function cancelFetchOFF(key)
{
  g_fetch_pending[key] = false;
  g_fetch_status[key] = null;
  g_fetch_barcode[key] = null;
  render();
}

/* shared calculator: given a scoop mass and per-100g density, compute the
   macros for that specific mass. used at add-time, at edit-time when scoop_g
   changes, and (implicitly) by the scale panel's own density-based cascade. */
function computeMacrosFromDensity(scoop_g, protein_100g, kcal_100g)
{
  let scale = (scoop_g || 0)/100;

  return {
    protein_g: protein_100g != null ? round1(protein_100g*scale) : null,
    kcal: kcal_100g != null ? Math.round(kcal_100g*scale) : null
  };
}

/* recomputes an item's protein_g/kcal (and raw mirrors) from its own stored
   density fields and current scoop_g. no-op if density isn't known. */
function recomputeItemMacrosFromDensity(item)
{
  let result;

  if (item.protein_100g == null && item.kcal_100g == null) return;

  result = computeMacrosFromDensity(item.scoop_g, item.protein_100g, item.kcal_100g);

  if (result.protein_g != null)
  {
    item.protein_g = result.protein_g;
    item.protein_g_raw = String(item.protein_g);
  }
  if (result.kcal != null)
  {
    item.kcal = result.kcal;
    item.kcal_raw = String(item.kcal);
  }
}

/* low-level OFF lookup, callback-style to match the rest of this file's .then()
   chains. calls onResult with either { found:true, name, brand, protein_100g,
   kcal_100g } or { found:false, reason }. never throws — network/parse errors
   are reported through onResult instead. */
function fetchOFFProduct(barcode, onResult)
{
  let url = 'https://world.openfoodfacts.org/api/v2/product/' + barcode + '.json';

  try
  {
    fetch(url, { headers: { 'User-Agent':'protein-loadout-tracker/1.0 (personal local tool)' } }).then(function(resp)
    {
      return resp.json();
    }).then(function(data)
    {
      let nutriments;

      if (!data || data.status == 0 || !data.product)
      {
        /* genuinely not on O.F.F. — try the broader web-search fallback rather
           than giving up, same as manually searching elsewhere would */
        fetchViaClaudeWebSearch(barcode, onResult);
        return;
      }

      nutriments = data.product.nutriments || {};
      onResult({
        found: true,
        source: 'off',
        name: data.product.product_name || null,
        brand: data.product.brands || null,
        protein_100g: nutriments.proteins_100g != null ? nutriments.proteins_100g : null,
        kcal_100g: nutriments['energy-kcal_100g'] != null ? nutriments['energy-kcal_100g'] : null
      });
    }).catch(function()
    {
      /* direct fetch blocked (e.g. artifact sandbox CSP) — fall back */
      fetchViaClaudeWebSearch(barcode, onResult);
    });
  }
  catch (e)
  {
    fetchViaClaudeWebSearch(barcode, onResult);
  }
}

/* fallback for when direct fetch() to a third-party domain is blocked (the
   artifact sandbox only allows the artifact to call api.anthropic.com itself)
   or when O.F.F. genuinely doesn't have the barcode. Asks a fresh Claude
   instance, with web search enabled, to look the barcode up and return
   structured JSON — the only network call this makes is to Anthropic's own
   API, which artifacts are permitted to call directly. */
/* the model doesn't always follow 'respond with ONLY JSON' — it sometimes reasons
   in prose first (e.g. working out a per-serving-to-per-100g conversion) and puts
   the JSON object at the end. JSON.parse requires the whole string to be valid,
   so pull just the {...} substring out rather than assuming the text is clean. */
function extractJSONObject(text)
{
  let match = text.match(/\{[\s\S]*\}/);
  return match ? match[0] : text;
}

/* compact, human-readable view of an API response for the debug box — the raw
   response can run to 100+ KB dominated by opaque encrypted_content blobs from
   search results, which aren't useful for diagnosing a parse failure. */
function summarizeAPIResponse(data)
{
  let lines = [];
  let block;
  let result;

  if (!data || !Array.isArray(data.content)) return 'no content array in response:\n' + JSON.stringify(data, null, 2).slice(0, 2000);

  for (let i = 0; i < data.content.length; ++i)
  {
    block = data.content[i];

    if (block.type == 'text')
    {
      lines.push('[text]\n' + block.text);
    }
    else if (block.type == 'server_tool_use')
    {
      lines.push('[web_search query] ' + JSON.stringify(block.input));
    }
    else if (block.type == 'web_search_tool_result')
    {
      lines.push('[web_search_tool_result] ' + (Array.isArray(block.content) ? block.content.length : 0) + ' result(s):');
      if (Array.isArray(block.content))
      {
        for (let j = 0; j < block.content.length; ++j)
        {
          result = block.content[j];
          lines.push('  - ' + (result.title || '(no title)') + ' — ' + (result.url || ''));
        }
      }
    }
    else
    {
      lines.push('[' + block.type + ']');
    }
  }

  return lines.join('\n\n');
}

function fetchViaClaudeWebSearch(barcode, onResult)
{
  let prompt = 'Search the web (Open Food Facts, manufacturer sites, and nutrition databases) for the packaged food product with barcode/UPC "' + barcode + '". '
    + 'Find its protein and calories per 100g, and its name/brand if available. Do any reasoning or unit conversion silently — '
    + 'your entire reply must be ONLY the raw JSON object below, nothing before it and nothing after it, no markdown, no code fences, no explanation. '
    + 'Shape: {"found":true,"name":"...","brand":"...","protein_100g":<number or null>,"kcal_100g":<number or null>} '
    + 'or {"found":false} if you cannot find reliable data. Do not guess or estimate — only report numbers found from an actual source.';

  try
  {
    fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role:'user', content: prompt }],
        tools: [{ type:'web_search_20250305', name:'web_search' }]
      })
    }).then(function(resp)
    {
      return resp.json();
    }).then(function(data)
    {
      let text;
      let parsed;

      if (!data || !Array.isArray(data.content))
      {
        g_last_lookup_debug = 'unexpected response shape from api.anthropic.com:\n\n' + summarizeAPIResponse(data);
        onResult({ found:false, reason:'lookup unavailable — O.F.F. unreachable and the web-search fallback returned nothing usable (see debug box)' });
        return;
      }

      text = data.content.filter(function(block) { return block.type == 'text'; }).map(function(block) { return block.text; }).join('\n');
      text = text.replace(/```json|```/g, '').trim();

      try
      {
        parsed = JSON.parse(extractJSONObject(text));
      }
      catch (e)
      {
        g_last_lookup_debug = 'could not find a valid JSON object in the response:\n\n' + summarizeAPIResponse(data);
        onResult({ found:false, reason:'lookup unavailable — O.F.F. unreachable, web-search fallback returned an unparseable response (see debug box)' });
        return;
      }

      if (!parsed.found)
      {
        onResult({ found:false, reason:'not found on O.F.F. or via web search' });
        return;
      }

      onResult({
        found: true,
        source: 'ai_search',
        name: parsed.name || null,
        brand: parsed.brand || null,
        protein_100g: parsed.protein_100g != null ? parsed.protein_100g : null,
        kcal_100g: parsed.kcal_100g != null ? parsed.kcal_100g : null
      });
    }).catch(function(e)
    {
      onResult({ found:false, reason:'lookup failed — O.F.F. and the web-search fallback both failed (' + e.message + ')' });
    });
  }
  catch (e)
  {
    onResult({ found:false, reason:'lookup failed to start — ' + e.message });
  }
}

function formatOFFMatchStatus(result)
{
  let name_part = result.name ? 'matched: ' + result.name : 'matched (no product name on file)';

  if (result.source == 'ai_search')
  {
    return name_part + ' — found via web search, not O.F.F.\'s own database; verify against the label if precision matters. Values are editable.';
  }

  return name_part + ' — values are editable, O.F.F. data is label-rounded (~±10%)';
}

function doFetchOFF(key)
{
  let item = findScoopItem(key);
  let lookup_barcode;

  if (!item) return;

  lookup_barcode = g_fetch_barcode[key] || item.barcode;
  if (!lookup_barcode) return;

  g_fetch_pending[key] = false;
  g_fetch_status[key] = 'looking up… (may take longer if O.F.F. is unreachable and it falls back to a web search)';
  render();

  fetchOFFProduct(lookup_barcode, function(result)
  {
    if (!result.found)
    {
      g_fetch_status[key] = result.reason;
      render();
      return;
    }

    if (result.protein_100g != null) item.protein_100g = result.protein_100g;
    if (result.kcal_100g != null) item.kcal_100g = result.kcal_100g;
    recomputeItemMacrosFromDensity(item);
    if (g_edit_item_key == key && g_edit_draft)
    {
      setDraftMacrosFromDensity(g_edit_draft, result.protein_100g, result.kcal_100g);
      recomputeEditDraftMacros();
    }

    g_fetch_barcode[key] = null;
    g_fetch_status[key] = formatOFFMatchStatus(result);
    render();
    save();
  });
}

function buildDiaryText()
{
  let lines = [];
  let sorted = sortedScoopItems();
  let dates = Object.keys(g_log).sort();

  lines.push('PANTRY ITEMS');
  lines.push('');

  for (let i = 0; i < sorted.length; ++i)
  {
    let item = sorted[i];
    lines.push(item.name + (item.brand ? ' — ' + item.brand : '') + (item.barcode ? ' [' + item.barcode + ']' : ''));
    lines.push('  ' + formatVolume(item)
      + ' · ' + (item.scoop_g != null ? item.scoop_g + ' g' : '— g')
      + ' · ' + (item.protein_g != null ? item.protein_g + ' g protein' : '— g protein')
      + ' · ' + (item.kcal != null ? item.kcal + ' kcal' : '— kcal'));
  }

  lines.push('');
  lines.push('FOOD DIARY');
  lines.push('');

  if (!dates.length) lines.push('(no logged days yet)');

  for (let d = 0; d < dates.length; ++d)
  {
    let day = g_log[dates[d]] || [];
    let totals = dayTotals(dates[d]);
    lines.push(dates[d] + ' — ' + fmt0(totals.protein) + ' g protein / ' + fmt_1(totals.kcal) + ' kcal (target ' + g_target + ' g)');

    for (let i = 0; i < day.length; ++i)
    {
      let entry = day[i];
      let item = findScoopItem(entry.item_key);
      lines.push('  ' + (item ? item.name : (entry.item_key == 'custom' ? 'Custom' : entry.item_key))
        + (entry.grams != null ? ' (' + entry.grams + ' g' + (entry.scale != null && entry.scale != 1 ? ', ' + entry.scale.toFixed(2) + '×' : '') + ')' : '')
        + (entry.protein_g != null ? ' — ' + fmt0(entry.protein_g) + ' g' : '')
        + (entry.kcal != null ? ' / ' + fmt_1(entry.kcal) + ' kcal' : ''));
    }

    lines.push('');
  }

  return lines.join('\n');
}

function buildExportJSON()
{
  return JSON.stringify(makeSavePayload(), null, 2);
}

function parseImportText()
{
  let parsed;

  g_import_pending = null;

  if (!g_import_text.trim())
  {
    g_import_status = 'paste JSON or choose a file first';
    render();
    return;
  }

  try
  {
    parsed = JSON.parse(g_import_text);
  }
  catch (e)
  {
    g_import_status = 'not valid JSON — ' + e.message;
    render();
    return;
  }

  if (!parsed || typeof parsed != 'object' || !Array.isArray(parsed.foods) || !Array.isArray(parsed.scoop_items))
  {
    g_import_status = 'this doesn\'t look like a protein-loadout export — missing foods/scoop_items';
    render();
    return;
  }

  g_import_pending = parsed;
  g_import_status = 'ready to import: ' + parsed.foods.length + ' loadout foods, ' + parsed.scoop_items.length + ' pantry items, '
    + Object.keys(parsed.log || {}).length + ' logged day(s). This will replace everything currently in the app.';
  render();
}

function applyImport()
{
  let parsed = g_import_pending;

  if (!parsed) return;

  if (parsed.target != null)
  {
    g_target = parsed.target;
    g_target_raw = String(g_target);
  }

  if (parsed.bodyweight_kg != null)
  {
    g_bodyweight_kg = parsed.bodyweight_kg;
  }

  g_bodyweight_by_date = {};
  if (parsed.bodyweight_by_date && typeof parsed.bodyweight_by_date == 'object') g_bodyweight_by_date = parsed.bodyweight_by_date;
  else g_bodyweight_by_date[todayISO()] = g_bodyweight_kg;
  clearBodyweightDirtyDates();

  if (Array.isArray(parsed.foods))
  {
    g_foods = parsed.foods;
    for (let i = 0; i < g_foods.length; ++i)
    {
      g_foods[i].daily_raw = g_foods[i].daily != null ? String(g_foods[i].daily) : '0';
      g_foods[i].price_raw = g_foods[i].price != null ? String(g_foods[i].price) : '';
      if (g_foods[i].package_units != null) g_foods[i].package_units_raw = String(g_foods[i].package_units);
    }
  }

  if (Array.isArray(parsed.scoop_items))
  {
    g_scoop_items = parsed.scoop_items;
    for (let i = 0; i < g_scoop_items.length; ++i)
    {
      g_scoop_items[i].scoop_g_raw = g_scoop_items[i].scoop_g != null ? String(g_scoop_items[i].scoop_g) : '';
      g_scoop_items[i].protein_g_raw = g_scoop_items[i].protein_g != null ? String(g_scoop_items[i].protein_g) : '';
      g_scoop_items[i].kcal_raw = g_scoop_items[i].kcal != null ? String(g_scoop_items[i].kcal) : '';
    }
  }

  if (parsed.log && typeof parsed.log == 'object') g_log = parsed.log;
  g_deleted_log_entry_ids = {};
  if (parsed.deleted_log_entry_ids && typeof parsed.deleted_log_entry_ids == 'object') g_deleted_log_entry_ids = parsed.deleted_log_entry_ids;
  if (parsed.collapsed_groups && typeof parsed.collapsed_groups == 'object') g_collapsed_groups = parsed.collapsed_groups;

  mergeKnownItems(); /* pick up any known items added to this tool since the backup was made */
  migrateLogFormat();
  migrateTagsFormat();
  pruneDeletedLogEntries();

  g_import_pending = null;
  g_import_text = '';
  g_import_status = 'imported ✓';
  g_import_open = false;
  render();
  save();
}

function cancelImport()
{
  g_import_pending = null;
  g_import_status = '';
  render();
}

function readImportFile(file)
{
  let reader = new FileReader();

  reader.onload = function()
  {
    g_import_text = String(reader.result || '');
    parseImportText();
  };
  reader.onerror = function()
  {
    g_import_status = 'could not read that file';
    render();
  };

  reader.readAsText(file);
}

function copyText(text)
{
  function fallback()
  {
    let temp = document.createElement('textarea');
    temp.value = text;
    temp.style.position = 'fixed';
    temp.style.opacity = '0';
    document.body.appendChild(temp);
    temp.focus();
    temp.select();

    try
    {
      document.execCommand('copy');
      g_copy_status = 'copied ✓';
    }
    catch (e)
    {
      g_copy_status = 'copy failed — select the text manually';
    }

    document.body.removeChild(temp);
    render();
  }

  if (navigator.clipboard && navigator.clipboard.writeText)
  {
    navigator.clipboard.writeText(text).then(function()
    {
      g_copy_status = 'copied ✓';
      render();
    }, fallback);
    return;
  }

  fallback();
}

function downloadText(filename, mime, text)
{
  let blob = new Blob([text], { type:mime });
  let link = document.createElement('a');

  link.href = URL.createObjectURL(blob);
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(function()
  {
    URL.revokeObjectURL(link.href);
  }, 4000);
}

function fmt0(n)
{
  return n.toFixed(0);
}

function fmt1(n)
{
  return n.toFixed(1);
}

function fmt2(n)
{
  return n.toFixed(2);
}

function fmt_1(n)
{
  return (Math.ceil(n/10)*10).toFixed(0);
}

function makeSavePayload()
{
  return {
    target:g_target,
    bodyweight_kg:g_bodyweight_kg,
    bodyweight_by_date:g_bodyweight_by_date,
    foods:g_foods,
    scoop_items:g_scoop_items,
    log:g_log,
    deleted_log_entry_ids:g_deleted_log_entry_ids,
    collapsed_groups:g_collapsed_groups
  };
}

function storagePayloadFromValue(value)
{
  if (!value) return null;
  if (typeof value == 'string') return JSON.parse(value);
  return value;
}

function updateSyncChrome()
{
  let node;

  if (!document.body) return;

  document.body.classList.toggle('sync-failed', g_sync_failed);
  node = document.getElementById('sync-status');

  if (!g_sync_failed)
  {
    if (node) node.remove();
    return;
  }

  if (!node)
  {
    node = document.createElement('div');
    node.id = 'sync-status';
    node.className = 'sync-status';
    document.body.appendChild(node);
  }

  node.textContent = g_sync_status || 'local only / sync failed';
}

function setSyncFailed(status)
{
  g_sync_failed = true;
  g_sync_status = status || 'local only / sync failed';
  updateSyncChrome();
}

function setSyncOk()
{
  g_sync_failed = false;
  g_sync_status = '';
  updateSyncChrome();
}

function markDeletedLogEntry(entry)
{
  if (entry && entry.id) g_deleted_log_entry_ids[entry.id] = true;
}

function bodyweightForDate(date)
{
  if (g_bodyweight_by_date[date] != null) return g_bodyweight_by_date[date];
  return g_bodyweight_kg;
}

function bodyweightRawForDate(date)
{
  if (g_bodyweight_raw_by_date[date] != null) return g_bodyweight_raw_by_date[date];
  return bodyweightForDate(date).toFixed(1);
}

function setBodyweightForDate(date, kg, raw)
{
  if (date == todayISO()) g_bodyweight_kg = kg;
  g_bodyweight_by_date[date] = kg;
  g_bodyweight_raw_by_date[date] = raw;
  g_bodyweight_dirty_dates[date] = true;
}

function mergeBodyweightByDate(remote_bodyweight_by_date)
{
  if (!remote_bodyweight_by_date || typeof remote_bodyweight_by_date != 'object') return;

  for (let date in remote_bodyweight_by_date)
  {
    if (g_bodyweight_dirty_dates[date]) continue;
    if (remote_bodyweight_by_date[date] == null) continue;

    g_bodyweight_by_date[date] = remote_bodyweight_by_date[date];
    delete g_bodyweight_raw_by_date[date];
    if (date == todayISO()) g_bodyweight_kg = remote_bodyweight_by_date[date];
  }
}

function clearBodyweightDirtyDates()
{
  g_bodyweight_dirty_dates = {};
  g_bodyweight_raw_by_date = {};
}

function mergeDeletedLogEntryIds(ids)
{
  if (!ids || typeof ids != 'object') return;

  for (let id in ids)
  {
    if (ids[id]) g_deleted_log_entry_ids[id] = true;
  }
}

function pruneDeletedLogEntries()
{
  for (let date in g_log)
  {
    let day = g_log[date];
    if (!Array.isArray(day)) continue;

    for (let i = day.length - 1; i >= 0; --i)
    {
      if (day[i].id && g_deleted_log_entry_ids[day[i].id]) day.splice(i, 1);
    }
  }
}

function mergeLogEntries(remote_log)
{
  if (!remote_log || typeof remote_log != 'object') return;

  pruneDeletedLogEntries();

  for (let date in remote_log)
  {
    let remote_day = remote_log[date];
    let local_day = g_log[date];
    let local_ids = {};

    if (!Array.isArray(remote_day)) continue;

    if (!Array.isArray(local_day))
    {
      local_day = [];
      g_log[date] = local_day;
    }

    for (let i = 0; i < local_day.length; ++i)
    {
      if (local_day[i].id) local_ids[local_day[i].id] = true;
    }

    for (let i = 0; i < remote_day.length; ++i)
    {
      let entry = remote_day[i];
      if (!entry.id) continue;
      if (g_deleted_log_entry_ids[entry.id]) continue;
      if (local_ids[entry.id]) continue;

      local_day.push(entry);
      local_ids[entry.id] = true;
    }
  }
}

function mergeLoadedPayload(payload)
{
  if (!payload || typeof payload != 'object') return;

  if (payload.bodyweight_kg != null && !g_bodyweight_dirty_dates[todayISO()])
  {
    g_bodyweight_kg = payload.bodyweight_kg;
  }

  mergeBodyweightByDate(payload.bodyweight_by_date);

  mergeDeletedLogEntryIds(payload.deleted_log_entry_ids);
  mergeLogEntries(payload.log);
  pruneDeletedLogEntries();
}

function saveLocalJson(json_text)
{
  try
  {
    localStorage.setItem(g_storage_key, json_text);
  }
  catch (e)
  {}
}

function save()
{
  let payload = makeSavePayload();
  let json_text = JSON.stringify(payload);

  saveLocalJson(json_text);

  if (window.storage && window.storage.set)
  {
    if (window.storage.get)
    {
      window.storage.get(g_storage_key).then(function(result)
      {
        let merged_json_text;

        if (result && result.value) mergeLoadedPayload(storagePayloadFromValue(result.value));
        merged_json_text = JSON.stringify(makeSavePayload());
        saveLocalJson(merged_json_text);
        window.storage.set(g_storage_key, merged_json_text).then(function()
        {
          clearBodyweightDirtyDates();
          setSyncOk();
        }).catch(function()
        {
          setSyncFailed('local only / sync failed');
        });
      }, function()
      {
        setSyncFailed('local only / sync failed');
      });
      return;
    }

    window.storage.set(g_storage_key, json_text).then(function()
    {
      clearBodyweightDirtyDates();
      setSyncOk();
    }).catch(function()
    {
      setSyncFailed('local only / sync failed');
    });
    return;
  }

  setSyncFailed('local only / shared storage unavailable');
}

function load()
{
  function applyLoaded(payload)
  {

    if (!payload) return;
    if (payload.target != null)
    {
      g_target = payload.target;
      g_target_raw = String(g_target);
    }

    if (payload.bodyweight_kg != null)
    {
      g_bodyweight_kg = payload.bodyweight_kg;
    }

    if (payload.bodyweight_by_date && typeof payload.bodyweight_by_date == 'object') g_bodyweight_by_date = payload.bodyweight_by_date;
    else g_bodyweight_by_date[todayISO()] = g_bodyweight_kg;
    clearBodyweightDirtyDates();

    for (let i = 0; i < payload.foods.length; ++i)
    {
      for (let j = 0; j < g_foods.length; ++j)
      {
        if (g_foods[j].key == payload.foods[i].key)
        {
          g_foods[j].daily = payload.foods[i].daily;
          g_foods[j].price = payload.foods[i].price;
          g_foods[j].daily_raw = String(g_foods[j].daily);
          g_foods[j].price_raw = g_foods[j].price != null ? String(g_foods[j].price) : '';
          if (payload.foods[i].package_units != null)
          {
            g_foods[j].package_units = payload.foods[i].package_units;
            g_foods[j].package_units_raw = String(g_foods[j].package_units);
          }
        }
      }
    }

    if (payload.scoop_items)
    {
      g_scoop_items = payload.scoop_items;

      for (let i = 0; i < g_scoop_items.length; ++i)
      {
        g_scoop_items[i].scoop_g_raw = g_scoop_items[i].scoop_g != null ? String(g_scoop_items[i].scoop_g) : '';
        g_scoop_items[i].protein_g_raw = g_scoop_items[i].protein_g != null ? String(g_scoop_items[i].protein_g) : '';
        g_scoop_items[i].kcal_raw = g_scoop_items[i].kcal != null ? String(g_scoop_items[i].kcal) : '';
      }
    }

    if (payload.log) g_log = payload.log;
    if (payload.deleted_log_entry_ids && typeof payload.deleted_log_entry_ids == 'object') g_deleted_log_entry_ids = payload.deleted_log_entry_ids;
    if (payload.collapsed_groups) g_collapsed_groups = payload.collapsed_groups;
  }

  function readLocal()
  {
    let stored_value;

    try
    {
      stored_value = localStorage.getItem(g_storage_key);
      return stored_value ? JSON.parse(stored_value) : null;
    }
    catch (e)
    {
      return null;
    }
  }

  function applyStorageValue(value)
  {
    applyLoaded(storagePayloadFromValue(value));
  }

  function saveMergedLoad()
  {
    let json_text = JSON.stringify(makeSavePayload());

    saveLocalJson(json_text);

    if (!window.storage || !window.storage.set)
    {
      setSyncFailed('local only / shared storage unavailable');
      return;
    }

    window.storage.set(g_storage_key, json_text).then(function()
    {
      clearBodyweightDirtyDates();
      setSyncOk();
    }).catch(function()
    {
      setSyncFailed('local only / sync failed');
    });
  }

  function finishLoad()
  {
    mergeKnownItems();
    migrateLogFormat();
    migrateTagsFormat();
    pruneDeletedLogEntries();
    render();
  }

  if (window.storage && window.storage.get)
  {
    window.storage.get(g_storage_key).then(function(result)
    {
      let local_payload = readLocal();

      if (result && result.value)
      {
        applyStorageValue(result.value);
        mergeLoadedPayload(local_payload);
      }
      else
      {
        applyLoaded(local_payload);
      }

      finishLoad();
      saveMergedLoad();
    }, function()
    {
      setSyncFailed('local only / sync failed');
      applyLoaded(readLocal());
      finishLoad();
    }).catch(function(error)
    {
      renderStartupError('Could not load protein data', error);
    });
    return;
  }

  applyLoaded(readLocal());
  finishLoad();
  setSyncFailed('local only / shared storage unavailable');
}

function renderProteinKgScale(logged_protein)
{
  let scale_min = 1.2;
  let scale_max = 1.8;
  let scale_target = 1.666;
  let bodyweight_kg = bodyweightForDate(g_view_date);
  let bodyweight_raw = bodyweightRawForDate(g_view_date);
  let {mean_protein, mean_kcal, mean_bodyweight_kg} = calculateMeanLoggedProtein(g_view_date, 7);
  let ratio = bodyweight_kg > 0 ? logged_protein/bodyweight_kg : 0;
  let ratio_text = bodyweight_kg > 0 ? fmt2(ratio) : '—';
  let mean_ratio_text = bodyweight_kg > 0 ? fmt2(mean_protein/bodyweight_kg) : '—';
  let mean_protein_text = fmt0(mean_protein);
  let mean_kcal_text = fmt_1(mean_kcal);
  let mean_bodyweight_text = fmt1(mean_bodyweight_kg);
  let marker_pct = (ratio - scale_min)/(scale_max - scale_min)*100;
  let marker_clamped = Math.max(0.0, Math.min(100.0, marker_pct));
  let range_class = ratio < scale_min ? ' under' : ratio > scale_target ? ' over' : '';
  let marker_transform = '';
  if ((ratio < scale_min) || (ratio > scale_max))
  {
    marker_transform = `; transform: translateX(${(marker_pct - 50).toFixed()}%)`;
  }
  let h = '';

  h += `<div class="protein-kg-scale${range_class}">
    <div class="protein-kg-scale-head">
      <span>protein/bodyweight</span>
      <span class="protein-kg-controls">
        <label>kg</label>
        <input type="text" inputmode="decimal" id="bodyweight-input" value="${bodyweight_raw}">
        <strong>${ratio_text} g/kg</strong>
      </span>
    </div>
    <div class="protein-kg-track">
      <span class="protein-kg-marker${range_class}" style="left:${marker_clamped}%${marker_transform}"></span>
      <span class="protein-kg-tick" style="left:0%"><i></i><b>1.2</b></span>
      <span class="protein-kg-tick" style="left:33.333%"><i></i><b>1.4</b></span>
      <span class="protein-kg-tick" style="left:66.667%"><i></i><b>1.6</b></span>
      <span class="protein-kg-tick" style="left:100%"><i></i><b>1.8</b></span>
    </div>
    <span class="protein-kg-note"><p>Weekly averages:</p>
      <span class="protein-kg-note-protein">${mean_protein_text}</span>
      <span>(${mean_ratio_text} g/kg)</span>
      <span class="protein-kg-note-kcal">${mean_kcal_text}</span>
      <span>(${fmt1(mean_kcal/mean_protein)} kcal/g)</span>
      <span class="protein-kg-note-bodyweight">${mean_bodyweight_text} kg</span>
    </span>
  </div>`;

  return h;
}

function renderLoadoutSection()
{

  let diff_class = diff >= 0 ? 'over' : 'under';

  h += `<div class="summary">
    <div class="cell"><div class="lab">total protein</div><div class="val">${fmt1(total)} g</div></div>
    <div class="cell"><div class="lab">${diff_label}</div><div class="val ${diff_class}">${diff_sign}${fmt1(diff)} g</div></div>
    <div class="cell"><div class="lab">est. monthly cost</div><div class="val">${cost_text}</div></div>
  </div>`;

  h += `<table><thead><tr>

    let weekly = weeklyAmount(food);
    let packs = packagesPerWeek(food);
    let unit_label = food.kind == 'unit' ? fmt1(per_gram*food.unit_grams) + ' g protein/egg' : fmt1(per_gram*100) + ' g protein/100g';
    let daily_unit = food.kind == 'unit' ? 'eggs' : 'g';
    let weekly_text;
    let package_units_cell;
    let price_cell;

    if (food.no_package)
    {
      weekly_text = fmt1(weekly) + ' g/wk';
    }
    else if (packs != null)
    {
      weekly_text = fmt2(packs) + ' pkg/wk';
    }
    else
    {
      weekly_text = fmt1(weekly) + ' ' + (food.kind == 'unit' ? 'eggs/wk' : 'g/wk');
    }

    if (food.package_units != null)
    {
      package_units_cell = `<input type="text" inputmode="decimal" data-key="${food.key}" data-field="units" value="${food.package_units_raw}">`;
    }
    else
    {
      package_units_cell = '<span class="pack-out">—</span>';
    }

    if (!food.no_package)
    {
      price_cell = `<input type="text" inputmode="decimal" data-key="${food.key}" data-field="price" value="${food.price_raw}" placeholder="—">`;
    }
    else
    {
      price_cell = '<span class="pack-out">—</span>';
    }

    h += `<tr class="food">
      <td><span class="foodname">${food.name}<span class="unit">${unit_label}</span></span></td>
      <td class="num"><input type="text" inputmode="decimal" data-key="${food.key}" data-field="daily" value="${food.daily_raw}"> ${daily_unit}</td>

      <td class="num pack-out">${weekly_text}</td>
      <td class="num">${package_units_cell}</td>
      <td class="num pack">${price_cell}</td>
    </tr>`;
  }

  h += `</tbody></table>`;

  h += `<div class="note">Package sizes and protein content are fixed per your on-hand packaging. Edit daily amount (grams, or eggs for eggs) and package price to update totals. Data persists locally.</div>`;

  return h;
}

function renderGroupedItems(is_today)
{
  let h = '';
  let flat;

  if (g_flatten_view)
  {
    flat = sortedScoopItems().map(function(item)
    {
      return { item:item, sortname:(itemMatchesSearch(item) ? '0_' : '1_') + (tagsMatchActive(itemTags(item)) ? '0_' : '1_') + item.name.toLowerCase() };
    });

    flat.sort(function(a, b)
    {
      return a.sortname < b.sortname ? -1 : a.sortname > b.sortname ? 1 : 0;
    });

    for (let i = 0; i < flat.length; ++i) h += renderItemRow(flat[i].item, is_today, false, 'standalone');
    return h;
  }

  let nodes = groupedNodes();

  for (let i = 0; i < nodes.length; ++i)
  {
    let n = nodes[i];
    if (n.type == 'item')
    {
      h += renderItemRow(n.item, is_today, false, 'standalone');
      continue;
    }

    h += renderGroupHeader(n.group);
    if (!g_collapsed_groups[n.group.key])
    {
      let members = sortedGroupMembersForDisplay(n.group);
      for (let j = 0; j < members.length; ++j) h += renderItemRow(members[j], is_today, true, n.group.key);
    }
  }

  return h;
}

{
  let new_name = g_group_rename_draft.trim();
  let new_key;

  if (!new_name) return;

  new_key = new_name.toLowerCase();

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let tags = itemTags(g_scoop_items[i]);
    for (let j = 0; j < tags.length; ++j)
    {
      if (tags[j].toLowerCase() == g_group_rename_key) tags[j] = new_name;
    }
    g_scoop_items[i].tags = tags;
  }

  if (new_key != g_group_rename_key && g_collapsed_groups[g_group_rename_key] != null)
  {
    g_collapsed_groups[new_key] = g_collapsed_groups[g_group_rename_key];

  }

  g_group_rename_key = null;
  g_group_rename_draft = '';
  render();
  save();
}

function calculateMeanLoggedProtein(start_date, ndays)
{
  let total_protein = 0;
  let total_kcal = 0;
  let total_bodyweight_kg = 0;
  let protein_days = 0;
  let kcal_days = 0;
  let bodyweight_days = 0;
  let result = {mean_protein: 0, mean_kcal: 0, mean_bodyweight_kg: 0};

  for (let d = 0; d < ndays; ++d)
  {
    let date = shiftDateISO(start_date, -d);
    let day_totals = dayTotals(date);
    let bodyweight_kg = bodyweightForDate(date);

    let protein = day_totals.protein;
    total_protein += protein;
    protein_days += protein > 0;

    let kcal = day_totals.kcal;
    total_kcal += kcal;
    kcal_days += kcal > 0;

    total_bodyweight_kg += bodyweight_kg;
    bodyweight_days += bodyweight_kg > 0;
  }

  if (protein_days) { result.mean_protein = total_protein/protein_days; }
  if (kcal_days) { result.mean_kcal = total_kcal/kcal_days; }
  if (bodyweight_days) { result.mean_bodyweight_kg = total_bodyweight_kg/bodyweight_days; }

  return result;
}

function renderPreservingFocus()
{
  let active = document.activeElement;
  let key = active && active.dataset ? active.dataset.key : null;
  let field = active && active.dataset ? active.dataset.field : null;
  let scoop_key = active && active.dataset ? active.dataset.scoop : null;
  let scaledraft_field = active && active.dataset ? active.dataset.scaledraft : null;
  let custom_field = active && active.dataset ? active.dataset.custom : null;
  let grouprename_field = active && active.dataset ? active.dataset.grouprename : null;
  let adddraft_field = active && active.dataset ? active.dataset.adddraft : null;
  let editdraft_field = active && active.dataset ? active.dataset.editdraft : null;
  let lognote_id = active && active.dataset ? active.dataset.lognote : null;
  let id = active ? active.id : null;
  let sel_start = active && active.selectionStart != null ? active.selectionStart : null;
  let sel_end = active && active.selectionEnd != null ? active.selectionEnd : null;
  let restored;

  render();

  if (id) restored = document.getElementById(id);
  else if (key && field) restored = document.querySelector('[data-key="'+key+'"][data-field="'+field+'"]');
  else if (scoop_key && field) restored = document.querySelector('[data-scoop="'+scoop_key+'"][data-field="'+field+'"]');
  else if (scaledraft_field) restored = document.querySelector('[data-scaledraft="'+scaledraft_field+'"]');
  else if (custom_field) restored = document.querySelector('[data-custom="'+custom_field+'"]');
  else if (grouprename_field) restored = document.querySelector('[data-grouprename]');
  else if (adddraft_field) restored = document.querySelector('[data-adddraft="'+adddraft_field+'"]');
  else if (editdraft_field) restored = document.querySelector('[data-editdraft="'+editdraft_field+'"]');
  else if (lognote_id) restored = document.querySelector('[data-lognote="'+lognote_id+'"]');
  else restored = null;

  if (!restored) return;

  restored.focus();
  if (sel_start != null) restored.setSelectionRange(sel_start, sel_end);
}

document.addEventListener('input', function(ev)
{
  let target = ev.target;
  let num;

  if (target.dataset && target.dataset.lognote)
  {
    let day = g_log[g_view_date] || [];
    for (let i = 0; i < day.length; ++i)
    {
      if (day[i].id == target.dataset.lognote)
      {
        day[i].note = target.value;
        break;
      }
    }
    renderPreservingFocus();
    save();
    return;
  }

  if (target.id == 'scoop-search')
  {
    g_scoop_search_raw = target.value;
    renderPreservingFocus();
    return;
  }

  if (target.id == 'target-input')
  {
    g_target_raw = target.value;
    num = parseFloat(target.value);
    g_target = isNaN(num) ? 0 : num;
    renderPreservingFocus();
    save();
    return;
  }

  if (target.id == 'bodyweight-input')
  {
    num = parseFloat(target.value);
    setBodyweightForDate(g_view_date, isNaN(num) ? 0 : num, target.value);
    renderPreservingFocus();
    save();
    return;
  }

  if (target.dataset.field == 'import-text')
  {
    g_import_text = target.value;
    g_import_pending = null;
    return;
  }

  let scoop_key = target.dataset.scaledraft;
  if (scoop_key && g_scale_draft)
  {
    if (scoop_key == 'scale')
    {
      liveScalePreview(parseFloat(target.value));
      return;
    }
    if (scoop_key == 'grams')
    {
      g_scale_draft.grams_raw = target.value;
      recomputeScaleDraft('grams');
      renderPreservingFocus();
      return;
    }
    if (scoop_key == 'protein_g')
    {
      g_scale_draft.protein_g_raw = target.value;
      num = parseFloat(target.value);
      g_scale_draft.protein_g = isNaN(num) ? null : num;
      return;
    }
    if (scoop_key == 'kcal')
    {
      g_scale_draft.kcal_raw = target.value;
      num = parseFloat(target.value);
      g_scale_draft.kcal = isNaN(num) ? null : num;
      return;
    }
  }

  if (target.dataset.custom == 'protein')
  {
    let old_num = parseFloat(g_custom_protein_raw);
    let old_estimate = !isNaN(old_num) && old_num > 0 ? String(customKcalEstimate(old_num)) : '';
    let new_num;

    g_custom_protein_raw = target.value;
    new_num = parseFloat(g_custom_protein_raw);
    if (!g_custom_kcal_raw || g_custom_kcal_raw == old_estimate)
    {
      g_custom_kcal_raw = !isNaN(new_num) && new_num > 0 ? String(customKcalEstimate(new_num)) : '';
    }
    g_custom_status = '';
    renderPreservingFocus();
    return;
  }

  if (target.dataset.custom == 'kcal')
  {
    g_custom_kcal_raw = target.value;
    g_custom_status = '';
    return;
  }

  if (target.dataset.grouprename)
  {
    g_group_rename_draft = target.value;
    renderPreservingFocus();
    return;
  }

  let adddraft_field = target.dataset.adddraft;
  if (adddraft_field)
  {
    g_scoop_add_draft[adddraft_field] = target.value;
    renderPreservingFocus();
    return;
  }

  if (target.dataset.editdraft == 'tags' && g_edit_draft)
  {
    g_edit_draft.tags = target.value;
    updateTagSuggestions(target);
    return;
  }

  let editdraft_field = target.dataset.editdraft;
  if (editdraft_field)
  {
    g_edit_draft[editdraft_field] = target.value;
    if (editdraft_field == 'volume') return;
    if (editdraft_field == 'scoop_g' || editdraft_field == 'macro_protein' || editdraft_field == 'macro_kcal') recomputeEditDraftMacros();
    renderPreservingFocus();
    return;
  }

  let key = target.dataset.key;
  let field = target.dataset.field;
  if (!key) return;

  for (let i = 0; i < g_foods.length; ++i)
  {
    if (g_foods[i].key != key) continue;
    let food = g_foods[i];

    num = parseFloat(target.value);
    if (field == 'daily')
    {
      food.daily_raw = target.value;
      food.daily = isNaN(num) ? 0 : num;
    }
    if (field == 'price')
    {
      food.price_raw = target.value;
      food.price = target.value.trim() == '' ? null : (isNaN(num) ? null : num);
    }
    if (field == 'units')
    {
      food.package_units_raw = target.value;
      food.package_units = isNaN(num) ? 0 : num;
    }
  }

  renderPreservingFocus();
  save();
});

document.addEventListener('click', function(ev)
{
  let target = ev.target.closest('[data-a]');
  let action;
  let defs;

  if (!target) return;
  action = target.dataset.a;

  switch (action)
  {
    case 'tab-open':
      g_active_tab = target.dataset.tab == 'loadout' ? 'loadout' : 'pantry';
      render();
      return;

    case 'reset':
      defs = defaults();
      for (let i = 0; i < g_foods.length; ++i)
      {
        for (let j = 0; j < defs.length; ++j)
        {
          if (g_foods[i].key != defs[j].key) continue;
          g_foods[i].daily = defs[j].daily;
          g_foods[i].price = defs[j].price;
          g_foods[i].daily_raw = String(g_foods[i].daily);
          g_foods[i].price_raw = g_foods[i].price != null ? String(g_foods[i].price) : '';
          if (defs[j].package_units != null)
          {
            g_foods[i].package_units = defs[j].package_units;
            g_foods[i].package_units_raw = String(g_foods[i].package_units);
          }
        }
      }
      g_target = 128;
      g_target_raw = '128';
      g_bodyweight_kg = 82;
      g_bodyweight_by_date[todayISO()] = g_bodyweight_kg;
      g_bodyweight_dirty_dates[todayISO()] = true;
      render();
      save();
      return;

    case 'date-prev':
      g_view_date = shiftDateISO(g_view_date, -1);
      render();
      return;

    case 'date-next':
      if (g_view_date >= todayISO()) return;
      g_view_date = shiftDateISO(g_view_date, 1);
      render();
      return;

    case 'date-today':
      g_view_date = todayISO();
      render();
      return;

    case 'adjusted-log-toggle':
      g_adjusted_log_open = !g_adjusted_log_open;
      render();
      return;

    case 'logged-food-details-toggle':
      g_logged_food_details_open = !g_logged_food_details_open;
      render();
      return;

    case 'logged-foods-toggle':
      g_logged_foods_open = !g_logged_foods_open;
      render();
      return;

    case 'scoop-add':
      if (g_view_date != todayISO()) return;
      addScoop(target.dataset.key);
      render();
      save();
      return;

    case 'scoop-remove':
      if (g_view_date != todayISO()) return;
      removeScoop(target.dataset.key);
      render();
      save();
      return;

    case 'scoop-fetch':
      requestFetchOFF(target.dataset.key, target.dataset.context, g_edit_draft ? g_edit_draft.barcode : null);
      return;

    case 'scoop-fetch-confirm':
      doFetchOFF(target.dataset.key);
      return;

    case 'scoop-fetch-cancel':
      cancelFetchOFF(target.dataset.key);
      return;

    case 'scoop-add-item-open':
      g_scoop_add_draft = { barcode:'', name:'', brand:'', scoop_g:'', macro_mode:'100g', macro_protein:'', macro_kcal:'' };
      g_add_item_status = '';
      render();
      return;

    case 'scoop-add-item-cancel':
      g_scoop_add_draft = null;
      render();
      return;

    case 'scoop-add-item-save':
      saveAddItemDraft();
      return;

    case 'addex-lookup-off':
      lookupOFFForAddItem();
      return;

    case 'add-macro-mode':
      switchDraftMacroMode(g_scoop_add_draft, target.dataset.mode);
      render();
      return;

    case 'edit-macro-mode':
      switchDraftMacroMode(g_edit_draft, target.dataset.mode);
      render();
      return;

    case 'scoop-edit-open':
      openScoopEdit(target.dataset.key, target.dataset.context);
      return;

    case 'scoop-edit-cancel':
      cancelScoopEdit();
      return;

    case 'scoop-edit-save':
      saveScoopEdit();
      return;

    case 'scoop-scale-open':
      openScaleEdit(target.dataset.key, target.dataset.context);
      return;

    case 'scoop-scale-close':
      closeScaleEdit();
      return;

    case 'scoop-scale-reset':
      resetScaleDraft();
      render();
      return;

    case 'scoop-scale-log':
      logScaledEntry();
      return;

    case 'scoop-entry-delete':
      removeLogEntry(target.dataset.entry);
      render();
      save();
      return;

    case 'custom-log':
      logCustomEntry();
      return;

    case 'custom-remove':
      if (g_view_date != todayISO()) return;
      removeScoop('custom');
      render();
      save();
      return;

    case 'group-toggle':
      toggleGroupCollapse(target.dataset.group);
      return;

    case 'group-rename-open':
      openGroupRename(target.dataset.group, target.dataset.name);
      return;

    case 'group-rename-cancel':
      cancelGroupRename();
      return;

    case 'group-rename-save':
      saveGroupRename();
      return;

    case 'tag-suggest-pick':
      pickTagSuggestion(target.dataset.tag);
      return;

    case 'tag-filter-toggle':
      if (g_active_tags[target.dataset.tag]) delete g_active_tags[target.dataset.tag];
      else g_active_tags[target.dataset.tag] = true;
      render();
      return;

    case 'lookup-debug-clear':
      g_last_lookup_debug = null;
      render();
      return;

    case 'flatten-toggle':
      toggleFlattenView();
      return;

    case 'print-scoop':
      try
      {
        window.print();
        g_print_status = 'print dialog requested. If nothing opened, this preview may be blocking it — open the downloaded file directly in a browser tab, or use "export data" below.';
      }
      catch (e)
      {
        g_print_status = 'print blocked — ' + e.message + '. Use "export data" below instead.';
      }
      render();
      return;

    case 'export-toggle':
      g_export_open = !g_export_open;
      g_copy_status = '';
      render();
      return;

    case 'export-fmt':
      g_export_fmt = target.dataset.f;
      render();
      return;

    case 'export-copy':
      copyText(g_export_fmt == 'json' ? buildExportJSON() : buildDiaryText());
      return;

    case 'export-download':
      if (g_export_fmt == 'json') downloadText('protein-loadout-export-' + todayISO() + '.json', 'application/json', buildExportJSON());
      else downloadText('protein-loadout-export-' + todayISO() + '.txt', 'text/plain', buildDiaryText());
      return;

    case 'import-toggle':
      g_import_open = !g_import_open;
      g_import_pending = null;
      g_import_status = '';
      render();
      return;

    case 'import-parse':
      parseImportText();
      return;

    case 'import-confirm':
      applyImport();
      return;

    case 'import-cancel':
      cancelImport();
      return;
  }
});

window.addEventListener('error', function(event)
{
  renderBlankStartupError('Could not start protein_loadout', event.error || event.message);
});

window.addEventListener('unhandledrejection', function(event)
{
  renderBlankStartupError('Could not finish loading protein_loadout', event.reason);
});

load();
</script>
</body>
</html>
