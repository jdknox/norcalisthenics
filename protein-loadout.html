    mass_events:g_mass_events,
    deleted_mass_event_ids:g_deleted_mass_event_ids,
    collapsed_groups:g_collapsed_groups
  };
}

function storagePayloadFromValue(value)
{
  if (!value) return null;
  if (typeof value == 'string') return JSON.parse(value);
  return value;
}

function updateSyncChrome()
{
  let node;

  if (!document.body) return;

  document.body.classList.toggle('sync-failed', g_sync_failed);
  node = document.getElementById('sync-status');

  if (!g_sync_failed)
  {
    if (node) node.remove();
    return;
  }

  if (!node)
  {
    node = document.createElement('div');
    node.id = 'sync-status';
    node.className = 'sync-status';
    document.body.appendChild(node);
  }

  node.textContent = g_sync_status || 'local only / sync failed';
}

function setSyncFailed(status)
{
  g_sync_failed = true;
  g_sync_status = status || 'local only / sync failed';
  updateSyncChrome();
}

function setSyncOk()
{
  g_sync_failed = false;
  g_sync_status = '';
  g_unsynced_changes = false;
  saveUnsyncedFlag(false);
  updateSyncChrome();
}

function markDeletedLogEntry(entry)
{
  if (entry && entry.id) g_deleted_log_entry_ids[entry.id] = true;
}

function bodyweightForDate(date)
{
  if (g_bodyweight_by_date[date] != null) return g_bodyweight_by_date[date];
  return g_bodyweight_kg;
}

function bodyweightRawForDate(date)
{
  if (g_bodyweight_raw_by_date[date] != null) return g_bodyweight_raw_by_date[date];
  return bodyweightForDate(date).toFixed(1);
}

function setBodyweightForDate(date, kg, raw)
{
  if (date == todayISO()) g_bodyweight_kg = kg;
  g_bodyweight_by_date[date] = kg;
  g_bodyweight_raw_by_date[date] = raw;
  g_bodyweight_dirty_dates[date] = true;
  g_bodyweight_refresh_status = '';
}

function refreshBodyweightFromShared()
{
  let date = g_view_date;

  g_bodyweight_refresh_status = 'pulling...';
  render();

  if (!window.storage || !window.storage.get)
  {
    g_bodyweight_refresh_status = 'shared unavailable';
    setSyncFailed('local only / shared storage unavailable');
    render();
    return;
  }

  window.storage.get(g_storage_key).then(function(result)
  {
    let payload;
    let bodyweight_kg;

    if (!result || !result.value)
    {
      g_bodyweight_refresh_status = 'no shared data';
      render();
      return;
    }

    payload = storagePayloadFromValue(result.value);
    bodyweight_kg = null;

    if (payload && payload.bodyweight_by_date && typeof payload.bodyweight_by_date == 'object')
    {
      bodyweight_kg = payload.bodyweight_by_date[date];
    }

    if (bodyweight_kg == null && date == todayISO() && payload && payload.bodyweight_kg != null)
    {
      bodyweight_kg = payload.bodyweight_kg;
    }

    if (bodyweight_kg == null)
    {
      g_bodyweight_refresh_status = 'not in shared';
      render();
      return;
    }

    g_bodyweight_by_date[date] = bodyweight_kg;
    delete g_bodyweight_raw_by_date[date];
    delete g_bodyweight_dirty_dates[date];
    if (date == todayISO()) g_bodyweight_kg = bodyweight_kg;

    saveLocalJson(JSON.stringify(makeSavePayload()));
    g_bodyweight_refresh_status = 'pulled ' + fmt1(bodyweight_kg) + ' kg';
    render();
  }).catch(function()
  {
    g_bodyweight_refresh_status = 'pull failed';
    setSyncFailed('local only / sync failed');
    render();
  });
}

function pushBodyweightToShared()
{
  let date = g_view_date;
  let bodyweight_kg = bodyweightForDate(date);

  g_bodyweight_refresh_status = 'pushing...';
  render();

  if (!window.storage || !window.storage.get || !window.storage.set)
  {
    g_bodyweight_refresh_status = 'shared unavailable';
    setSyncFailed('local only / shared storage unavailable');
    render();
    return;
  }

  window.storage.get(g_storage_key).then(function(result)
  {
    let payload = result && result.value ? storagePayloadFromValue(result.value) : makeSavePayload();
    let json_text;

    if (!payload || typeof payload != 'object') payload = makeSavePayload();
    if (!payload.bodyweight_by_date || typeof payload.bodyweight_by_date != 'object') payload.bodyweight_by_date = {};

    payload.bodyweight_by_date[date] = bodyweight_kg;
    if (date == todayISO()) payload.bodyweight_kg = bodyweight_kg;

    g_bodyweight_by_date[date] = bodyweight_kg;
    delete g_bodyweight_raw_by_date[date];
    delete g_bodyweight_dirty_dates[date];
    if (date == todayISO()) g_bodyweight_kg = bodyweight_kg;

    json_text = JSON.stringify(payload);

    if (result && result.revision) return window.storage.set(g_storage_key, json_text, result.revision);
    return window.storage.set(g_storage_key, json_text);
  }).then(function()
  {
    saveLocalJson(JSON.stringify(makeSavePayload()));
    g_bodyweight_refresh_status = 'pushed ' + fmt1(bodyweight_kg) + ' kg';
    render();
  }).catch(function()
  {
    g_bodyweight_refresh_status = 'push failed';
    setSyncFailed('local only / sync failed');
    render();
  });
}

function mergeBodyweightByDate(remote_bodyweight_by_date)
{
  if (!remote_bodyweight_by_date || typeof remote_bodyweight_by_date != 'object') return;

  for (let date in remote_bodyweight_by_date)
  {
    if (g_bodyweight_dirty_dates[date]) continue;
    if (remote_bodyweight_by_date[date] == null) continue;

    g_bodyweight_by_date[date] = remote_bodyweight_by_date[date];
    delete g_bodyweight_raw_by_date[date];
    if (date == todayISO()) g_bodyweight_kg = remote_bodyweight_by_date[date];
  }
}

function clearBodyweightDirtyDates()
{
  g_bodyweight_dirty_dates = {};
  g_bodyweight_raw_by_date = {};
}

function mergeScoopItems(remote_items)
{
  let local_keys = {};

  if (!Array.isArray(remote_items)) return;

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let item = g_scoop_items[i];
    if (item && item.key) local_keys[item.key] = true;
  }

  for (let i = 0; i < remote_items.length; ++i)
  {
    let item = remote_items[i];
    if (!item || !item.key || local_keys[item.key]) continue;

    copyScoopRawFields(item);
    g_scoop_items.push(item);
    local_keys[item.key] = true;
  }
}

function mergeDeletedLogEntryIds(ids)
{
  if (!ids || typeof ids != 'object') return;

  for (let id in ids)
  {
    if (ids[id]) g_deleted_log_entry_ids[id] = true;
  }
}

function pruneDeletedLogEntries()
{
  for (let date in g_log)
  {
    let day = g_log[date];
    if (!Array.isArray(day)) continue;

    for (let i = day.length - 1; i >= 0; --i)
    {
      if (day[i].id && g_deleted_log_entry_ids[day[i].id]) day.splice(i, 1);
    }
  }
}

function mergeLogEntries(remote_log)
{
  if (!remote_log || typeof remote_log != 'object') return;

  pruneDeletedLogEntries();

  for (let date in remote_log)
  {
    let remote_day = remote_log[date];
    let local_day = g_log[date];
    let local_ids = {};

    if (!Array.isArray(remote_day)) continue;

    if (!Array.isArray(local_day))
    {
      local_day = [];
      g_log[date] = local_day;
    }

    for (let i = 0; i < local_day.length; ++i)
    {
      if (local_day[i].id) local_ids[local_day[i].id] = true;
    }

    for (let i = 0; i < remote_day.length; ++i)
    {
      let entry = remote_day[i];
      if (!entry.id) continue;
      if (g_deleted_log_entry_ids[entry.id]) continue;
      if (local_ids[entry.id]) continue;

      local_day.push(entry);
      local_ids[entry.id] = true;
    }
  }
}

function mergeDeletedMassEventIds(ids)
{
  if (!ids || typeof ids != 'object') return;

  for (let id in ids)
  {
    if (ids[id]) g_deleted_mass_event_ids[id] = true;
  }
}

function pruneDeletedMassEvents()
{
  for (let date in g_mass_events)
  {
    let day = g_mass_events[date];
    if (!Array.isArray(day)) continue;

    for (let i = day.length - 1; i >= 0; --i)
    {
      if (day[i].id && g_deleted_mass_event_ids[day[i].id]) day.splice(i, 1);
    }
  }
}

function mergeMassEvents(remote_events)
{
  if (!remote_events || typeof remote_events != 'object') return;

  pruneDeletedMassEvents();

  for (let date in remote_events)
  {
    let remote_day = remote_events[date];
    let local_day = g_mass_events[date];
    let local_ids = {};

    if (!Array.isArray(remote_day)) continue;

    if (!Array.isArray(local_day))
    {
      local_day = [];
      g_mass_events[date] = local_day;
    }

    for (let i = 0; i < local_day.length; ++i)
    {
      if (local_day[i].id) local_ids[local_day[i].id] = true;
    }

    for (let i = 0; i < remote_day.length; ++i)
    {
      let event = remote_day[i];
      if (!event.id) continue;
      if (g_deleted_mass_event_ids[event.id]) continue;
      if (local_ids[event.id]) continue;

      local_day.push(event);
      local_ids[event.id] = true;
    }
  }
}

function migrateMassEvents()
{
  for (let date in g_mass_events)
  {
    let day = g_mass_events[date];
    if (!Array.isArray(day)) continue;

    for (let i = 0; i < day.length; ++i)
    {
      let event = day[i];
      if (!event.id) event.id = uid();
      if (!event.timestamp) event.timestamp = date + 'T00:00';
      if (event.event_type == 'water')
      {
        if (event.water_volume_ml != null) event.water_volume_ml = Math.round(Number(event.water_volume_ml) || 0);
        if (event.mass_in_kg == null && event.water_volume_ml != null) event.mass_in_kg = event.water_volume_ml/1000;
      }
      if (isMassCheckpoint(event) && event.body_mass_kg != null)
      {
        event.body_mass_kg = Math.round((Number(event.body_mass_kg) || 0)*100)/100;
      }
    }
  }
}

function mergeLoadedPayload(payload)
{
  if (!payload || typeof payload != 'object') return;

  if (payload.bodyweight_kg != null && !g_bodyweight_dirty_dates[todayISO()])
  {
    g_bodyweight_kg = payload.bodyweight_kg;
  }

  mergeBodyweightByDate(payload.bodyweight_by_date);

  mergeScoopItems(payload.scoop_items);
  mergeDeletedLogEntryIds(payload.deleted_log_entry_ids);
  mergeLogEntries(payload.log);
  mergeDeletedMassEventIds(payload.deleted_mass_event_ids);
  mergeMassEvents(payload.mass_events);
  pruneDeletedLogEntries();
  pruneDeletedMassEvents();
}

function saveLocalJson(json_text)
{
  try
  {
    localStorage.setItem(g_storage_key, json_text);
  }
  catch (e)
  {}
}

function saveUnsyncedFlag(value)
{
  try
  {
    if (value) localStorage.setItem(g_unsynced_key, '1');
    else localStorage.removeItem(g_unsynced_key);
  }
  catch (e)
  {}
}

function readUnsyncedFlag()
{
  try
  {
    return localStorage.getItem(g_unsynced_key) == '1';
  }
  catch (e)
  {
    return false;
  }
}

function scheduleSyncRetry()
{
  if (g_sync_retry_timer != null) return;

  g_sync_retry_timer = setTimeout(function()
  {
    g_sync_retry_timer = null;
    syncPendingChanges();
  }, 3000);
}

function syncPendingChanges()
{
  if (g_sync_in_flight || !g_unsynced_changes) return;

  if (!window.storage || !window.storage.get || !window.storage.set)
  {
    setSyncFailed('local only / shared storage unavailable');
    scheduleSyncRetry();
    return;
  }

  g_sync_in_flight = true;

  window.storage.get(g_storage_key).then(function(result)
  {
    let merged_json_text;
    let write_revision;

    if (!result || !result.revision) throw new Error('shared storage does not support safe revision checks');
    if (result.value) mergeLoadedPayload(storagePayloadFromValue(result.value));

    merged_json_text = JSON.stringify(makeSavePayload());
    saveLocalJson(merged_json_text);
    write_revision = g_local_revision;

    return window.storage.set(g_storage_key, merged_json_text, result.revision).then(function()
    {
      g_sync_in_flight = false;

      if (write_revision != g_local_revision)
      {
        syncPendingChanges();
        return;
      }

      clearBodyweightDirtyDates();
      setSyncOk();
    });
  }).catch(function(error)
  {
    g_sync_in_flight = false;

    if (error && error.status == 409)
    {
      if (error.result && error.result.value)
      {
        mergeLoadedPayload(storagePayloadFromValue(error.result.value));
        saveLocalJson(JSON.stringify(makeSavePayload()));
      }
      syncPendingChanges();
      return;
    }

    setSyncFailed('local only / sync failed');
    scheduleSyncRetry();
  });
}

function save()
{
  let json_text = JSON.stringify(makeSavePayload());

  saveLocalJson(json_text);
  g_unsynced_changes = true;
  saveUnsyncedFlag(true);
  ++g_local_revision;
  syncPendingChanges();
}

function load()
{
  g_unsynced_changes = readUnsyncedFlag();

  function applyLoaded(payload)
  {

    if (!payload) return;
    if (payload.target != null)
    {
      g_target = payload.target;
      g_target_raw = String(g_target);
    }

    if (payload.bodyweight_kg != null)
    {
      g_bodyweight_kg = payload.bodyweight_kg;
    }

    if (payload.bodyweight_by_date && typeof payload.bodyweight_by_date == 'object') g_bodyweight_by_date = payload.bodyweight_by_date;
    else g_bodyweight_by_date[todayISO()] = g_bodyweight_kg;
    clearBodyweightDirtyDates();

    for (let i = 0; i < payload.foods.length; ++i)
    {
      for (let j = 0; j < g_foods.length; ++j)
      {
        if (g_foods[j].key == payload.foods[i].key)
        {
          g_foods[j].daily = payload.foods[i].daily;
          g_foods[j].price = payload.foods[i].price;
          g_foods[j].daily_raw = String(g_foods[j].daily);
          g_foods[j].price_raw = g_foods[j].price != null ? String(g_foods[j].price) : '';
          if (payload.foods[i].package_units != null)
          {
            g_foods[j].package_units = payload.foods[i].package_units;
            g_foods[j].package_units_raw = String(g_foods[j].package_units);
          }
        }
      }
    }

    if (payload.scoop_items)
    {
      g_scoop_items = payload.scoop_items;

      for (let i = 0; i < g_scoop_items.length; ++i)
      {
        g_scoop_items[i].scoop_g_raw = g_scoop_items[i].scoop_g != null ? String(g_scoop_items[i].scoop_g) : '';
        g_scoop_items[i].protein_g_raw = g_scoop_items[i].protein_g != null ? String(g_scoop_items[i].protein_g) : '';
        g_scoop_items[i].kcal_raw = g_scoop_items[i].kcal != null ? String(g_scoop_items[i].kcal) : '';
      }
    }

    if (payload.log) g_log = payload.log;
    if (payload.deleted_log_entry_ids && typeof payload.deleted_log_entry_ids == 'object') g_deleted_log_entry_ids = payload.deleted_log_entry_ids;
    if (payload.mass_events && typeof payload.mass_events == 'object') g_mass_events = payload.mass_events;
    if (payload.deleted_mass_event_ids && typeof payload.deleted_mass_event_ids == 'object') g_deleted_mass_event_ids = payload.deleted_mass_event_ids;
    if (payload.collapsed_groups) g_collapsed_groups = payload.collapsed_groups;
  }

  function readLocal()
  {
    let stored_value;

    try
    {
      stored_value = localStorage.getItem(g_storage_key);
      return stored_value ? JSON.parse(stored_value) : null;
    }
    catch (e)
    {
      return null;
    }
  }

  function applyStorageValue(value)
  {
    applyLoaded(storagePayloadFromValue(value));
  }

  function finishLoad()
  {
    mergeKnownItems();
    migrateLogFormat();
    migrateTagsFormat();
    migrateMassEvents();
    pruneDeletedLogEntries();
    pruneDeletedMassEvents();
    render();
  }

  if (window.storage && window.storage.get)
  {
    window.storage.get(g_storage_key).then(function(result)
    {
      let local_payload = readLocal();

      if (result && result.value)
      {
        if (g_unsynced_changes && local_payload)
        {
          applyLoaded(local_payload);
          mergeLoadedPayload(storagePayloadFromValue(result.value));
        }
        else
        {
          applyStorageValue(result.value);
          mergeLoadedPayload(local_payload);
        }
      }
      else
      {
        applyLoaded(local_payload);
      }

      finishLoad();
      save();
    }, function()
    {
      setSyncFailed('local only / sync failed');
      applyLoaded(readLocal());
      finishLoad();
    }).catch(function(error)
    {
      renderStartupError('Could not load protein data', error);
    });
    return;
  }

  applyLoaded(readLocal());
  finishLoad();
  setSyncFailed('local only / shared storage unavailable');
}

function renderProteinKgScale(logged_protein)
{
  let scale_min = 1.2;
  let scale_max = 1.8;
  let scale_target = 1.666;
  let bodyweight_kg = bodyweightForDate(g_view_date);
  let bodyweight_raw = bodyweightRawForDate(g_view_date);
  let {mean_protein, mean_kcal, mean_bodyweight_kg} = calculateMeanLoggedProtein(g_view_date, 7);
  let ratio = bodyweight_kg > 0 ? logged_protein/bodyweight_kg : 0;
  let ratio_text = bodyweight_kg > 0 ? fmt2(ratio) : '—';
  let mean_ratio_text = bodyweight_kg > 0 ? fmt2(mean_protein/bodyweight_kg) : '—';
  let mean_protein_text = fmt0(mean_protein);
  let mean_kcal_text = fmt_1(mean_kcal);
  let mean_bodyweight_text = fmt1(mean_bodyweight_kg);
  let marker_pct = (ratio - scale_min)/(scale_max - scale_min)*100;
  let marker_clamped = Math.max(0.0, Math.min(100.0, marker_pct));
  let range_class = ratio < scale_min ? ' under' : ratio > scale_target ? ' over' : '';
  let marker_transform = '';
  if ((ratio < scale_min) || (ratio > scale_max))
  {
    marker_transform = `; transform: translateX(${(marker_pct - 50).toFixed()}%)`;
  }
  let refresh_status = g_bodyweight_refresh_status ? `<span class="bodyweight-refresh-status">${esc(g_bodyweight_refresh_status)}</span>` : '';
  let h = '';

  h += `<div class="protein-kg-scale${range_class}">
    <div class="protein-kg-scale-head">
      <span>protein/bodyweight</span>
      <span class="protein-kg-controls">
        <label>kg</label>
        <input type="text" inputmode="decimal" id="bodyweight-input" value="${bodyweight_raw}">
        <button class="smallbtn bodyweight-refresh" data-a="bodyweight-pull" title="pull bodyweight from shared storage" aria-label="pull bodyweight from shared storage">↓</button>
        <button class="smallbtn bodyweight-refresh" data-a="bodyweight-push" title="push bodyweight to shared storage" aria-label="push bodyweight to shared storage">↑</button>
        <strong>${ratio_text} g/kg</strong>
        ${refresh_status}
      </span>
    </div>
    <div class="protein-kg-track">
      <span class="protein-kg-marker${range_class}" style="left:${marker_clamped}%${marker_transform}"></span>
      <span class="protein-kg-tick" style="left:0%"><i></i><b>1.2</b></span>
      <span class="protein-kg-tick" style="left:33.333%"><i></i><b>1.4</b></span>
      <span class="protein-kg-tick" style="left:66.667%"><i></i><b>1.6</b></span>
      <span class="protein-kg-tick" style="left:100%"><i></i><b>1.8</b></span>
    </div>
    <span class="protein-kg-note"><p>Weekly averages:</p>
      <span class="protein-kg-note-protein">${mean_protein_text}</span>
      <span>(${mean_ratio_text}/kg)</span>
      <span class="protein-kg-note-kcal">${mean_kcal_text}</span>
      <span>(${fmt1(mean_kcal/mean_protein)}/g)</span>
      <span class="protein-kg-note-bodyweight">${mean_bodyweight_text} kg</span>
    </span>
  </div>`;

  return h;
}

function renderLoadoutSection()
{
  let total = totalDailyProtein();
  let diff = total - g_target;
  let cost = totalMonthlyCost();
  let diff_label = diff >= 0 ? 'over target' : 'under target';
  let diff_class = diff >= 0 ? 'over' : 'under';
  let diff_sign = diff >= 0 ? '+' : '';
  let cost_text = cost > 0 ? '$' + fmt2(cost) : '—';
  let h = '';

  h += `<div class="summary">
    <div class="cell"><div class="lab">total protein</div><div class="val">${fmt1(total)} g</div></div>
    <div class="cell"><div class="lab">${diff_label}</div><div class="val ${diff_class}">${diff_sign}${fmt1(diff)} g</div></div>
    <div class="cell"><div class="lab">est. monthly cost</div><div class="val">${cost_text}</div></div>
  </div>`;

  h += `<table><thead><tr>
    <th>food</th><th class="num">daily</th><th class="num">protein/day</th><th class="num">per week</th><th class="num">units/pkg</th><th class="num">price/pkg</th>
  </tr></thead><tbody>`;

  for (let i = 0; i < g_foods.length; ++i)
  {
    let food = g_foods[i];
    let per_gram = proteinPerGram(food);
    let daily_protein = dailyProtein(food);
    let weekly = weeklyAmount(food);
    let packs = packagesPerWeek(food);
    let unit_label = food.kind == 'unit' ? fmt1(per_gram*food.unit_grams) + ' g protein/egg' : fmt1(per_gram*100) + ' g protein/100g';
    let daily_unit = food.kind == 'unit' ? 'eggs' : 'g';
    let weekly_text;
    let package_units_cell;
    let price_cell;

    if (food.no_package)
    {
      weekly_text = fmt1(weekly) + ' g/wk';
    }
    else if (packs != null)
    {
      weekly_text = fmt2(packs) + ' pkg/wk';
    }
    else
    {
      weekly_text = fmt1(weekly) + ' ' + (food.kind == 'unit' ? 'eggs/wk' : 'g/wk');
    }

    if (food.package_units != null)
    {
      package_units_cell = `<input type="text" inputmode="decimal" data-key="${food.key}" data-field="units" value="${food.package_units_raw}">`;
    }
    else
    {
      package_units_cell = '<span class="pack-out">—</span>';
    }

    if (!food.no_package)
    {
      price_cell = `<input type="text" inputmode="decimal" data-key="${food.key}" data-field="price" value="${food.price_raw}" placeholder="—">`;
    }
    else
    {
      price_cell = '<span class="pack-out">—</span>';
    }

    h += `<tr class="food">
      <td><span class="foodname">${food.name}<span class="unit">${unit_label}</span></span></td>
      <td class="num"><input type="text" inputmode="decimal" data-key="${food.key}" data-field="daily" value="${food.daily_raw}"> ${daily_unit}</td>
      <td class="num protein-out">${fmt1(daily_protein)} g</td>
      <td class="num pack-out">${weekly_text}</td>
      <td class="num">${package_units_cell}</td>
      <td class="num pack">${price_cell}</td>
    </tr>`;
  }

  h += `</tbody></table>`;

  h += `<div class="note">Package sizes and protein content are fixed per your on-hand packaging. Edit daily amount (grams, or eggs for eggs) and package price to update totals. Data persists locally.</div>`;

  return h;
}

function renderMassDailySummaries()
{
  let dates = {};
  let list = [];
  let h = '';

  for (let date in g_mass_events)
  {
    if (Array.isArray(g_mass_events[date]) && g_mass_events[date].length) dates[date] = true;
  }
  dates[g_view_date] = true;

  for (let date in dates) list.push(date);
  list.sort();
  list.reverse();
  if (list.length > 7) list = list.slice(0, 7);

  h += `<div class="mass-daily">
    <div class="mass-section-head">daily summaries</div>
    <table class="mass-daily-table"><thead><tr>
      <th>date</th>
      <th class="num">water</th>
      <th class="num">food</th>
      <th class="num">in</th>
      <th class="num">out</th>
      <th class="num">delta</th>
      <th class="num">first</th>
      <th class="num">last</th>
      <th class="num">change</th>
      <th class="num">min</th>
    </tr></thead><tbody>`;

  for (let i = 0; i < list.length; ++i)
  {
    let s = massSummaryForDate(list[i]);
    if (!s.checkpoint_count && !s.water_in_ml && !s.total_mass_in_g) continue;

    let delta_kg = (s.total_mass_in_g - s.inferred_mass_out_g)/1000.0;
    h += `<tr>
      <td>${esc(s.date)}</td>
      <td class="num">${esc(Math.round(s.water_in_ml))} mL</td>
      <td class="num">${esc(s.net_bracket_mass_in_g)} g</td>
      <td class="num">${formatMassKg(s.total_mass_in_g/1000)}</td>
      <td class="num">${formatMassKg(s.inferred_mass_out_g/1000)}</td>
      <td class="num">${formatMassKg(delta_kg)}</td>
      <td class="num">${esc(s.first_mass_kg != null ? fmt2(s.first_mass_kg) : '—')}</td>
      <td class="num">${esc(s.last_mass_kg != null ? fmt2(s.last_mass_kg) : '—')}</td>
      <td class="num">${esc(s.mass_change_kg != null ? formatMassKg(s.mass_change_kg, true) : '—')}</td>
      <td class="num">${s.min_mass_kg != null ? fmt2(s.min_mass_kg) : '—'}</td>
    </tr>`;
  }

  h += `</tbody></table></div>`;

  return h;
}

function renderGroupedItems(is_today)
{
  let h = '';
  let flat;

  if (g_flatten_view)
  {
    flat = sortedActiveScoopItems().map(function(item)
    {
      return { item:item, sortname:(itemMatchesSearch(item) ? '0_' : '1_') + (tagsMatchActive(itemTags(item)) ? '0_' : '1_') + item.name.toLowerCase() };
    });

    flat.sort(function(a, b)
    {
      return a.sortname < b.sortname ? -1 : a.sortname > b.sortname ? 1 : 0;
    });

    for (let i = 0; i < flat.length; ++i) h += renderItemRow(flat[i].item, is_today, false, 'standalone');
    return h;
  }

  let nodes = groupedNodes();

  for (let i = 0; i < nodes.length; ++i)
  {
    let n = nodes[i];
    if (n.type == 'item')
    {
      h += renderItemRow(n.item, is_today, false, 'standalone');
      continue;
    }

    h += renderGroupHeader(n.group);
    if (!g_collapsed_groups[n.group.key])
    {
      let members = sortedGroupMembersForDisplay(n.group);
      for (let j = 0; j < members.length; ++j) h += renderItemRow(members[j], is_today, true, n.group.key);
    }
  }

  return h;
}

function saveGroupRename()
{
  let new_name = g_group_rename_draft.trim();
  let new_key;

  if (!new_name) return;

  new_key = new_name.toLowerCase();

  for (let i = 0; i < g_scoop_items.length; ++i)
  {
    let tags = itemTags(g_scoop_items[i]);
    for (let j = 0; j < tags.length; ++j)
    {
      if (tags[j].toLowerCase() == g_group_rename_key) tags[j] = new_name;
    }
    g_scoop_items[i].tags = tags;
  }

  if (new_key != g_group_rename_key && g_collapsed_groups[g_group_rename_key] != null)
  {
    g_collapsed_groups[new_key] = g_collapsed_groups[g_group_rename_key];
    delete g_collapsed_groups[g_group_rename_key];
  }

  g_group_rename_key = null;
  g_group_rename_draft = '';
  render();
  save();
}

function calculateMeanLoggedProtein(start_date, ndays)
{
  let total_protein = 0;
  let total_kcal = 0;
  let total_bodyweight_kg = 0;
  let protein_days = 0;
  let kcal_days = 0;
  let bodyweight_days = 0;
  let result = {mean_protein: 0, mean_kcal: 0, mean_bodyweight_kg: 0};

  for (let d = 0; d < ndays; ++d)
  {
    let date = shiftDateISO(start_date, -d);
    let day_totals = dayTotals(date);
    let bodyweight_kg = bodyweightForDate(date);

    let protein = day_totals.protein;
    total_protein += protein;
    protein_days += protein > 0;

    let kcal = day_totals.kcal;
    total_kcal += kcal;
    kcal_days += kcal > 0;

    total_bodyweight_kg += bodyweight_kg;
    bodyweight_days += bodyweight_kg > 0;
  }

  if (protein_days) { result.mean_protein = total_protein/protein_days; }
  if (kcal_days) { result.mean_kcal = total_kcal/kcal_days; }
  if (bodyweight_days) { result.mean_bodyweight_kg = total_bodyweight_kg/bodyweight_days; }

  return result;
}

  else if (grouprename_field) restored = document.querySelector('[data-grouprename]');
  else if (adddraft_field) restored = document.querySelector('[data-adddraft="'+adddraft_field+'"]');
  else if (editdraft_field) restored = document.querySelector('[data-editdraft="'+editdraft_field+'"]');
  else if (lognote_id) restored = document.querySelector('[data-lognote="'+lognote_id+'"]');
  else if (massdraft_field) restored = document.querySelector('[data-massdraft="'+massdraft_field+'"]');
  else if (massedit_field) restored = document.querySelector('[data-massedit="'+massedit_field+'"]');
  else restored = null;

  if (!restored) return;

  restored.focus();
  if (sel_start != null) restored.setSelectionRange(sel_start, sel_end);
  if (restored.scrollLeft != null) restored.scrollLeft = scroll_left;

  setTimeout(function()
  {
    if (restored.scrollLeft == null) return;
    restored.scrollLeft = scroll_left;
  }, 0);
}

function fitDraftTextarea(target)
{
  if (!target || target.tagName != 'TEXTAREA') return;

  target.style.height = 'auto';
  target.style.height = target.scrollHeight + 'px';
}

function fitDraftTextareas()
{
  let fields = document.querySelectorAll('.addform textarea[data-adddraft="name"], .addform textarea[data-adddraft="brand"], .addform textarea[data-editdraft="name"], .addform textarea[data-editdraft="brand"]');

  for (let i = 0; i < fields.length; ++i)
  {
    fitDraftTextarea(fields[i]);
  }
}

function defaults()
{
  return [
    { key:'egg',          daily:2,   price:null, package_units:12 },
    { key:'seitan',       daily:96,  price:null },
    { key:'pink_salmon',  daily:170, price:3.40 },
    { key:'edamame',      daily:80,  price:null },
    { key:'barramundi',   daily:70,  price:null },
    { key:'skyr',         daily:200, price:null },
    { key:'rice',         daily:57,  price:15 }
  ];
}

document.addEventListener('input', function(ev)
{
  let target = ev.target;
  let num;

  if (target.dataset && target.dataset.lognote)
  {
    let day = g_log[g_view_date] || [];
    for (let i = 0; i < day.length; ++i)
    {
      if (day[i].id == target.dataset.lognote)
      {
        day[i].note = target.value;
        break;
      }
    }
    renderPreservingFocus();
    save();
    return;
  }

  if (target.id == 'scoop-search')
  {
    g_scoop_search_raw = target.value;
    renderPreservingFocus();
    return;
  }

  if (target.id == 'target-input')
  {
    g_target_raw = target.value;
    num = parseFloat(target.value);
    g_target = isNaN(num) ? 0 : num;
    renderPreservingFocus();
    save();
    return;
  }

  if (target.id == 'bodyweight-input')
  {
    num = parseFloat(target.value);
    setBodyweightForDate(g_view_date, isNaN(num) ? 0 : num, target.value);
    renderPreservingFocus();
    save();
    return;
  }

  if (target.dataset && target.dataset.masswater == 'slider')
  {
    let value = Math.round(parseFloat(target.value));
    let input = document.getElementById('mass-water-input');

    if (isNaN(value)) value = g_default_water_ml;
    g_water_slider_ml = value;
    g_water_slider_raw = String(value);
    if (input) input.value = g_water_slider_raw;
    return;
  }

  if (target.dataset && target.dataset.masswater == 'text')
  {
    let value;

    g_water_slider_raw = target.value;
    value = parseWaterSliderText();
    syncWaterSliderToValue(value);
    return;
  }

  if (target.dataset && target.dataset.massdraft && g_mass_entry_draft)
  {
    if (target.dataset.massdraft == 'timestamp') g_mass_entry_draft.timestamp = target.value;
    if (target.dataset.massdraft == 'body_mass') g_mass_entry_draft.body_mass_raw = target.value;
    if (target.dataset.massdraft == 'water_loss') g_mass_entry_draft.water_loss = !!target.checked;
    if (target.dataset.massdraft == 'anchor_reset') g_mass_entry_draft.anchor_reset = !!target.checked;
    return;
  }

  if (target.dataset && target.dataset.massedit && g_mass_edit_draft)
  {
    if (target.dataset.massedit == 'timestamp') g_mass_edit_draft.timestamp = target.value;
    if (target.dataset.massedit == 'body_mass') g_mass_edit_draft.body_mass_raw = target.value;
    if (target.dataset.massedit == 'water_volume') g_mass_edit_draft.water_volume_raw = target.value;
    if (target.dataset.massedit == 'water_loss') g_mass_edit_draft.water_loss = !!target.checked;
    if (target.dataset.massedit == 'anchor_reset') g_mass_edit_draft.anchor_reset = !!target.checked;
    return;
  }

  if (target.dataset.field == 'import-text')
  {
    g_import_text = target.value;
    g_import_pending = null;
    return;
  }

  if (target.dataset.field == 'mass-import-text')
  {
    g_mass_import_text = target.value;
    g_mass_import_pending = null;
    return;
  }

  let scoop_key = target.dataset.scaledraft;
  if (scoop_key && g_scale_draft)
  {
    if (scoop_key == 'scale')
    {
      liveScalePreview(parseFloat(target.value));
      return;
    }
    if (scoop_key == 'grams')
    {
      g_scale_draft.grams_raw = target.value;
      recomputeScaleDraft('grams');
      renderPreservingFocus();
      return;
    }
    if (scoop_key == 'protein_g')
    {
      g_scale_draft.protein_g_raw = target.value;
      num = parseFloat(target.value);
      g_scale_draft.protein_g = isNaN(num) ? null : num;
      return;
    }
    if (scoop_key == 'kcal')
    {
      g_scale_draft.kcal_raw = target.value;
      num = parseFloat(target.value);
      g_scale_draft.kcal = isNaN(num) ? null : num;
      return;
    }
  }

  if (target.dataset.custom == 'protein')
  {
    let old_num = parseFloat(g_custom_protein_raw);
    let old_estimate = !isNaN(old_num) && old_num > 0 ? String(customKcalEstimate(old_num)) : '';
    let new_num;

    g_custom_protein_raw = target.value;
    new_num = parseFloat(g_custom_protein_raw);
    if (!g_custom_kcal_raw || g_custom_kcal_raw == old_estimate)
    {
      g_custom_kcal_raw = !isNaN(new_num) && new_num > 0 ? String(customKcalEstimate(new_num)) : '';
    }
    g_custom_status = '';
    renderPreservingFocus();
    return;
  }

  if (target.dataset.custom == 'kcal')
  {
    g_custom_kcal_raw = target.value;
    g_custom_status = '';
    return;
  }

  if (target.dataset.grouprename)
  {
    g_group_rename_draft = target.value;
    renderPreservingFocus();
    return;
  }

  let adddraft_field = target.dataset.adddraft;
  if (adddraft_field)
  {
    g_scoop_add_draft[adddraft_field] = target.value;
    fitDraftTextarea(target);
    if (adddraft_field == 'scoop_g' || adddraft_field == 'macro_protein' || adddraft_field == 'macro_kcal')
    {
      renderPreservingFocus();
    }
    return;
  }

  if (target.dataset.editdraft == 'tags' && g_edit_draft)
  {
    g_edit_draft.tags = target.value;
    updateTagSuggestions(target);
    return;
  }

  let editdraft_field = target.dataset.editdraft;
  if (editdraft_field)
  {
    g_edit_draft[editdraft_field] = target.value;
    fitDraftTextarea(target);
    if (editdraft_field == 'name' || editdraft_field == 'brand') return;
    if (editdraft_field == 'volume') return;
    if (editdraft_field == 'scoop_g' || editdraft_field == 'macro_protein' || editdraft_field == 'macro_kcal') recomputeEditDraftMacros();
    renderPreservingFocus();
    return;
  }

  let key = target.dataset.key;
  let field = target.dataset.field;
  if (!key) return;

  for (let i = 0; i < g_foods.length; ++i)
  {
    if (g_foods[i].key != key) continue;
    let food = g_foods[i];

    num = parseFloat(target.value);
    if (field == 'daily')
    {
      food.daily_raw = target.value;
      food.daily = isNaN(num) ? 0 : num;
    }
    if (field == 'price')
    {
      food.price_raw = target.value;
      food.price = target.value.trim() == '' ? null : (isNaN(num) ? null : num);
    }
    if (field == 'units')
    {
      food.package_units_raw = target.value;
      food.package_units = isNaN(num) ? 0 : num;
    }
  }

  renderPreservingFocus();
  save();
});

document.addEventListener('focusin', function(ev)
{
  if (ev.target && ev.target.dataset && ev.target.dataset.editdraft == 'tags') updateTagSuggestions(ev.target);
});

document.addEventListener('focusout', function(ev)
{
  if (!ev.target || !ev.target.dataset || ev.target.dataset.editdraft != 'tags') return;

  setTimeout(function()
  {
    let list = document.getElementById('tag-suggest');
    if (list) list.classList.remove('open');
  }, 160);
});

document.addEventListener('change', function(ev)
{
  let target = ev.target;

  if (target.dataset && target.dataset.massdraft == 'water_loss' && g_mass_entry_draft)
  {
    g_mass_entry_draft.water_loss = !!target.checked;
    return;
  }

  if (target.dataset && target.dataset.massdraft == 'anchor_reset' && g_mass_entry_draft)
  {
    g_mass_entry_draft.anchor_reset = !!target.checked;
    return;
  }

  if (target.dataset && target.dataset.massedit == 'water_loss' && g_mass_edit_draft)
  {
    g_mass_edit_draft.water_loss = !!target.checked;
    return;
  }

  if (target.dataset && target.dataset.massedit == 'anchor_reset' && g_mass_edit_draft)
  {
    g_mass_edit_draft.anchor_reset = !!target.checked;
    return;
  }

  if (target.dataset && target.dataset.a == 'import-file')
  {
    let file = target.files && target.files[0];
    if (file) readImportFile(file);
    return;
  }

  if (target.dataset && target.dataset.a == 'mass-import-file')
  {
    let file = target.files && target.files[0];
    if (file) readMassImportFile(file);
    return;
  }

  if (target.dataset && target.dataset.scaledraft == 'scale' && g_scale_draft)
  {
    g_scale_draft.scale = parseFloat(target.value);
    recomputeScaleDraft('scale');
    render();
  }
});

document.addEventListener('click', function(ev)
{
  let target = ev.target.closest('[data-a]');
  let action;
  let defs;

  if (!target) return;
  action = target.dataset.a;

  switch (action)
  {
    case 'tab-open':
      g_active_tab = target.dataset.tab == 'loadout' || target.dataset.tab == 'mass' ? target.dataset.tab : 'pantry';
      render();
      load();
      return;

    case 'reset':
      defs = defaults();
      for (let i = 0; i < g_foods.length; ++i)
      {
        for (let j = 0; j < defs.length; ++j)
        {
          if (g_foods[i].key != defs[j].key) continue;
          g_foods[i].daily = defs[j].daily;
          g_foods[i].price = defs[j].price;
          g_foods[i].daily_raw = String(g_foods[i].daily);
          g_foods[i].price_raw = g_foods[i].price != null ? String(g_foods[i].price) : '';
          if (defs[j].package_units != null)
          {
            g_foods[i].package_units = defs[j].package_units;
            g_foods[i].package_units_raw = String(g_foods[i].package_units);
          }
        }
      }
      g_target = 128;
      g_target_raw = '128';
      g_bodyweight_kg = 82;
      g_bodyweight_by_date[todayISO()] = g_bodyweight_kg;
      g_bodyweight_dirty_dates[todayISO()] = true;
      render();
      save();
      return;

    case 'date-prev':
      g_view_date = shiftDateISO(g_view_date, -1);
      render();
      return;

    case 'date-next':
      if (g_view_date >= todayISO()) return;
      g_view_date = shiftDateISO(g_view_date, 1);
      render();
      return;

    case 'date-today':
      g_view_date = todayISO();
      render();
      return;

    case 'admin-toggle':
      g_admin_mode = !g_admin_mode;
      render();
      return;

    case 'adjusted-log-toggle':
      g_adjusted_log_open = !g_adjusted_log_open;
      render();
      return;

    case 'logged-food-details-toggle':
      g_logged_food_details_open = !g_logged_food_details_open;
      render();
      return;

    case 'logged-foods-toggle':
      g_logged_foods_open = !g_logged_foods_open;
      render();
      return;

    case 'scoop-add':
      if (!viewDateIsEditable()) return;
      addScoop(target.dataset.key);
      render();
      save();
      return;

    case 'scoop-remove':
      if (!viewDateIsEditable()) return;
      removeScoop(target.dataset.key);
      render();
      save();
      return;

    case 'scoop-fetch':
      requestFetchOFF(target.dataset.key, target.dataset.context, g_edit_draft ? g_edit_draft.barcode : null);
      return;

    case 'scoop-fetch-confirm':
      doFetchOFF(target.dataset.key);
      return;

    case 'scoop-fetch-cancel':
      cancelFetchOFF(target.dataset.key);
      return;

    case 'scoop-add-item-open':
      g_scoop_add_draft = { barcode:'', name:'', brand:'', scoop_g:'', macro_mode:'100g', macro_protein:'', macro_kcal:'' };
      g_add_item_status = '';
      render();
      return;

    case 'scoop-add-item-cancel':
      g_scoop_add_draft = null;
      render();
      return;

    case 'scoop-add-item-save':
      saveAddItemDraft();
      return;

    case 'addex-lookup-off':
      lookupOFFForAddItem();
      return;

    case 'add-macro-mode':
      switchDraftMacroMode(g_scoop_add_draft, target.dataset.mode);
      render();
      return;

    case 'edit-macro-mode':
      switchDraftMacroMode(g_edit_draft, target.dataset.mode);
      render();
      return;

    case 'scoop-edit-open':
      openScoopEdit(target.dataset.key, target.dataset.context);
      return;

    case 'scoop-edit-cancel':
      cancelScoopEdit();
      return;

    case 'scoop-edit-save':
      saveScoopEdit();
      return;

    case 'scoop-edit-archive':
      archiveScoopEdit(true);
      return;

    case 'scoop-edit-unarchive':
      archiveScoopEdit(false);
      return;

    case 'scoop-scale-open':
      openScaleEdit(target.dataset.key, target.dataset.context);
      return;

    case 'scoop-scale-close':
      closeScaleEdit();
      return;

    case 'scoop-scale-reset':
      resetScaleDraft();
      render();
      return;

    case 'scoop-scale-log':
      logScaledEntry();
      return;

    case 'scoop-entry-delete':
      if (!viewDateIsEditable()) return;
      removeLogEntry(target.dataset.entry);
      render();
      save();
      return;

    case 'custom-log':
      logCustomEntry();
      return;

    case 'custom-remove':
      if (!viewDateIsEditable()) return;
      removeScoop('custom');
      render();
      save();
      return;

    case 'mass-water-add':
      addMassWater(target.dataset.ml);
      return;

    case 'mass-water-slider-log':
      addMassWater(parseWaterSliderText() || g_water_slider_ml);
      return;

    case 'mass-entry-open':
      openMassEntryDraft(target.dataset.type);
      return;

    case 'mass-entry-save':
      saveMassEntryDraft();
      return;

    case 'mass-entry-cancel':
      cancelMassEntryDraft();
      return;

    case 'mass-event-edit':
      openMassEventEdit(target.dataset.event);
      return;

    case 'mass-event-save':
      saveMassEventEdit();
      return;

    case 'mass-event-cancel':
      cancelMassEventEdit();
      return;

    case 'mass-event-delete':
      deleteMassEvent(target.dataset.event);
      return;

    case 'group-toggle':
      toggleGroupCollapse(target.dataset.group);
      return;

    case 'group-rename-open':
      openGroupRename(target.dataset.group, target.dataset.name);
      return;

    case 'group-rename-cancel':
      cancelGroupRename();
      return;

    case 'group-rename-save':
      saveGroupRename();
      return;

    case 'tag-suggest-pick':
      pickTagSuggestion(target.dataset.tag);
      return;

    case 'tag-filter-toggle':
      if (g_active_tags[target.dataset.tag]) delete g_active_tags[target.dataset.tag];
      else g_active_tags[target.dataset.tag] = true;
      render();
      return;

    case 'lookup-debug-clear':
      g_last_lookup_debug = null;
      render();
      return;

    case 'flatten-toggle':
      toggleFlattenView();
      return;

    case 'print-scoop':
      try
      {
        window.print();
        g_print_status = 'print dialog requested. If nothing opened, this preview may be blocking it — open the downloaded file directly in a browser tab, or use "export data" below.';
      }
      catch (e)
      {
        g_print_status = 'print blocked — ' + e.message + '. Use "export data" below instead.';
      }
      render();
      return;

    case 'export-toggle':
      g_export_open = !g_export_open;
      g_copy_status = '';
      render();
      return;

    case 'export-fmt':
      g_export_fmt = target.dataset.f;
      render();
      return;

    case 'export-copy':
      copyText(buildCurrentExportText());
      return;

    case 'export-download':
      if (g_export_fmt == 'json') downloadText('protein-loadout-export-' + todayISO() + '.json', 'application/json', buildExportJSON());
      else if (g_export_fmt == 'bodyweight_kcal_csv') downloadText('protein-bodyweight-kcal-' + todayISO() + '.csv', 'text/csv', buildBodyweightKcalCSV());
      else downloadText('protein-loadout-export-' + todayISO() + '.txt', 'text/plain', buildDiaryText());
      return;

    case 'mass-export-copy':
      copyText(buildBodyweightKcalCSV());
      return;

    case 'mass-export-download':
      downloadText('protein-bodyweight-kcal-' + todayISO() + '.csv', 'text/csv', buildBodyweightKcalCSV());
      return;

    case 'mass-json-copy':
      copyText(buildMassEventsExportJSON());
      return;

    case 'mass-json-download':
      downloadText('protein-mass-events-' + todayISO() + '.json', 'application/json', buildMassEventsExportJSON());
      return;

    case 'mass-import-parse':
      parseMassImportText();
      return;

    case 'mass-import-merge':
      applyMergeMassImport();
      return;

    case 'mass-import-replace':
      if (!window.confirm('Replace only water/mass-balance data with this import?')) return;
      applyReplaceMassImport();
      return;

    case 'mass-import-cancel':
      cancelMassImport();
      return;

    case 'bodyweight-refresh':
    case 'bodyweight-pull':
      refreshBodyweightFromShared();
      return;

    case 'bodyweight-push':
      pushBodyweightToShared();
      return;

    case 'import-toggle':
      g_import_open = !g_import_open;
      g_import_pending = null;
      g_import_status = '';
      render();
      return;

    case 'import-parse':
      parseImportText();
      return;

    case 'import-merge':
      applyMergeImport();
      return;

    case 'import-replace':
      if (!window.confirm('Replace everything currently in the app with this backup?')) return;
      applyReplaceImport();
      return;

    case 'import-cancel':
      cancelImport();
      return;
  }
});

window.addEventListener('error', function(event)
{
  renderBlankStartupError('Could not start protein_loadout', event.error || event.message);
});

window.addEventListener('unhandledrejection', function(event)
{
  renderBlankStartupError('Could not finish loading protein_loadout', event.reason);
});

window.addEventListener('beforeunload', function(event)
{
  if (!g_sync_failed && !g_unsynced_changes) return;

  event.preventDefault();
  event.returnValue = '';
});

function shouldGuardBrowserBack()
{
  if (navigator.maxTouchPoints > 0) return true;
  if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) return true;
  return false;
}

function armBrowserBackGuard()
{
  if (!shouldGuardBrowserBack()) return;
  if (history.state && history.state.protein_loadout_guard) return;

  history.replaceState({ protein_loadout_root:true }, '', window.location.href);
  history.pushState({ protein_loadout_guard:true }, '', window.location.href);
}

window.addEventListener('popstate', function(event)
{
  if (!shouldGuardBrowserBack()) return;
  if (event.state && event.state.protein_loadout_guard) return;

  history.forward();
  if (g_sync_failed || g_unsynced_changes) setSyncFailed(g_sync_status || 'local only / sync failed');
});

window.addEventListener('pageshow', armBrowserBackGuard);
window.addEventListener('online', syncPendingChanges);
armBrowserBackGuard();

if ('serviceWorker' in navigator)
{
  navigator.serviceWorker.register('/protein-service-worker.js', { updateViaCache:'none' }).catch(function(){});
}

load();
</script>
